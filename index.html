<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>临江大学 · 新生手册</title>
<style>
:root{
  --bg:#0a0b0d; --panel:#111216; --line:#22242a;
  --txt:#c8c5be; --dim:#6f6c66; --red:#8c2b2b; --red2:#c04a4a; --gold:#b39a5f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% -10%,#191b20 0%,transparent 62%),var(--bg);
  color:var(--txt);
  font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
  display:flex;justify-content:center;min-height:100vh;overflow-x:hidden;
}
#app{width:100%;max-width:760px;min-height:100vh;display:flex;flex-direction:column;padding:0 18px 28px;}
#top{position:sticky;top:0;z-index:20;background:linear-gradient(#0a0b0d 70%,rgba(10,11,13,0));padding:14px 0 10px;}
#topbar{display:flex;align-items:center;gap:10px;justify-content:space-between}
#chapter{font-size:12px;letter-spacing:.28em;color:var(--red2);opacity:.9}
#menubtns{display:flex;gap:8px}
.mbtn{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:12px;padding:5px 11px;border-radius:2px;cursor:pointer;letter-spacing:.1em;transition:.2s;}
.mbtn:hover{border-color:var(--red);color:var(--red2)}
#status{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11px;color:var(--dim);letter-spacing:.08em}
#sanwrap{flex:1;height:3px;background:#1c1e23;border-radius:2px;overflow:hidden;max-width:220px}
#sanbar{height:100%;width:100%;background:linear-gradient(90deg,#5d4a2a,#b39a5f);transition:width .5s,background .5s}
#itemtxt{max-width:36%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
#itemtxt:hover{color:var(--gold)}
#story{flex:1;padding:22px 2px 10px;animation:fade .55s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1.title{font-size:19px;font-weight:400;letter-spacing:.22em;color:#ded9cf;margin:0 0 20px;padding-left:12px;border-left:2px solid var(--red);}
#text{font-size:16px;line-height:2.05;letter-spacing:.03em;white-space:pre-wrap;color:#bdb9b1}
#text .r{color:var(--red2)}
#text .g{color:var(--gold)}
#text .d{color:var(--dim);font-size:14px}
#choices{margin-top:26px;display:flex;flex-direction:column;gap:11px}
.ch{display:block;width:100%;text-align:left;cursor:pointer;background:linear-gradient(90deg,rgba(30,32,38,.85),rgba(20,21,25,.55));border:1px solid var(--line);border-left:2px solid #33363d;color:#b8b4ac;font-family:inherit;font-size:15px;line-height:1.7;padding:14px 16px;border-radius:2px;transition:.22s;}
.ch:hover{border-left-color:var(--red2);color:#e6e1d7;background:linear-gradient(90deg,rgba(60,30,30,.5),rgba(20,21,25,.5));transform:translateX(3px)}
.ch .hint{display:block;font-size:11.5px;color:#5d5a55;margin-top:5px;letter-spacing:.05em}
.ch.locked{opacity:.5;cursor:not-allowed;filter:grayscale(.8);border-left-color:#3a2a2a;border-style:dashed;background:linear-gradient(90deg,rgba(28,24,24,.75),rgba(18,18,20,.5));}
.ch.locked:hover{transform:none;border-left-color:#3a2a2a;color:#a8a49c;background:linear-gradient(90deg,rgba(28,24,24,.75),rgba(18,18,20,.5));}
.ch.locked .hint{color:#6a4a4a}
.ch.locked .hint b{color:#a05a5a;font-weight:400;letter-spacing:.06em}
.ch.cleared{border-left-color:#3a4a3a}
.ch.cleared::before{content:"◆ ";color:#5a8a5a;font-size:11px}
.ending-box{margin-top:34px;text-align:center;animation:fade .9s ease}
.ending-tag{font-size:12px;letter-spacing:.5em;color:var(--red2);margin-bottom:14px}
.ending-name{font-size:26px;letter-spacing:.18em;color:#e8e2d6;margin-bottom:20px}
.ending-sub{font-size:13px;color:var(--dim);line-height:2;letter-spacing:.06em}
#mask{position:fixed;inset:0;background:rgba(4,5,7,.9);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:60;padding:18px;}
#mask.on{display:flex}
.panel{width:100%;max-width:480px;background:#0e0f12;border:1px solid var(--line);border-radius:3px;padding:22px;max-height:82vh;overflow-y:auto;}
.panel h2{font-size:14px;letter-spacing:.3em;color:var(--red2);font-weight:400;margin:0 0 18px}
.slot{border:1px solid var(--line);padding:12px 14px;margin-bottom:9px;border-radius:2px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.slot .info{color:#9a968f;line-height:1.6;flex:1;min-width:0}
.slot .info b{color:#cdc8bf;font-weight:400}
.slot .info small{color:#5d5a55;font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .info small.wrap{white-space:normal;overflow:visible;text-overflow:clip;line-height:1.7;margin-top:3px}
.slot .acts{display:flex;gap:6px;flex-shrink:0}
.slot.item{border-left:2px solid #2c2f36;transition:.2s}
.slot.item.clickable{cursor:pointer}
.slot.item.clickable:hover{border-color:#3a3d45;border-left-color:var(--red2);background:linear-gradient(90deg,rgba(45,35,35,.45),rgba(20,21,25,.4));transform:translateX(2px)}
.slot.usable{border-color:#3d3218;border-left:2px solid var(--gold);background:linear-gradient(90deg,rgba(70,55,24,.35),rgba(20,21,25,.4));}
.slot.usable .info b{color:#dcc287;letter-spacing:.08em}
.slot.usable .info small.wrap{color:#8b8067}
.slot.usable .mini{border-color:#4a3c1c;color:var(--gold)}
.slot.usable .mini:hover{border-color:var(--gold);color:#e8d199;background:rgba(179,154,95,.12)}
.mini{background:transparent;border:1px solid #33363d;color:#8f8b84;font-family:inherit;font-size:11.5px;padding:5px 10px;border-radius:2px;cursor:pointer;transition:.2s;letter-spacing:.08em}
.mini:hover{border-color:var(--red);color:var(--red2)}
.mini.danger:hover{border-color:#a33;color:#e05a5a}
.panel .close{width:100%;margin-top:14px;background:transparent;border:1px solid var(--line);color:var(--dim);font-family:inherit;padding:11px;cursor:pointer;letter-spacing:.2em;font-size:13px;border-radius:2px}
.panel .close:hover{border-color:var(--red);color:var(--red2)}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%) translateY(20px);background:#16181c;border:1px solid var(--line);color:#c0bcb4;padding:10px 20px;font-size:13px;letter-spacing:.12em;border-radius:2px;opacity:0;pointer-events:none;transition:.35s;z-index:120;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#title-screen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#16181d,#060708 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:80;padding:24px;text-align:center;}
#title-screen h1{font-size:30px;letter-spacing:.4em;color:#ded7c9;font-weight:400;margin:0 0 8px;text-shadow:0 0 30px rgba(140,43,43,.35)}
#title-screen .sub{font-size:12px;letter-spacing:.45em;color:var(--red2);margin-bottom:46px}
#title-screen .tbtn{width:230px;padding:14px;margin-bottom:12px;background:transparent;border:1px solid #2c2f35;color:#a9a59d;font-family:inherit;font-size:14px;letter-spacing:.28em;cursor:pointer;border-radius:2px;transition:.25s;}
#title-screen .tbtn:hover{border-color:var(--red);color:#e0d9cd;background:rgba(140,43,43,.09)}
#title-screen .foot{margin-top:40px;font-size:11px;color:#3f4247;letter-spacing:.18em;line-height:2}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:#24262b;border-radius:3px}
#viewer{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:rgba(4,5,7,.93);backdrop-filter:blur(5px);padding:18px;}
#viewer.on{display:flex}
.viewer-panel{width:100%;max-width:460px;max-height:88vh;display:flex;flex-direction:column;background:#0e0f12;border:1px solid var(--line);border-radius:3px;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.85);animation:vIn .32s cubic-bezier(.2,.8,.3,1);}
@keyframes vIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
.viewer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:12.5px;letter-spacing:.22em;color:var(--red2);flex-shrink:0;}
.viewer-close{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:inherit;font-size:12px;padding:3px 9px;border-radius:2px;cursor:pointer;transition:.2s;flex-shrink:0;}
.viewer-close:hover{border-color:var(--red);color:var(--red2)}
.viewer-body{padding:20px 18px 24px;overflow-y:auto;font-size:14.5px;line-height:1.95;color:#b6b2aa;}
.viewer-body p{margin:0 0 12px}
.viewer-body .r{color:var(--red2)}
.viewer-body .g{color:var(--gold)}
.viewer-body .d{color:var(--dim);font-size:13px}
.viewer-use{display:block;width:100%;margin-top:18px;padding:12px;background:linear-gradient(90deg,rgba(70,55,24,.55),rgba(30,25,12,.4));border:1px solid #4a3c1c;color:#dcc287;font-family:inherit;font-size:13.5px;letter-spacing:.3em;border-radius:2px;cursor:pointer;transition:.22s;}
.viewer-use:hover{border-color:var(--gold);color:#f0dca8;background:linear-gradient(90deg,rgba(90,72,30,.7),rgba(35,29,14,.5))}
.doc-cover{border:1px solid #3a2020;border-radius:2px;background:linear-gradient(160deg,#2a1010,#160808 70%);padding:22px 18px;text-align:center;margin-bottom:20px;box-shadow:inset 0 0 40px rgba(0,0,0,.8);}
.doc-cover .ct{font-size:17px;letter-spacing:.4em;color:#d8c9b8}
.doc-cover .cs{font-size:11px;letter-spacing:.5em;color:#8f7a6a;margin-top:8px}
.doc-cover .cn{margin-top:16px;font-size:30px;letter-spacing:.15em;color:#c9a45f;text-shadow:0 0 22px rgba(179,154,95,.55);}
.doc-h{font-size:12px;letter-spacing:.24em;color:var(--red2);margin:20px 0 10px;padding-left:9px;border-left:2px solid var(--red);}
.doc-h:first-of-type{margin-top:0}
.doc-rules p{margin:0 0 9px;padding-left:4px;font-size:13.5px;line-height:1.9;color:#a8a49c;}
.doc-rules p.hl{color:var(--gold)}
.doc-rules p.hr{color:var(--red2)}
.doc-torn{margin-top:18px;padding:14px;border:1px dashed #3a3d45;border-radius:2px;font-size:12.5px;color:var(--dim);text-align:center;letter-spacing:.1em;}
.paper{background:linear-gradient(175deg,#1b1a16,#131210 80%);border:1px solid #2e2b24;border-radius:2px;padding:20px 18px;position:relative;box-shadow:inset 0 0 60px rgba(0,0,0,.7);}
.paper::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 88% 8%, rgba(140,43,43,.14), transparent 42%),radial-gradient(circle at 10% 92%, rgba(120,100,60,.1), transparent 40%);}
.paper-title{text-align:center;font-size:14px;letter-spacing:.34em;color:#c9b48b;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #2e2b24;}
.paper-line{font-size:13px;line-height:1.95;color:#a9a49a;margin-bottom:9px;padding-left:2px;}
.paper-line b{color:#d6c7a8;font-weight:400}
.paper-line.hr{color:var(--red2)}
.paper-line.smudge{color:#5c5850;position:relative}
.paper-line.smudge .blur{filter:blur(1.6px);letter-spacing:.1em;color:#6a6560;}
.paper-note{margin-top:14px;padding-top:12px;border-top:1px dashed #3a3630;font-size:12.5px;color:var(--red2);line-height:1.9;}
.zhi{border:1px solid #1e2a34;border-radius:2px;background:linear-gradient(160deg,#0e1a22,#080e13 75%);padding:18px;font-size:13px;line-height:1.95;color:#9fb0bb;}
.zhi .zt{text-align:center;font-size:14px;letter-spacing:.3em;color:#7fa8c0;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #1c2b36}
.zhi .zr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dotted #17222b;font-size:12.5px}
.zhi .zr .y{color:#5f7a8a}
.zhi .zr .n{color:#9fb0bb}
.zhi .zr .s{color:#5a8a5a}
.zhi .zr .x{color:#c04a4a}
.zhi .zr.blank .n{color:#2a3942}
.zhi .zr.mark .n{color:#c9a45f}
.ph{border:2px solid #26292f;border-radius:20px;background:#07080b;padding:12px 10px 16px;box-shadow:inset 0 0 30px rgba(0,0,0,.9);}
.ph-bar{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:#4d5057;letter-spacing:.08em;padding:0 6px 10px;}
.ph-bar .net{color:#7a3a3a}
.ph-app{text-align:center;font-size:12px;letter-spacing:.4em;color:#7a7d84;padding:8px 0 14px;border-bottom:1px solid #17191d;}
.ph-grid{padding:14px 6px 0}
.ph-thumb{width:100%;aspect-ratio:4/3;border-radius:4px;border:1px solid #2a2d33;background:linear-gradient(180deg,#2a2d36 0%,#1a1c22 55%,#0d0e11 100%);position:relative;overflow:hidden;}
.ph-thumb::after{content:"";position:absolute;left:14%;right:14%;top:28%;height:34%;border-top:1.5px solid #4a4d55;border-left:1.5px solid #4a4d55;border-right:1.5px solid #4a4d55;}
.ph-none{padding:32px 0;text-align:center;font-size:12px;color:#3f4247;letter-spacing:.14em;}
.ph-tip{margin-top:12px;text-align:center;font-size:11px;color:#5d5a55;letter-spacing:.1em}
.photo-frame{border:1px solid #2a2d33;border-radius:3px;overflow:hidden;background:#0a0b0e;}
.photo-img{position:relative;width:100%;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(180deg,#2b2e37 0%,#1a1c22 55%,#0c0d10 100%);filter:saturate(.5) contrast(1.06);}
.pi-gate{position:absolute;left:12%;right:12%;top:27%;height:33%;border-top:2px solid #4a4d55;border-left:2px solid #4a4d55;border-right:2px solid #4a4d55;}
.pi-sign{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:#14161a;padding:0 10px;white-space:nowrap;font-size:11.5px;letter-spacing:.42em;color:#8a3838;text-shadow:0 0 12px rgba(140,43,43,.8);}
.pi-ground{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(180deg,rgba(20,22,26,0),#0a0b0e);}
.pi-people{position:absolute;left:16%;right:16%;bottom:20%;height:20%}
.pi-people span{position:absolute;bottom:0;width:6px;height:100%;background:#2e323a;border-radius:3px 3px 0 0;opacity:.75;}
.pi-people span:nth-child(1){left:6%;height:70%}
.pi-people span:nth-child(2){left:26%;height:88%}
.pi-people span:nth-child(3){left:56%;height:76%}
.pi-people span:nth-child(4){left:78%;height:84%}
.pi-blue{position:absolute;right:12%;bottom:22%;width:9px;height:34px;background:#2b3a5c;border-radius:4px 4px 0 0;box-shadow:0 0 12px rgba(43,58,92,.9);animation:blueBlink 3.2s infinite ease-in-out;}
@keyframes blueBlink{0%,100%{opacity:.85}50%{opacity:.42}}
.photo-meta{display:flex;justify-content:space-between;padding:8px 12px;font-size:10.5px;color:#4d5057;letter-spacing:.08em;border-top:1px solid #17191d;background:#0b0c0f;}
.photo-cap{margin:14px 0 0;font-size:13.5px;line-height:1.9;color:#a8a49c;}
.photo-cap.r{color:var(--red2)}
.photo-cap.d{color:var(--dim);font-size:12.5px}
#camera{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(3,4,6,.96);backdrop-filter:blur(6px);padding:20px;}
#camera.on{display:flex;animation:vIn .3s ease}
.cam-phone{width:min(310px,84vw);border-radius:28px;background:#0b0c0f;border:2px solid #26292f;padding:11px;box-shadow:0 0 70px rgba(0,0,0,.95), inset 0 0 0 1px #14161a;animation:vIn .35s cubic-bezier(.2,.8,.3,1);}
.cam-screen{position:relative;border-radius:17px;overflow:hidden;aspect-ratio:9/15.5;background:#05060a;}
.cam-view{position:absolute;inset:0;background:linear-gradient(180deg,#252830 0%,#15171c 42%,#08090c 100%);overflow:hidden;}
.cam-view::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px);}
.cs-gate{position:absolute;left:11%;right:11%;top:24%;height:34%;border-top:2px solid #4a4d55;border-left:2px solid #4a4d55;border-right:2px solid #4a4d55;}
.cs-sign{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:#12141a;padding:0 9px;white-space:nowrap;font-size:11px;letter-spacing:.4em;color:#8a3838;text-shadow:0 0 12px rgba(140,43,43,.8);}
.cs-people{position:absolute;left:15%;right:15%;bottom:22%;height:19%}
.cs-people span{position:absolute;bottom:0;width:5px;border-radius:2px 2px 0 0;background:#2e323a;opacity:.7;}
.cs-people span:nth-child(1){left:5%;height:68%}
.cs-people span:nth-child(2){left:28%;height:90%}
.cs-people span:nth-child(3){left:58%;height:74%}
.cs-people span:nth-child(4){left:80%;height:82%}
.cs-blue{position:absolute;right:11%;bottom:23%;width:8px;height:32px;background:#2b3a5c;border-radius:3px 3px 0 0;box-shadow:0 0 12px rgba(43,58,92,.9);animation:blueBlink 3.2s infinite ease-in-out;}
.cs-ground{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,rgba(18,20,24,0),#08090c);}
.cs-grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/33.33% 100%,linear-gradient(0deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/100% 33.33%;opacity:.35;}
.cs-corner{position:absolute;width:16px;height:16px;border:1.5px solid rgba(200,200,200,.35);}
.cs-corner.tl{left:14px;top:14px;border-right:0;border-bottom:0}
.cs-corner.tr{right:14px;top:14px;border-left:0;border-bottom:0}
.cs-corner.bl{left:14px;bottom:14px;border-right:0;border-top:0}
.cs-corner.br{right:14px;bottom:14px;border-left:0;border-top:0}
.cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
.cam-flash.on{animation:camFlash .34s ease-out}
@keyframes camFlash{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}
.cam-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 4px;gap:10px;}
.cam-thumb{width:46px;height:46px;border-radius:7px;flex-shrink:0;border:1px solid #3a3d45;overflow:hidden;cursor:pointer;background:linear-gradient(180deg,#2a2d36,#0d0e11);position:relative;opacity:0;}
.cam-thumb.pop{animation:thumbPop .45s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes thumbPop{0%{opacity:0;transform:scale(.4) rotate(-8deg)}100%{opacity:1;transform:none}}
.cam-thumb::after{content:"";position:absolute;left:20%;right:20%;top:28%;height:32%;border-top:1px solid #5a5d65;border-left:1px solid #5a5d65;border-right:1px solid #5a5d65;}
.cam-shutter{width:62px;height:62px;border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 50% 42%,#f2efe8,#b9b4ab 62%,#6d6963);border:3px solid #2c2f35;cursor:pointer;transition:.14s;box-shadow:0 0 22px rgba(0,0,0,.8), inset 0 -3px 8px rgba(0,0,0,.35);}
.cam-shutter:active{transform:scale(.9)}
.cam-shutter:disabled{filter:grayscale(1) brightness(.55);cursor:default}
.cam-ph{width:46px;height:46px;flex-shrink:0}
.cam-tip{margin-top:20px;font-size:12px;letter-spacing:.2em;color:#5d5a55;transition:.3s;}
.cam-done{margin-top:14px;padding:11px 30px;background:transparent;border:1px solid #2c2f35;color:#a9a59d;font-family:inherit;font-size:13px;letter-spacing:.3em;border-radius:2px;cursor:pointer;transition:.22s;}
.cam-done:hover{border-color:var(--red);color:#e0d9cd;background:rgba(140,43,43,.1)}
.cam-done.hide{display:none}
#interact{position:fixed;inset:0;z-index:98;display:none;align-items:center;justify-content:center;background:rgba(4,5,7,.95);backdrop-filter:blur(6px);padding:16px;}
#interact.on{display:flex}
.it-panel{width:100%;max-width:460px;max-height:92vh;display:flex;flex-direction:column;background:#0e0f12;border:1px solid var(--line);border-radius:3px;overflow:hidden;box-shadow:0 0 70px rgba(0,0,0,.9);animation:vIn .32s cubic-bezier(.2,.8,.3,1);}
.it-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);font-size:12.5px;letter-spacing:.22em;color:var(--red2);flex-shrink:0;}
.it-screen{padding:22px 18px;overflow-y:auto;flex:1;min-height:120px;}
.it-story{margin-top:18px;padding-top:16px;border-top:1px dashed #2a2d33;font-size:14px;line-height:1.95;color:#a8a49c;white-space:pre-wrap;}
.it-actions{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px;flex-shrink:0;}
.it-actions:empty{padding-bottom:0}
.it-actions .ch{font-size:14px;padding:12px 14px}
.peep{display:flex;flex-direction:column;align-items:center;gap:14px;}
.peep-lens{width:190px;height:190px;border-radius:50%;background:#000;box-shadow:inset 0 0 60px rgba(0,0,0,1), 0 0 0 6px #14161a, 0 0 0 7px #2a2d33;position:relative;overflow:hidden;}
.peep-lens::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%, #060708 30%, #000 78%);}
.peep-eye{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:84px;height:38px;border-radius:50%;background:radial-gradient(circle at 50% 45%, #d8d2c6 0 26%, #6b6259 30% 44%, #241f1b 47% 100%);box-shadow:0 0 26px rgba(180,20,20,.45);animation:eyePulse 2.8s infinite ease-in-out;}
.peep-eye::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#0a0505;box-shadow:0 0 10px rgba(200,40,40,.85);}
@keyframes eyePulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.07)}}
.peep-cap{font-size:12px;letter-spacing:.2em;color:#7a3a3a;text-align:center}
.doorview{display:flex;flex-direction:column;align-items:center;gap:14px;}
.door-gap{width:100%;max-width:250px;height:290px;background:#050506;border-radius:4px;position:relative;overflow:hidden;box-shadow:inset 0 0 50px rgba(0,0,0,.95), 0 0 0 1px #1c1e23;}
.corridor{position:absolute;left:24%;right:24%;top:0;bottom:0;background:linear-gradient(180deg,#22252c 0%,#15171c 60%,#0a0b0e 100%);overflow:hidden;}
.corridor::before{content:'';position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:72%;height:46%;border:1px solid rgba(90,95,105,.32);box-shadow:inset 0 0 40px rgba(0,0,0,.8);}
.corr-light{position:absolute;left:50%;top:0;transform:translateX(-50%);width:64%;height:38%;background:radial-gradient(ellipse at 50% 0%, rgba(120,110,90,.26), transparent 72%);}
.corr-figure{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);width:22px;height:80px;background:linear-gradient(180deg,#2b3a5c,#1d2740);border-radius:9px 9px 3px 3px;box-shadow:0 0 24px rgba(43,58,92,.85);animation:figSway 3.6s infinite ease-in-out;}
@keyframes figSway{0%,100%{transform:translateX(-50%) rotate(0)}50%{transform:translateX(-50%) rotate(1.6deg)}}
.mirrorview{display:flex;flex-direction:column;align-items:center;gap:14px;}
.mirror-glass{width:170px;height:230px;border-radius:50% 50% 46% 46%/22% 22% 14% 14%;background:linear-gradient(160deg,#2a2f38,#12151a 60%,#0a0c10);border:2px solid #2a2d33;position:relative;overflow:hidden;box-shadow:0 0 50px rgba(0,0,0,.9), inset 0 0 40px rgba(0,0,0,.75);}
.mirror-shine{position:absolute;left:-30%;top:-20%;width:80%;height:120%;background:linear-gradient(100deg,rgba(255,255,255,.08),transparent 60%);transform:rotate(12deg);}
.mirror-reflect{position:absolute;left:50%;bottom:0;transform:translateX(-50%);text-align:center;}
.mr-head{width:52px;height:62px;border-radius:50% 50% 44% 44%;background:linear-gradient(180deg,#6b6a66,#3a3a38);margin:0 auto 4px;animation:blinkLate 4.6s infinite;}
@keyframes blinkLate{0%,86%,100%{transform:scaleY(1)}92%{transform:scaleY(.32)}}
.mr-body{width:92px;height:92px;border-radius:44px 44px 6px 6px;background:linear-gradient(180deg,#3f4249,#22252b);}
.board{position:relative;padding:14px;background:linear-gradient(170deg,#16181d,#0d0e11);border:1px solid #2a2d33;border-radius:3px;min-height:280px;box-shadow:inset 0 0 40px rgba(0,0,0,.85);overflow:hidden;}
.board-paper{position:absolute;background:linear-gradient(170deg,#c9c2ae,#a49d88);color:#2a2620;font-size:8.5px;line-height:1.45;padding:6px 5px;box-shadow:0 3px 10px rgba(0,0,0,.65);letter-spacing:.01em;transform-origin:center;}
.board-paper b{display:block;font-size:9px;letter-spacing:.06em;margin-bottom:2px}
.board-paper i{display:block;color:#7a2a2a;font-style:normal}
.board-note{margin-top:12px;font-size:11.5px;color:#5d5a55;letter-spacing:.06em;text-align:center}
.elev{display:flex;flex-direction:column;align-items:center;gap:16px;}
.elev-disp{width:96px;height:44px;border-radius:4px;background:#0a0c0e;border:1px solid #2a2d33;display:flex;align-items:center;justify-content:center;font-size:26px;letter-spacing:.14em;color:#8a3a3a;text-shadow:0 0 14px rgba(160,40,40,.8);font-family:"Courier New",monospace;transition:.2s;}
.elev-disp.danger{color:#e05050;text-shadow:0 0 20px rgba(220,60,60,1);animation:dispBlink .5s 3;}
@keyframes dispBlink{0%,100%{opacity:1}50%{opacity:.35}}
.elev-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:250px;}
.elev-btn{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2b2e35,#171a1f);border:1px solid #34383f;color:#9a968f;font-family:inherit;font-size:13px;cursor:pointer;transition:.16s;box-shadow:0 2px 6px rgba(0,0,0,.7), inset 0 -2px 4px rgba(0,0,0,.5);}
.elev-btn:hover{border-color:var(--red2);color:#e0d9cd}
.elev-btn:active{transform:scale(.92);background:radial-gradient(circle at 40% 35%,#5a2a2a,#2a1010)}
.elev-btn.dim{opacity:.28;pointer-events:none;filter:grayscale(1)}
.elev-hint{font-size:11.5px;letter-spacing:.2em;color:#5d5a55;text-align:center}
.elev13{display:flex;flex-direction:column;align-items:center;gap:14px;}
.elev13-door{width:100%;max-width:240px;height:250px;border-radius:4px;background:linear-gradient(180deg,#0d0f13,#050608);border:1px solid #1c1e23;position:relative;overflow:hidden;box-shadow:inset 0 0 60px rgba(0,0,0,.95);}
.elev13-room{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70%;height:60%;border:1px solid rgba(120,60,60,.4);box-shadow:0 0 40px rgba(120,20,20,.35) inset;}
.elev13-room::after{content:'13';position:absolute;left:50%;top:-12px;transform:translateX(-50%);background:#0d0f13;padding:0 8px;font-size:13px;letter-spacing:.3em;color:#c04a4a;text-shadow:0 0 12px rgba(192,74,74,.9);}
.elev13-cap{font-size:12px;letter-spacing:.2em;color:#7a3a3a}
.canteen{display:flex;flex-direction:column;align-items:center;gap:14px;}
.ct-frame{width:100%;max-width:290px;border-radius:4px;border:1px solid #2a2d33;background:linear-gradient(180deg,#1c1f24,#0d0e11);padding:14px;position:relative;box-shadow:inset 0 0 50px rgba(0,0,0,.8);}
.ct-glass{position:absolute;inset:6px;border-radius:2px;background:linear-gradient(150deg,rgba(200,220,235,.055) 0%,transparent 45%,rgba(200,220,235,.03) 100%);pointer-events:none;box-shadow:inset 0 0 30px rgba(0,0,0,.5);}
.ct-trays{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:2}
.ct-tray{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 42% 36%,#3a3a34,#1a1a17);border:2px solid #33352f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;}
.ct-tray i{width:52%;height:26%;border-radius:50%;background:linear-gradient(180deg,#5a5f42,#333a24);display:block}
.ct-tray.t2 i{background:linear-gradient(180deg,#8a7a3a,#4a4020)}
.ct-tray.t3 i{background:linear-gradient(180deg,#7a3a2a,#3a1a12)}
.ct-tray b{font-size:9px;letter-spacing:.08em;color:#7a756a;font-weight:400}
.ct-tray.t3{box-shadow:0 0 22px rgba(140,43,43,.35);border-color:#4a2a2a}
.ct-aunt{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;position:relative;z-index:2}
.ct-hat{width:34px;height:20px;border-radius:17px 17px 3px 3px;background:linear-gradient(180deg,#e8e5de,#a8a49c)}
.ct-face{width:30px;height:34px;border-radius:50% 50% 44% 44%;background:linear-gradient(180deg,#b8a894,#7a6d5c);position:relative}
.ct-face::before,.ct-face::after{content:'';position:absolute;top:44%;width:4px;height:4px;border-radius:50%;background:#2a2420}
.ct-face::before{left:24%}
.ct-face::after{right:24%}
.ct-cap{font-size:11.5px;letter-spacing:.16em;color:#5d5a55;text-align:center;line-height:1.8}
#horror-overlay{position:fixed;inset:0;pointer-events:none;z-index:50;transition:box-shadow .6s ease, opacity .6s ease;opacity:0;}
#horror-overlay.san-mid{opacity:1;box-shadow:inset 0 0 100px rgba(0,0,0,0.85), inset 0 0 40px rgba(80,10,10,0.4);}
#horror-overlay.san-low{opacity:1;animation:heartPulse 1.3s infinite ease-in-out;}
@keyframes heartPulse{0%,100%{box-shadow:inset 0 0 80px rgba(100,0,0,0.5), inset 0 0 160px rgba(0,0,0,0.9);}50%{box-shadow:inset 0 0 140px rgba(190,20,20,0.85), inset 0 0 200px rgba(30,0,0,0.95);}}
body.scare-flash{animation:scareFlash .38s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;}
@keyframes scareFlash{0%{filter:invert(1) hue-rotate(180deg) contrast(300%) brightness(1.2);transform:scale(1.02);}40%{filter:invert(0.6) hue-rotate(330deg) drop-shadow(0 0 30px #f00);}100%{filter:none;transform:scale(1);}}
body.scare-shake{animation:screenShake .45s cubic-bezier(.36,.07,.19,.97) both;}
@keyframes screenShake{10%,90%{transform:translate3d(-4px,-2px,0) rotate(-0.5deg);}20%,80%{transform:translate3d(5px,3px,0) rotate(0.8deg);}30%,50%,70%{transform:translate3d(-6px,4px,0) rotate(-0.6deg);}40%,60%{transform:translate3d(6px,-4px,0) rotate(0.5deg);}}
body.heal-flash{animation:healFlash .8s ease;}
@keyframes healFlash{0%{filter:brightness(1.75) sepia(.55) saturate(1.5) hue-rotate(-18deg);}60%{filter:brightness(1.15) sepia(.2);}100%{filter:none;}}
.glitch-txt{display:inline-block;animation:glitchAnim .28s infinite alternate ease-in-out;text-shadow:-1.5px 0 #c04a4a, 1.5px 0 #2a5a8a;}
@keyframes glitchAnim{0%{transform:skew(0deg);}30%{transform:skew(-6deg) scaleY(1.05);}70%{transform:skew(4deg) translate(-1px, 1px);}100%{transform:skew(0deg);}}
#dodge{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(60,0,0,.75);backdrop-filter:blur(4px);flex-direction:column;cursor:pointer;user-select:none;}
#dodge.on{display:flex;animation:dodgeIn .12s ease}
@keyframes dodgeIn{from{opacity:0}to{opacity:1}}
#dodge.shake{animation:dodgeShake .08s infinite}
@keyframes dodgeShake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-3px)}}
.dodge-text{font-size:56px;letter-spacing:.2em;color:#fff;text-shadow:0 0 20px #f00,0 0 40px #f00;font-weight:bold;margin-bottom:30px;animation:dodgePulse .3s infinite alternate}
@keyframes dodgePulse{from{transform:scale(1)}to{transform:scale(1.08)}}
.dodge-btn{width:min(70vw,320px);height:min(70vw,320px);border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff8e0,#d4a040 60%,#7a5010);border:6px solid #fff;box-shadow:0 0 60px #fff,0 0 100px #f00,inset 0 -10px 30px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:40px;color:#2a1810;font-weight:bold;letter-spacing:.1em;}
.dodge-btn:active{transform:scale(.94)}
.dodge-count{position:absolute;top:30px;left:0;right:0;text-align:center;font-size:20px;color:#ffd;letter-spacing:.3em}
.dodge-timer{position:absolute;bottom:80px;width:80%;height:6px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden}
.dodge-timer-bar{height:100%;background:linear-gradient(90deg,#fff,#f00);width:100%;transition:width .05s linear}
.dodge-hint{position:absolute;bottom:40px;font-size:14px;color:#ffd;letter-spacing:.3em;opacity:.85}
.dodge-result{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;background:rgba(4,5,7,.92);flex-direction:column;padding:20px;text-align:center}
.dodge-result.on{display:flex;animation:vIn .4s ease}
.dodge-result h2{font-size:24px;letter-spacing:.3em;margin:0 0 20px;font-weight:400}
.dodge-result p{font-size:15px;line-height:2;color:#b6b2aa;max-width:460px}
</style>
</head>
<body>
<div id="horror-overlay"></div>
<div id="app">
  <div id="top">
    <div id="topbar">
      <span id="chapter">— 序章 —</span>
      <div id="menubtns">
        <button class="mbtn" onclick="openBag()">背包</button>
        <button class="mbtn" onclick="openMenu()">存读档</button>
      </div>
    </div>
    <div id="status">
      <span>理智</span>
      <div id="sanwrap"><div id="sanbar"></div></div>
      <span id="santxt">100</span>
      <span id="itemtxt" onclick="openBag()" style="margin-left:8px;color:#8a6f3f"></span>
    </div>
  </div>
  <div id="story"><h1 class="title" id="ttl"></h1><div id="text"></div></div>
  <div id="choices"></div>
</div>
<div id="title-screen">
  <h1>临江大学</h1><div class="sub">新 生 手 册</div>
  <button class="tbtn" id="btn-continue" style="display:none">继 续 游 戏</button>
  <button class="tbtn" id="btn-new">开 始 新 生 报 到</button>
  <button class="tbtn" id="btn-load">读 取 存 档</button>
  <div class="foot">本游戏进度不可回退。<br>做出的选择无法撤销，除非读取存档。</div>
</div>
<div id="mask"><div class="panel" id="panel"></div></div>
<div id="viewer"><div class="viewer-panel"><div class="viewer-head"><span id="viewerTitle"></span><button class="viewer-close" onclick="closeViewer()">关 闭</button></div><div class="viewer-body" id="viewerBody"></div></div></div>
<div id="interact"><div class="it-panel"><div class="it-head"><span id="itTitle">—</span><button class="viewer-close" onclick="closeInteract()">关 闭</button></div><div class="it-screen" id="itScreen"></div><div class="it-actions" id="itActions"></div></div></div>
<div id="camera">
  <div class="cam-phone">
    <div class="cam-screen">
      <div class="cam-view">
        <div class="cs-gate"><div class="cs-sign">临江大学</div></div>
        <div class="cs-people"><span></span><span></span><span></span><span></span></div>
        <div class="cs-blue"></div><div class="cs-ground"></div><div class="cs-grid"></div>
        <div class="cs-corner tl"></div><div class="cs-corner tr"></div><div class="cs-corner bl"></div><div class="cs-corner br"></div>
      </div>
      <div class="cam-flash" id="camFlash"></div>
    </div>
    <div class="cam-bar">
      <div class="cam-thumb" id="camThumb" onclick="viewPhoto()"></div>
      <button class="cam-shutter" id="camShutter" onclick="takePhoto()"></button>
      <div class="cam-ph"></div>
    </div>
  </div>
  <div class="cam-tip" id="camTip">点 击 快 门 拍 照</div>
  <button class="cam-done hide" id="camDone" onclick="finishCamera()">收 起 手 机</button>
</div>
<div id="dodge">
  <div class="dodge-count" id="dodgeCount">· 躲 避 ·</div>
  <div class="dodge-text">⚠</div>
  <button class="dodge-btn" id="dodgeBtn">躲 ！</button>
  <div class="dodge-timer"><div class="dodge-timer-bar" id="dodgeTimerBar"></div></div>
  <div class="dodge-hint" id="dodgeHint">立刻点击按钮 · 时间不多了</div>
</div>
<div class="dodge-result" id="dodgeResult">
  <h2 id="dodgeResultTitle">—</h2>
  <p id="dodgeResultBody"></p>
  <button class="ch" style="max-width:260px;text-align:center;margin-top:24px" id="dodgeResultBtn">继 续</button>
</div>
<div id="toast"></div>
<script>
/* ═══════════════════════════════════════════════════════════
   状态与存档
   ═══════════════════════════════════════════════════════════ */
const SAVE_KEY = 'linjiang_saves_v4';
let SLOTS = { auto:null, s1:null, s2:null, s3:null, s4:null, s5:null, s6:null };
let S = null;
let finalTensionTimer = null;
function newState(){
  return { node:'start', sanity:100, flags:{ hasPhone:true }, used:{}, entered:{}, steps:0, t:Date.now() };
}
function loadSaves(){ try{ const raw = localStorage.getItem(SAVE_KEY); if(raw){ const d = JSON.parse(raw); if(d && typeof d==='object') SLOTS = Object.assign(SLOTS,d); } }catch(e){} }
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SLOTS)); }catch(e){ toast('存档失败'); } }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function saveTo(slot){ SLOTS[slot] = { state: clone(S), node:S.node, time:Date.now() }; persist(); }
function loadFrom(slot){
  if(!SLOTS[slot]) { toast('该存档位为空'); return false; }
  S = clone(SLOTS[slot].state); S.node = SLOTS[slot].node;
  if(S.flags.hasPhone === undefined) S.flags.hasPhone = true;
  if(finalTensionTimer){ clearInterval(finalTensionTimer); finalTensionTimer = null; }
  closeMask(); closeViewer(); closeInteract(); render(true); return true;
}
function autoSave(){ saveTo('auto'); }

/* ═══════════════════════════════════════════════════════════
   物品
   ═══════════════════════════════════════════════════════════ */
const ITEM_DEFS = [
  { flag:'hasPhone', name:'手机', desc:'随身带着。可以翻看相册。',
    view(){ const hasPhoto = !!S.flags.tookPhoto;
      return { title:'手 机', html:`<div class="ph"><div class="ph-bar"><span>15:42</span><span class="net">无服务</span></div><div class="ph-app">相 册</div><div class="ph-grid">${hasPhoto ? '<div class="ph-thumb"></div><div class="ph-tip">1 张照片 · 校门</div>' : '<div class="ph-none">（相册是空的）</div>'}</div></div>${hasPhoto ? '<p class="d" style="margin-top:16px">这张照片你删过一次。它自己回来了。</p>' : ''}`}; }
  },
  { flag:'hasManual', name:'新生手册', desc:'深红封皮，烫金数字 403。可以翻开看。',
    view(){ return { title:'《临江大学 · 新生手册》', html: MANUAL_HTML }; } },
  { flag:'hasRules', name:'寝室公约', desc:'从 403 门后抄下来的规则。',
    view(){ return { title:'403 寝室规则', html: RULES_HTML }; } },
  { flag:'hasCoin', name:'铜钱', usable:true, desc:'陈默塞给你的。',
    view(){ return { title:'铜 钱', html:`<div style="text-align:center;padding:14px 0 20px"><div style="display:inline-block;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#d8bd7c,#8a6f3a 55%,#4a3a18);box-shadow:0 0 34px rgba(179,154,95,.5), inset 0 0 20px rgba(0,0,0,.5);position:relative"><div style="position:absolute;inset:34%;background:#141210;border-radius:3px;box-shadow:inset 0 0 8px rgba(0,0,0,.9)"></div></div><div style="margin-top:14px;font-size:12px;letter-spacing:.3em;color:#8a7a55">红 绳 已 褪 色</div></div><p>陈默把它塞进你手里时说：戴着，睡觉也别摘。</p><p>你问它能挡什么。她说挡不了什么——<span class="g">只是让你下次数的时候，数得慢一点。</span></p><p class="r">铜钱还是温的。它一直在发烫。</p><p class="d">【可使用 · 仅一次】咬碎它，能唤回大量神志（理智 +80）。</p>`}; } },
  { flag:'coinUsed', name:'铜钱的灰烬', desc:'铜钱已经碎了。',
    view(){ return { title:'铜 钱 的 灰 烬', html:`<p>铜钱碎了。</p><p>碎片像灰一样散在掌心，风一吹就没了。</p><p class="d">只剩下那截红绳，还系在手腕上，再也暖不起来了。</p>`}; } },
  { flag:'hasBook', name:'临江校志', desc:'1999 年版。可以翻阅。',
    view(){ return { title:'《临江校志》1999 年版', html: ZHIZHI_HTML }; } },
  { flag:'hasPage', name:'403 页', desc:'从《临江校志》上撕下的一页。',

function elevPress(n){
  if(window._elevLock) return; window._elevLock = true;
  document.querySelectorAll('#elevGrid .elev-btn').forEach(b=>b.classList.add('dim'));
  const disp = $('elevDisp'), hint = $('elevHint');
  let cur = 1;
  const t = setInterval(()=>{
    cur++; disp.textContent = String(cur).padStart(2,'0');
    if(cur >= 13){
      clearInterval(t); disp.textContent = '13'; disp.classList.add('danger'); hint.textContent = '……';
      setTimeout(()=>{
        const it = INTERACTS.elevator_open;
        $('itScreen').innerHTML = (it.screen||'') + (it.story ? `<div class="it-story">${it.story}</div>` : '');
        renderInteractOptions(it.options);
      }, 780);
    }
  }, 235);
}

/* ============ 舍友带路 · 遇袭线 ============ */
"s_plan":{ch:"隐藏",title:"苏也的提议",
  text:`晚上，苏也把你们叫到一起。\n\n"我有个想法。"\n\n"旧教学楼那边，有一间档案室。"\n\n"里面藏着 2019 级的旧档案。"\n\n"如果我们能查到当年那届的名单——"\n\n她顿了顿。\n\n"也许就知道，403 的第四个是谁了。"\n\n李薇推了推眼镜：\n\n"现在去？"\n\n"现在。"苏也说，"白天人多。"\n\n"晚上才好。"\n\n<span class="d">（你已经知道 2019 级的"第四个"是谁了。）</span>`,
  choices:[
    {t:"好，一起去",to:"s_go",san:-5},
    {t:"不去，太危险了",to:"d_back_dorm",san:-3},
    {t:"先问问陈默",to:"s_ask_chen"}
  ]},
"s_ask_chen":{ch:"隐藏",title:"陈默的意见",
  text:`你去问陈默。\n\n她正在擦那双旧布鞋。\n\n"旧教学楼？"\n\n她抬起头。\n\n"别去。"\n\n"为什么？"\n\n"因为那里……"\n\n她停住了。\n\n"有东西在等。"\n\n"等什么？"\n\n"等一个愿意进去的人。"\n\n"进去了，就会变成它的一部分。"\n\n"像 2019 年那届一样。"\n\n她把布鞋放下。\n\n"你要去，我不拦你。"\n\n"但带上这个。"\n\n她从枕头下摸出一把旧钥匙，递给你。\n\n<span class="d">（旧档案室钥匙已经放进背包。）</span>`,
  choices:[
    {t:"收下钥匙，还是决定去",to:"s_go",san:-8,set:{hasOldKey:true,chenTrust:4}},
    {t:"听陈默的，不去",to:"d_back_dorm",san:-3,set:{hasOldKey:true}}
  ]},
"s_go":{ch:"隐藏",title:"旧教学楼 · 出发",
  text:`你、苏也、李薇三个人，往旧教学楼走。\n\n夜里的校园很安静。\n\n只有路灯，和偶尔掠过的风。\n\n旧教学楼在大校区最北边，和那座"老校区"隔着一条暗巷。\n\n楼门是开的。\n\n门轴发出很轻的声音。\n\n苏也走在最前面。\n\n李薇在中间。\n\n你在最后。\n\n"别怕。"苏也回头笑了笑，"就我们三个人。"\n\n<span class="d">（可你总觉得，身后有第四个人的脚步。）</span>`,
  choices:[
    {t:"跟着进去",to:"s_corridor"},
    {t:"回头看看有没有人",to:"s_look_back",san:-5}
  ]},
"s_look_back":{ch:"隐藏",title:"回头",
  text:`你回头。\n\n身后是空的。\n\n没有人。\n\n你正要转回去——\n\n楼门口的台阶上，多了一个影子。\n\n一个男生的影子。\n\n他没有动。\n\n只是站着。\n\n<span class="d">（你忽然想起那句警告："小心温瑶"。）</span>`,
  choices:[{t:"转回去，跟上她们",to:"s_corridor",san:-5,set:{sawShadow:true}}]},
"s_corridor":{ch:"隐藏",title:"旧教学楼 · 走廊",
  text:`走廊很暗。\n\n声控灯没反应。\n\n苏也打开手机手电筒，光柱在黑暗里晃。\n\n"档案室在四楼。"她说，"我们走楼梯上去。"\n\n你们一层一层往上走。\n\n走到三楼和四楼之间的时候，你听见了声音。\n\n很轻的脚步声。\n\n从上面下来的。\n\n<span class="d">（你抬头看，楼梯上方一片黑。）</span>`,
  choices:[
    {t:"提醒她们小心",to:"s_talk",san:-5},
    {t:"继续往上走",to:"s_find",san:-6}
  ]},
"s_talk":{ch:"隐藏",title:"苏也的坦白",
  text:`"苏也。"你压低声音，"小心点。"\n\n她回过头。\n\n"怎么了？"\n\n"上面有脚步声。"\n\n她停下来，听了一会儿。\n\n"……没有啊。"\n\n"有的。"你说，"从上面下来的。"\n\n她沉默了几秒。\n\n"你知道吗？"\n\n"我大一的时候，也听过。"\n\n"那时候，我以为是自己听错了。"\n\n"后来——"\n\n她笑了笑。\n\n"后来我成了 403 的苏也。"\n\n"就这样。"\n\n<span class="d">（她转回去，继续往上走。）</span>`,
  choices:[{t:"跟上她",to:"s_find",san:-4,set:{suyeStory:true}}]},
"s_find":{ch:"隐藏",title:"四楼 · 档案室",
  text:`你们到了四楼。\n\n走廊尽头，有一扇门。\n\n门上写着：<span class="r">档案室</span>。\n\n锁着。\n\n苏也推了推。\n\n"打不开。"\n\n李薇从包里掏出一把旧钥匙。\n\n"我试试。"\n\n她把钥匙插进锁孔。\n\n转了一下。\n\n"咔哒。"\n\n门开了。\n\n<span class="d">（门后面很黑。）</span>`,
  choices:[
    {t:"一起进去",to:"s_open"},
    {t:"让苏也先进",to:"s_open",san:-2}
  ]},
"s_open":{ch:"隐藏",title:"档案室 · 开门",
  text:`门开了。\n\n里面很黑。\n\n苏也走进去，手电筒照着四周。\n\n一排排铁皮柜，上面贴着手写的标签。\n\n"2019 级……"\n\n她拉开一个柜子。\n\n里面全是档案。\n\n你们开始翻。\n\n翻到一半的时候——\n\n灯灭了。\n\n手电筒也灭了。\n\n走廊里传来"砰"的一声。\n\n门被关上了。\n\n<span class="d">（黑暗中，你听见两个人的呼吸声。）</span>`,
  choices:[{t:"点亮手机屏幕",to:"s_ambush",san:-8}]},
"s_ambush":{ch:"隐藏",title:"突然的袭击",
  text:`你点亮手机屏幕。\n\n微光里，你看见了苏也。\n\n她站在你面前，脸色发白。\n\n"李薇呢？"\n\n你转头。\n\n李薇站在门口。\n\n她身后——\n\n站着一个男生。\n\n季默。\n\n他低着头，一动不动。\n\n然后他抬起头。\n\n对你笑了笑。\n\n"终于。"\n\n"终于找到你了。"\n\n他冲向你们。`,
  choices:[{t:"⚡ 【躲 避】",act:"dodge",to:"s_dodge_result",dodgeCount:3,dodgeNext:"s_after_dodge"}]},
"s_dodge_result":{ch:"隐藏",title:"躲避 · 结果",text:`（结算中）`,choices:[]},
"s_after_dodge":{ch:"隐藏",title:"躲避 · 之后",text:`（自动跳转）`,choices:[]},
"s_safe":{ch:"隐藏",title:"完美躲过",
  text:`你连着躲了三次。\n\n季默扑了个空，撞在墙上。\n\n他的身体发出"沙"的声音。\n\n像是一堆纸被撞散了。\n\n然后他消失了。\n\n地板上，留下一张旧学生证。\n\n苏也喘着气，扶着墙。\n\n"那是……那是什么？"\n\n"我不知道。"你说。\n\n你捡起那张学生证。\n\n<span class="d">（季默的学生证已经放进背包。）</span>`,
  choices:[
    {t:"捡起学生证，带苏也离开",to:"s_escape",set:{hasJinmoCard:true,survivedAmbush:true}},
    {t:"先看一眼学生证",to:"s_card_look",set:{hasJinmoCard:true,survivedAmbush:true}}
  ]},
"s_card_look":{ch:"隐藏",title:"学生证",
  text:`你把学生证翻开。\n\n"季默 · 计算机学院 · 男寝 402 · 2019 级"。\n\n照片上是一个很干净的男生。\n\n笑得很浅。\n\n但照片上，他的左眼是空的。\n\n"你认识他？"苏也问。\n\n"不认识。"\n\n"可他刚才说——"\n\n"他终于找到你了。"\n\n苏也沉默了一会儿。\n\n"那他找的，是你吗？"\n\n<span class="d">（你没有回答。）</span>`,
  choices:[{t:"收好学生证，离开",to:"s_escape"}]},
"s_hit":{ch:"隐藏",title:"受伤",
  text:`你躲晚了。\n\n季默的手抓住你的肩膀。\n\n他的手很凉。\n\n凉得像从冰水里捞出来的。\n\n你感觉理智在快速流失。\n\n眼前一片黑。\n\n苏也冲过来，把季默推开。\n\n"跑！"她喊。\n\n你们一起冲出档案室。`,
  choices:[{t:"跟着苏也跑",to:"s_escape",san:-30,set:{wounded:true}}]},
"s_su_hurt":{ch:"隐藏",title:"苏也受伤",
  text:`季默的手穿过了你的肩膀。\n\n苏也扑过来，用身体挡住你。\n\n季默的手，划破了她的手臂。\n\n血顺着她的手臂往下流。\n\n但她没有退。\n\n"跑！"\n\n她推着你往外跑。\n\n李薇拉着你们，三个人冲出档案室。\n\n季默没有追出来。\n\n走廊尽头，他的声音很远：\n\n"你躲不掉的。"\n\n"你最终，还是会签。"`,
  choices:[{t:"扶着苏也离开",to:"s_escape",san:-35,set:{suyeHurt:true,wounded:true}}]},
"s_escape":{ch:"隐藏",title:"逃出旧教学楼",
  text:`你们三个人冲出旧教学楼。\n\n外面下着小雨。\n\n苏也靠在墙上喘气。\n\n李薇抖得很厉害。\n\n你回头看。\n\n旧教学楼的四楼，窗户里，站着一个男生。\n\n他在看你。\n\n<span class="d">（然后他消失了。）</span>`,
  choices:[{t:"回寝室",to:"s_back_dorm"}]},
"s_back_dorm":{ch:"隐藏",title:"回到 403",
  text:`你们回到寝室。\n\n陈默坐在床上，看着你们。\n\n"去了？"\n\n"去了。"\n\n"看到了？"\n\n"看到了。"\n\n陈默点点头。\n\n"那你们应该知道了。"\n\n"你们不是唯一的。"\n\n"还有很多 403 的人，还在走。"\n\n"他们有的成了书。"\n\n"有的成了菜。"\n\n"有的成了规则。"\n\n"有的——"\n\n"成了访客。"\n\n<span class="d">（她看向苏也。苏也低着头。）</span>`,
  choices:[
    {t:"问：访客是什么？",to:"s_visitor_explain",san:-5},
    {t:"先休息",to:"d_back_dorm"}
  ]},
"s_visitor_explain":{ch:"隐藏",title:"访客",
  text:`"访客是什么？"\n\n陈默站起来，走到门后。\n\n她指着门后那张泛黄的规则。\n\n"你注意看。"\n\n"403 寝室规则。"\n\n"你数一数，有几条。"\n\n你数了一遍。\n\n七条。\n\n"不对。"陈默说。\n\n"你数第七行。"\n\n你再看。\n\n第七条被涂掉了。\n\n"这才是第七条。"她说。\n\n"但访客规则——"\n\n"访客规则是另一张纸。"\n\n"贴在走廊尽头。"\n\n"那上面写着——"\n\n"保护结束的那一刻，"\n\n"就是你该小心的时候。"\n\n<span class="d">（你忽然明白了什么。）</span>`,
  choices:[
    {t:"去走廊尽头看看",to:"s_corridor_rule",san:-6},
    {t:"先休息",to:"d_back_dorm"}
  ]},
"s_corridor_rule":{ch:"隐藏",title:"走廊尽头 · 一张纸",
  text:`你走到走廊尽头。\n\n墙上贴着一张纸。\n\n上面写着七条规则。\n\n<span class="r">【访客规则】</span>\n\n一、当你看到两个访客时，只能选一个。\n\n二、你选的那个，会决定你的路线。\n\n三、访客说的话，一半真一半假。\n\n四、如果两个访客同时说话，闭上眼。\n\n五、你选的访客会保护你，直到你不再需要保护。\n\n六、保护结束的那一刻，就是你要小心的时候。\n\n七、千万不要同时相信两个访客。\n\n你正要撕下来。\n\n身后，有人说话。\n\n"你也看到了。"\n\n你回头。\n\n温瑶站在走廊的另一端。\n\n她没有笑。\n\n<span class="d">（她看着你的眼睛，很认真。）</span>`,
  choices:[
    {t:"问她：你是访客吗？",to:"v_final_ask",san:-8},
    {t:"不理她，转身就走",to:"d_back_dorm",san:-6}
  ]},

/* ============ 温瑶 · 真相 & 最终选择 ============ */
"v_final_ask":{ch:"隐藏",title:"温瑶 · 坦白",
  text:`"你是访客吗？"\n\n她沉默了很久。\n\n"是。"\n\n"2019 级的。"\n\n"我死在这里的时候，还很年轻。"\n\n"他们告诉我，只要找到一个愿意替我的人，我就能走。"\n\n"所以我一直在找。"\n\n"找了六年。"\n\n"你是第一个，我会犹豫的。"\n\n<span class="d">（她没有走近你。）</span>`,
  choices:[
    {t:"问她：你会让我签名吗？",to:"v_sign_question",san:-6},
    {t:"问她：季默呢？",to:"v_jinmo_question",san:-8}
  ]},
"v_sign_question":{ch:"隐藏",title:"温瑶 · 签名",
  text:`"你会让我签名吗？"\n\n她抬起头，看着你。\n\n"会。"\n\n"但不是现在。"\n\n"为什么？"\n\n"因为现在我还不想。"\n\n"等你真正需要我的时候——"\n\n"我会的。"\n\n"就像别人对我那样。"\n\n<span class="d">（她的语气很平静。）</span>`,
  choices:[{t:"沉默",to:"v_final_choice",san:-5}]},
"v_jinmo_question":{ch:"隐藏",title:"温瑶 · 季默",
  text:`"季默呢？"\n\n她愣了一下。\n\n"他？"\n\n"他不该出现的。"\n\n"为什么？"\n\n"因为他和我，是同一年的。"\n\n"那一年，403 住了四个人。"\n\n"我是第四个。"\n\n"他是隔壁 402 的。"\n\n"他那天来找我。"\n\n"然后就再也没出去。"\n\n"他现在——"\n\n她顿了顿。\n\n"他现在，和我一样。"\n\n"我们都在等。"\n\n<span class="d">（你终于明白，季默抓你手臂的时候，为什么那么凉。）</span>`,
  choices:[{t:"明白了",to:"v_final_choice",san:-8}]},
"v_final_choice":{ch:"隐藏",title:"最 终 的 选 择",
  text:`走廊很长。\n\n温瑶站在左端。\n\n季默站在右端。\n\n两个人都没有说话。\n\n头顶的灯，一盏一盏地灭了。\n\n从你的位置，向两边扩散。\n\n<span class="r">你必须在他们之间，选一个。</span>`,
  choices:[
    {t:"走向温瑶",to:"f_to_wenyao",san:-5},
    {t:"走向季默",to:"f_to_jinmo",san:-5},
    {t:"站着不动",to:"f_stay",san:-10}
  ]},
"f_to_wenyao":{ch:"隐藏",title:"走向温瑶",
  text:`你朝温瑶走过去。\n\n季默立刻动了。\n\n他冲向你。\n\n温瑶挡在你面前。\n\n她抬起手，抓住季默的手腕。\n\n她的手很凉，但很有力。\n\n季默退了两步。\n\n他看着温瑶，笑了一下。\n\n"你护得了他一次。"\n\n"护得了他一辈子吗？"\n\n然后他消失了。\n\n温瑶转身看着你。\n\n她的手臂在抖。\n\n"你没事吧？"\n\n<span class="d">（你第一次看见她露出担心的表情。）</span>`,
  choices:[
    {t:"扶住她",to:"v_protect_1",set:{wenyaoProtected:true,choseWenyao:true}},
    {t:"问她：你为什么要救我？",to:"v_protect_ask",san:-5,set:{choseWenyao:true}}
  ]},
"v_protect_ask":{ch:"隐藏",title:"温瑶 · 为什么",
  text:`"你为什么要救我？"\n\n她愣了一下。\n\n然后她低下头。\n\n"我不知道。"\n\n"大概是因为——"\n\n"你笑起来的样子，很像一个人。"\n\n"谁？"\n\n"我自己。"\n\n"六年前的我。"\n\n<span class="d">（她说完，转过身。）</span>`,
  choices:[{t:"沉默，跟着她走",to:"v_protect_1",set:{wenyaoProtected:true,choseWenyao:true}}]},
"v_protect_1":{ch:"隐藏",title:"温瑶 · 保护期",
  text:`接下来的几天，温瑶总是出现在你身边。\n\n她帮你占座位。\n\n她递给你水。\n\n她记得你随口说过的小事。\n\n她提醒你别熬夜。\n\n你说话的时候，她会安静地看着你。\n\n<span class="d">（她从不说喜欢。但所有人都看得出来。）</span>`,
  choices:[
    {t:"继续接受她的保护",to:"v_protect_2",san:10},
    {t:"开始保持距离",to:"v_protect_2",san:-5}
  ]},
"v_protect_2":{ch:"隐藏",title:"温瑶 · 下雨天",
  text:`有一天，下雨了。\n\n她递给你一把伞。\n\n"拿着。"\n\n"你自己呢？"\n\n"我不用。"\n\n她笑了笑，自己走进雨里。\n\n你撑着伞，站在原地。\n\n你看着她走远。\n\n<span class="r">她走过的地面上，没有雨点。</span>\n\n<span class="d">（伞已经放进背包了。）</span>`,
  choices:[
    {t:"跟上去",to:"v_rain_follow",set:{hasUmbrella:true,wenyaoAffection:2}},
    {t:"回寝室",to:"v_protect_3",set:{hasUmbrella:true}}
  ]},
"v_rain_follow":{ch:"隐藏",title:"雨中",
  text:`你跟了上去。\n\n她没有回头。\n\n但她的脚步，慢了下来。\n\n走到走廊尽头，她停下来。\n\n"你不要跟着我。"\n\n"为什么？"\n\n"因为——"\n\n"我怕你会看到一些不该看的东西。"\n\n她转过身。\n\n她的眼睛里，有一种很深的悲伤。\n\n"你回去吧。"\n\n"等哪天我不在了，你自然就知道了。"\n\n<span class="d">（她的身影，在雨里慢慢淡了。）</span>`,
  choices:[{t:"回寝室",to:"v_protect_3",san:-5,set:{wenyaoAffection:3}}]},
"v_protect_3":{ch:"隐藏",title:"温瑶 · 便条",
  text:`第二天，你在书包里发现一张便条。\n\n<span class="g">"今天你没吃早饭。"</span>\n\n<span class="g">"下午三点，图书馆门口等你。"</span>\n\n<span class="g">"给你带了点吃的。"</span>\n\n<span class="g">"——温瑶"</span>\n\n<span class="d">（便条已经放进背包。理智低于 20 时会自动消耗。）</span>`,
  choices:[
    {t:"按时赴约",to:"v_meet_again",san:5,set:{hasNote:true,wenyaoAffection:4}},
    {t:"不去",to:"v_protect_4",san:-4,set:{hasNote:true}}
  ]},
"v_meet_again":{ch:"隐藏",title:"赴约",
  text:`下午三点，图书馆门口。\n\n她坐在台阶上，手里拎着一个纸袋。\n\n"你来了。"\n\n她站起来，把纸袋递给你。\n\n"热的。"\n\n"还烫着。"\n\n你接过来。\n\n纸袋确实很烫。\n\n但她的手——更烫。\n\n<span class="d">（她握过的地方，纸袋上的水汽都干了。）</span>`,
  choices:[{t:"谢谢她",to:"v_protect_4",san:5}]},
"v_protect_4":{ch:"隐藏",title:"温瑶 · 保护结束",
  text:`又过了几天。\n\n那天晚上，你站在阳台上。\n\n楼下的花坛边，站着温瑶。\n\n她抬起头，对你笑了笑。\n\n然后她开口。\n\n"你已经不需要我保护了。"\n\n"为什么？"\n\n"因为真正的危险，不在外面。"\n\n"在哪里？"\n\n她指了指你自己。\n\n"在这里。"\n\n"你心里，已经有答案了。"\n\n"你现在缺的，只是签字。"\n\n<span class="r">（她手里，多出了一本深红色的册子。）</span>`,
  choices:[
    {t:"下楼，和她面对面",to:"w_final_ask",san:-5},
    {t:"不下楼，躲在房间里",to:"v_hide",san:-8}
  ]},
"v_hide":{ch:"隐藏",title:"躲",
  text:`你没有下楼。\n\n你躲在房间里。\n\n外面很安静。\n\n过了一整夜。\n\n第二天早上，你从窗户往下看。\n\n花坛边，已经没有她的身影。\n\n只有一朵小小的白花。\n\n<span class="d">（她走了。）</span>`,
  choices:[
    {t:"下楼捡起白花",to:"w_final_ask",set:{hasFlower:true,wenyaoLeft:true}},
    {t:"不去管它",to:"d_back_dorm",set:{wenyaoLeft:true}}
  ]},

/* ============ 温瑶 · 背刺线 ============ */
"w_final_ask":{ch:"隐藏",title:"温瑶 · 最后的请求",
  text:`你下楼了。\n\n她站在花坛边，手里拿着册子。\n\n"帮我个忙好吗？"\n\n"什么忙？"\n\n"在这里签个名。"\n\n"就当纪念。"\n\n她翻开册子最后一页。\n\n空白。\n\n但空白纸上，有一个很浅很浅的凹痕。\n\n像是有人曾在那里，用力写过字。\n\n"签吧。"\n\n"我保证，签完就没事了。"\n\n<span class="d">（她的表情很平静。）</span>`,
  choices:[
    {t:"签下自己的名字",to:"w_signed",san:-10},
    {t:"拒绝",to:"w_refuse",san:-5},
    {t:"拖延：让我再想想",to:"w_delay",san:-3}
  ]},
"w_signed":{ch:"隐藏",title:"签名",
  text:`你接过笔。\n\n笔很凉。\n\n笔尖落在纸上。\n\n你写下自己的名字。\n\n写完的一瞬间——\n\n温瑶笑了。\n\n但那不是之前的笑。\n\n<span class="r">那是一个很陌生、很冷、很饿的笑。</span>\n\n"谢谢你。"\n\n"谢谢你替我。"\n\n"我走了。"\n\n她转身，走向花坛深处。\n\n她的身影在月光里越来越淡。\n\n而你的名字，从你身上慢慢脱落。\n\n一点点地，飘向那本册子。\n\n<span class="d">（你终于明白，她一直在等这一刻。）</span>`,
  choices:[{t:"……",to:"e_betrayed",danger:true}]},
"w_refuse":{ch:"隐藏",title:"拒绝",
  text:`"我不签。"\n\n她愣了一下。\n\n然后她收起了笑。\n\n"为什么？"\n\n"因为我知道这是什么。"\n\n"你知道？"\n\n"我知道。"\n\n她沉默了很久。\n\n然后她抬起头。\n\n"那你就没用了。"\n\n<span class="r">她向你走来。</span>`,
  choices:[{t:"后退",to:"w_fight",san:-10}]},
"w_delay":{ch:"隐藏",title:"拖延",
  text:`"让我再想想。"\n\n她笑了笑。\n\n"好。"\n\n"你想多久都行。"\n\n"我有的是时间。"\n\n她转身走了。\n\n<span class="d">（但你注意到，她走的时候，手里还拿着那本册子。）</span>`,
  choices:[{t:"回寝室",to:"d_back_dorm",san:-5,set:{wenyaoDelayed:true}}]},
"w_fight":{ch:"隐藏",title:"温瑶 · 现形",
  text:`她向你走来。\n\n每走一步，她身上的光就淡一分。\n\n走到一半，她已经不是那个温瑶了。\n\n她的裙子变成了灰色。\n\n她的脸上，没有五官。\n\n只有一张很薄很薄的纸。\n\n<span class="r">她是一张纸。</span>\n\n一张写满了名字的纸。\n\n<span class="d">（你胸口的铃铛，开始发烫。）</span>`,
  choices:[
    {t:"摇铃铛",to:"w_bell",need:(S)=>S.flags.hasBell,lockHint:"需要温瑶的铃铛"},
    {t:"转身跑",to:"w_run",san:-15},
    {t:"站在原地",to:"e_become_her",san:-30,danger:true}
  ]},
"w_bell":{ch:"隐藏",title:"铃铛",
  text:`你摇响了铃铛。\n\n"叮——"\n\n她停住了。\n\n她退后半步。\n\n然后她的五官，慢慢回来了。\n\n她看着你。\n\n"你还有铃铛。"\n\n"是啊。"\n\n"……"\n\n她低下头。\n\n"走吧。"\n\n"趁我还能控制自己。"\n\n"走得越远越好。"\n\n<span class="d">（她转身，走进花坛深处。）</span>`,
  choices:[
    {t:"追上去",to:"w_counter",san:-8},
    {t:"转身跑",to:"w_run",san:-5}
  ]},
"w_run":{ch:"隐藏",title:"跑",
  text:`你转身就跑。\n\n身后没有脚步声。\n\n你跑回女寝楼，冲进 403。\n\n关上门，反锁。\n\n门外很安静。\n\n你看着门玻璃。\n\n玻璃上，映出你的脸。\n\n你的脸旁边，多了一个模糊的影子。\n\n她张了张嘴。\n\n你没有听见声音。\n\n但你读出了她的口型：\n\n<span class="r">"我还会来找你的。"</span>`,
  choices:[
    {t:"等天亮",to:"d_back_dorm",san:-10,set:{wenyaoEscaped:true}},
    {t:"去找陈默",to:"w_find_chen",san:-6,set:{wenyaoEscaped:true}}
  ]},
"w_find_chen":{ch:"隐藏",title:"找陈默",
  text:`你冲到陈默的床前。\n\n"陈默！"\n\n她抬起头。\n\n"你见到了？"\n\n"见到了。"\n\n"她还活着吗？"\n\n"什么？"\n\n"她还——能说话吗？"\n\n"能。"\n\n"那她还有救。"\n\n陈默站起来，从抽屉里摸出一本旧日记。\n\n"这是她的。"\n\n"2019 年，她留在这里的。"\n\n"你看完，就知道怎么救她了。"\n\n<span class="d">（温瑶的日记已经放进背包。）</span>`,
  choices:[
    {t:"翻开日记",to:"w_read_diary",set:{hasDiary:true}},
    {t:"先收起来，明天再看",to:"d_back_dorm",set:{hasDiary:true}}
  ]},
"w_read_diary":{ch:"隐藏",title:"温瑶的日记",
  text:`你翻开日记。\n\n第一页：\n\n"9 月 8 日。今天报到。"\n\n"403 寝室看起来很奇怪。苏也、李薇、陈默……"\n\n"还有一个位置，是空的。"\n\n第二页：\n\n"9 月 12 日。我发现那个空床位，是属于我的。"\n\n"我很高兴。"\n\n第三页：\n\n"9 月 15 日。我做了一个梦。"\n\n"梦里有人告诉我，只要我找到一个愿意替我的人，就能出去。"\n\n"我拒绝了。"\n\n最后一页：\n\n<span class="r">"10 月 14 日。我签了。"</span>\n\n<span class="r">"签给了我自己。"</span>\n\n<span class="r">"我成了那个'第四个'。"</span>\n\n<span class="r">"现在，轮到我了。"</span>`,
  choices:[
    {t:"合上日记",to:"w_diary_after",san:-8,set:{hasDiary:true}},
    {t:"翻到最后一页背面",to:"w_diary_back",san:-10,set:{hasDiary:true}}
  ]},
"w_diary_back":{ch:"隐藏",title:"日记 · 背面",
  text:`你把日记翻到最后一页的背面。\n\n上面有一行铅笔字。\n\n很淡，像是随时会消失。\n\n<span class="g">"如果你在读这本日记——"</span>\n\n<span class="g">"说明你已经认识我了。"</span>\n\n<span class="g">"也说明，我不在人世了。"</span>\n\n<span class="g">"请你不要恨我。"</span>\n\n<span class="g">"我只是想回家。"</span>\n\n<span class="d">（你把日记合上。）</span>`,
  choices:[{t:"收好日记，去做决定",to:"w_counter_pre",san:-5}]},
"w_diary_after":{ch:"隐藏",title:"日记 · 合上",
  text:`你合上日记。\n\n心里很乱。\n\n她不是纯粹的坏人。\n\n但她确实想让你替她。\n\n<span class="d">（你必须做出决定。）</span>`,
  choices:[{t:"去找到她",to:"w_counter_pre",san:-5}]},
"w_counter_pre":{ch:"隐藏",title:"温瑶 · 反杀准备",
  text:`你走出寝室。\n\n走廊里很安静。\n\n你走到走廊尽头，站在访客规则那张纸前。\n\n规则第五条：\n\n<span class="r">"你选的访客会保护你，直到你不再需要保护。"</span>\n\n第六条：\n\n<span class="r">"保护结束的那一刻，就是你要小心的时候。"</span>\n\n你终于明白了。\n\n<span class="d">（你需要在她再次出现时，做出正确的选择。）</span>`,
  choices:[
    {t:"等她出现",to:"w_counter",san:-5},
    {t:"摇响铃铛",to:"w_bell_call",need:(S)=>S.flags.hasBell,lockHint:"需要温瑶的铃铛"}
  ]},
"w_bell_call":{ch:"隐藏",title:"铃铛 · 召唤",
  text:`你摇响了铃铛。\n\n"叮——"\n\n"叮——"\n\n"叮——"\n\n铃声响了三下。\n\n走廊尽头，出现了一个模糊的身影。\n\n是温瑶。\n\n她站在光里。\n\n"你叫我？"\n\n"是。"\n\n"你想好了？"\n\n"想好了。"`,
  choices:[{t:"开始反杀",to:"w_counter",san:-5}]},
"w_counter":{ch:"隐藏",title:"温瑶 · 反杀",
  text:`你看着她的眼睛。\n\n"我不会签的。"\n\n她笑了。\n\n"不签也可以。"\n\n"那我就自己动手。"\n\n她抬手。\n\n走廊的灯，一盏一盏地灭了。\n\n你从口袋里摸出那本日记。\n\n<span class="r">"这是你的。"</span>\n\n<span class="r">"还给你。"</span>\n\n她愣住了。\n\n<span class="d">（日记发出微光。）</span>`,
  choices:[
    {t:"念出日记最后一行",to:"w_counter_2",san:-5,need:(S)=>S.flags.hasDiary,lockHint:"需要温瑶的日记"},
    {t:"把日记扔向她",to:"w_counter_3",san:-8,need:(S)=>S.flags.hasDiary,lockHint:"需要温瑶的日记"}
  ]},
"w_counter_2":{ch:"隐藏",title:"念日记",
  text:`你翻开日记，念出最后一页的背面。\n\n"如果你在读这本日记——"\n\n"说明你已经认识我了。"\n\n"也说明，我不在人世了。"\n\n"请你不要恨我。"\n\n"我只是想回家。"\n\n念完的时候，温瑶一动不动。\n\n她低下头。\n\n"……我忘了。"\n\n"我忘了，我自己写过这句话。"\n\n<span class="d">（她开始哭。）</span>`,
  choices:[{t:"走近她",to:"e_free_wenyao",san:-5}]},
"w_counter_3":{ch:"隐藏",title:"扔日记",
  text:`你把日记扔向她。\n\n日记在空中打开。\n\n页面翻飞。\n\n每一页上的字，都发出了微光。\n\n它们围住温瑶，像一个笼子。\n\n"你——"\n\n她来不及说完。\n\n日记合上了。\n\n她不见了。\n\n<span class="d">（地上，只留下一片褪色的蓝布。）</span>`,
  choices:[
    {t:"捡起蓝布",to:"e_killed_wenyao",san:-10},
    {t:"不理它，回寝室",to:"e_killed_wenyao",san:-8}
  ]},

/* ============ 季默线（选季默） ============ */
"f_stay":{ch:"隐藏",title:"站着不动",
  text:`你没有动。\n\n温瑶没有动，季默也没有动。\n\n三个人就这样站在走廊里，谁都不肯先开口。\n\n头顶最后一盏灯，灭了。\n\n黑暗里，两个声音同时响起：\n\n"你选谁？"\n\n"你选谁？"\n\n你没有回答。\n\n沉默持续了很久。\n\n然后，左边传来一声很轻的叹息。\n\n右边也有一声。\n\n脚步声，一左一右，同时远去。\n\n走廊里只剩你一个人。\n\n你站在原地，一直站到天亮。\n\n天亮的时候，你发现自己的影子边缘，多了一道很淡的蓝色。\n\n<span class="d">（你没有选。但"名额"不会因为你不选就消失。）</span>`,
  choices:[
    {t:"走回 403",to:"d_back_dorm",san:-8,set:{refusedBoth:true}},
    {t:"追向左边",to:"f_to_wenyao",san:-5,set:{refusedBoth:true}},
    {t:"追向右边",to:"f_to_jinmo",san:-5,set:{refusedBoth:true}}
  ]},
"f_to_jinmo":{ch:"隐藏",title:"走向季默",
  text:`你朝季默走过去。\n\n他抬起头。\n\n他的脸在灯光下，很白。\n\n"你选我了。"\n\n"对。"\n\n"好。"\n\n他咧嘴一笑。\n\n那是一个很冷、很饿的笑。\n\n"谢谢你。"\n\n"我等这一天，等了六年。"\n\n他抬起手。\n\n<span class="d">（他的手指，是半透明的。）</span>`,
  choices:[{t:"⚡ 【躲 避】",act:"dodge",to:"j_attack_result",dodgeCount:4,dodgeNext:"j_attack_safe"}]},
"j_attack_result":{ch:"隐藏",title:"袭击 · 结果",text:`（结算中）`,choices:[]},
"j_attack_safe":{ch:"隐藏",title:"季默 · 完美躲过",
  text:`你连着躲了四次。\n\n季默扑了个空。\n\n他撞在走廊的墙上。\n\n墙上出现了一道裂痕。\n\n他转身，看着你。\n\n"你——"\n\n他的身体，开始碎裂。\n\n像是一张被撕开的纸。\n\n地板上，留下一把男寝的钥匙。\n\n<span class="d">（男寝 402 钥匙已经放进背包。）</span>`,
  choices:[
    {t:"捡起钥匙",to:"j_after_attack",set:{has402Key:true,survivedJinmo:true}},
    {t:"不捡，直接跑",to:"j_run_from_jinmo",set:{survivedJinmo:true}}
  ]},
"j_after_attack":{ch:"隐藏",title:"季默 · 之后",
  text:`你捡起钥匙。\n\n钥匙上有一张小纸条。\n\n<span class="g">"如果我不在了，你替我去看看。"</span>\n\n<span class="g">"看什么？"</span>\n\n<span class="g">"看我的床还在不在。"</span>\n\n你回头。\n\n走廊里已经没有人了。\n\n只有墙上那道裂痕，还在。\n\n<span class="d">（你知道，你会去男寝的。）</span>`,
  choices:[
    {t:"回寝室休息",to:"d_back_dorm"},
    {t:"现在就去男寝 402",to:"j_go_402",san:-5}
  ]},
"j_run_from_jinmo":{ch:"隐藏",title:"季默 · 逃跑",
  text:`你转身就跑。\n\n身后传来碎裂的声音。\n\n你跑回女寝楼，冲进 403。\n\n反锁门。\n\n靠在门上喘气。\n\n门玻璃上，映出你的脸。\n\n你的脸旁边——\n\n是季默。\n\n他在笑。\n\n<span class="d">（他不打算放过你。）</span>`,
  choices:[
    {t:"摇响温瑶的铃铛",to:"j_bell_defense",need:(S)=>S.flags.hasBell,lockHint:"需要温瑶的铃铛"},
    {t:"闭眼装睡",to:"j_ignore",san:-8}
  ]},
"j_bell_defense":{ch:"隐藏",title:"铃铛 · 驱散",
  text:`你摇响铃铛。\n\n"叮——"\n\n季默的影像，在玻璃上晃了一下。\n\n然后消失了。\n\n门外传来一个声音，很远：\n\n"她给你的东西。"\n\n"你还留着。"\n\n"……"\n\n"那你就别用。"\n\n"因为那是她控制你的东西。"\n\n<span class="d">（你低头看铃铛。铃铛上的红绳，确实是温瑶的款式。）</span>`,
  choices:[
    {t:"把铃铛扔了",to:"j_throw_bell",san:-10},
    {t:"继续留着",to:"d_back_dorm",san:-3,set:{wenyaoBellKept:true}}
  ]},
"j_throw_bell":{ch:"隐藏",title:"扔铃铛",
  text:`你把铃铛扔进垃圾桶。\n\n铃铛落在垃圾桶里，没有声音。\n\n你等了一会儿。\n\n什么都没有发生。\n\n你正准备睡觉。\n\n忽然，垃圾桶里传来"叮"的一声。\n\n你猛地转头。\n\n铃铛——\n\n自己从垃圾桶里，飞了出来。\n\n落在你的床头。\n\n<span class="d">（铃铛自己回来了。）</span>`,
  choices:[
    {t:"不管它，睡觉",to:"d_back_dorm",san:-8,set:{bellReturned:true}},
    {t:"再扔一次",to:"j_throw_bell_2",san:-10}
  ]},
"j_throw_bell_2":{ch:"隐藏",title:"铃铛 · 第二次",
  text:`你又把铃铛扔了。\n\n扔出窗外。\n\n这次，你仔细听着。\n\n窗外，很远的地方，传来"叮"的一声。\n\n然后是一阵风声。\n\n然后——\n\n铃铛落在你的枕头上。\n\n<span class="r">它一直会回来。</span>\n\n<span class="d">（你终于明白，温瑶给的铃铛，是收不回的。）</span>`,
  choices:[
    {t:"接受它",to:"d_back_dorm",set:{bellPermanent:true}},
    {t:"用剪刀剪断红绳",to:"j_cut_bell",san:-15}
  ]},
"j_cut_bell":{ch:"隐藏",title:"剪铃铛",
  text:`你用剪刀剪断了红绳。\n\n铃铛掉在地上。\n\n这次，它没有动。\n\n你松了一口气。\n\n就在你准备上床的时候——\n\n你听见了。\n\n"叮。"\n\n声音不是从地上传来的。\n\n是从<span class="r">你自己身上</span>传来的。\n\n<span class="d">（红绳还在你手腕上。）</span>`,
  choices:[{t:"……",to:"d_back_dorm",san:-20,set:{bellBound:true}}]},
"j_ignore":{ch:"隐藏",title:"闭眼装睡",
  text:`你闭上眼睛。\n\n门外很安静。\n\n过了很久。\n\n久到你以为他走了。\n\n忽然，你听见耳边有人说话：\n\n"我知道你醒着。"\n\n"你听着。"\n\n"她会让你签名的。"\n\n"她让你签的时候——"\n\n"别签。"\n\n"然后来找我。"\n\n"我教你，怎么对付她。"\n\n<span class="d">（你睁开眼。寝室里没有人。）</span>`,
  choices:[{t:"记住了",to:"d_back_dorm",san:-5,set:{jinmoAdvice:true}}]},
"j_go_402":{ch:"隐藏",title:"男寝 402",
  text:`你去了男寝。\n\n门口没有人。\n\n你走进去，上了四楼。\n\n402 的门，是开着的。\n\n里面很干净。\n\n四张床。\n\n三张整齐，一张空着。\n\n空床的床头，放着一本日记。\n\n你走过去，翻开。\n\n第一页：\n\n<span class="r">"2019 年 9 月 8 日，今天是报到日。"</span>\n\n<span class="r">"我叫季默。"</span>\n\n<span class="r">"隔壁女寝有个女生，叫温瑶。"</span>\n\n<span class="r">"她很漂亮。"</span>\n\n<span class="r">"我想去认识她。"</span>`,
  choices:[
    {t:"继续往下翻",to:"j_diary_2",san:-5},
    {t:"合上日记，离开",to:"j_leave_402",san:-5}
  ]},
"j_diary_2":{ch:"隐藏",title:"季默的日记",
  text:`你继续翻。\n\n"9 月 12 日。今天我去了 403 门口。"\n\n"她没有出来。"\n\n"9 月 15 日。我又去了。"\n\n"她还是没出来。"\n\n"10 月 13 日。我听见 403 里有人哭。"\n\n"我敲门。"\n\n"门开了。"\n\n"我看见了她。"\n\n<span class="r">"她的脸，是白的。"</span>\n\n<span class="r">"她的裙子，是蓝的。"</span>\n\n<span class="r">"她伸出手，对我说——"</span>\n\n<span class="r">"帮我。"</span>`,
  choices:[
    {t:"翻到最后一页",to:"j_diary_3",san:-8},
    {t:"合上日记",to:"j_leave_402",san:-5}
  ]},
"j_diary_3":{ch:"隐藏",title:"季默的日记 · 最后一页",
  text:`你翻到最后一页。\n\n只有一行字。\n\n写得很大，很用力。\n\n<span class="r">"10 月 14 日，我替她签了。"</span>\n\n<span class="r">"她说她会回来救我。"</span>\n\n<span class="r">"她没有。"</span>\n\n<span class="r">"她在骗我。"</span>\n\n<span class="r">"但她没有骗你。"</span>\n\n<span class="r">"因为她喜欢你。"</span>\n\n<span class="r">"就像当年，喜欢我一样。"</span>\n\n<span class="d">（你终于明白，季默为什么会袭击你。）</span>`,
  choices:[
    {t:"合上日记，转身离开",to:"e_jinmo_dead",san:-10,set:{knowJinmoTruth:true}},
    {t:"把温瑶的日记，留在他的床头",to:"e_jinmo_free",san:-8,
      need:(S)=>S.flags.hasDiary,lockHint:"需要温瑶的日记"}
  ]},
"j_leave_402":{ch:"隐藏",title:"离开男寝",
  text:`你走出男寝。\n\n站在楼下，抬头看。\n\n四楼 402 的窗户里，站着一个人。\n\n他在看你。\n\n他没有动。\n\n只是看着。\n\n然后，他抬起手。\n\n对你做了一个动作。\n\n<span class="d">（他把手指，放在唇上。像是让你别说话。）</span>`,
  choices:[
    {t:"回寝室",to:"d_back_dorm"},
    {t:"对他点点头",to:"j_nod",san:5,set:{jinmoTrust:1}}
  ]},
"j_nod":{ch:"隐藏",title:"点头",
  text:`你对他点点头。\n\n他也点点头。\n\n然后他转身，走进房间。\n\n窗户上的灯灭了。\n\n你站在原地，很久。\n\n然后你听见，很远的地方，传来一声很轻的叹息。\n\n"……谢谢。"`,
  choices:[{t:"回寝室",to:"d_back_dorm",san:5}]},

/* ============ 最终抉择 & 新结局 ============ */
"t_choice":{ch:"隐藏",title:"最 终 抉 择",
  text:`你站在校门口。\n\n温瑶和季默，都站在你身后。\n\n两个人，都没有说话。\n\n你低头看手里的《新生手册》。\n\n最后一页，是空白的。\n\n空白纸上，有一个很浅很浅的凹痕。\n\n像是有人曾在那里，用力写过字。\n\n<span class="r">你必须在他们之间，选一个。</span>\n\n<span class="r">或者，谁都不选。</span>`,
  choices:[
    {t:"选择温瑶",to:"f_to_wenyao",san:-10},
    {t:"选择季默",to:"f_to_jinmo",san:-10},
    {t:"谁都不选",to:"e_both_free",san:-20,need:(S)=>S.flags.hasDiary && S.flags.hasJinmoCard,lockHint:"需要温瑶的日记 + 季默的学生证"},
    {t:"撕掉《新生手册》",to:"e_visitor_break",san:-30,danger:true}
  ]},
"e_betrayed":{ch:"结局",ending:true,title:"结局 · 被温瑶背刺",
  text:`你在《新生手册》最后一页，写下了自己的名字。\n\n写完的一瞬间，温瑶笑了。\n\n她第一次露出那种表情。\n\n很满足，很轻。\n\n"谢谢你。"\n\n"我终于可以走了。"\n\n她转身，走向花坛深处。\n\n她的身影越来越淡。\n\n而你的名字，从你身上慢慢脱落。\n\n一点一点地，飘向那本册子。\n\n<span class="r">你想起访客规则第五条——</span>\n\n<span class="r">"你选的访客会保护你，直到你不再需要保护。"</span>\n\n<span class="r">保护结束的那一刻，就是你该小心的时候。</span>\n\n<span class="r">你早就该想起来的。</span>\n\n——【被温瑶背刺】结局达成。`,
  ending:"被温瑶背刺",rank:"F"},
"e_free_wenyao":{ch:"结局",ending:true,title:"结局 · 拯救温瑶",
  text:`你选择了温瑶。\n\n但不是让她签名。\n\n你把她领到图书馆。\n\n你找到老太太，把日记放在桌上。\n\n"这是她的。"\n\n老太太推了推眼镜。\n\n"你想做什么？"\n\n"我想让她走。"\n\n老太太看了很久。\n\n然后她点点头。\n\n她拿出一张新的借书卡，写下温瑶的名字。\n\n然后她把卡撕成两半。\n\n"好了。"\n\n"她自由了。"\n\n你回头看。\n\n温瑶站在你身后，身体在变淡。\n\n"你——"\n\n"我什么？"\n\n"你为什么救我？"\n\n"因为你值得。"\n\n她愣了一下。\n\n然后她笑了。\n\n那个笑，是真正的笑。\n\n"谢谢你。"\n\n"谢谢你，从来没人这么对我说过。"\n\n她消失了。\n\n图书馆里，只剩下一张空白的借书卡。\n\n——【拯救温瑶】结局达成。`,
  ending:"拯救温瑶",rank:"SS"},
"e_killed_wenyao":{ch:"结局",ending:true,title:"结局 · 反杀温瑶 · 终",
  text:`你把日记扔向温瑶。\n\n日记在空中打开。\n\n页面翻飞。\n\n每一页上的字，都发出微光。\n\n它们围住她，像一个笼子。\n\n"你——"\n\n她来不及说完。\n\n日记合上了。\n\n她不见了。\n\n地上，只留下一片褪色的蓝布。\n\n你捡起来。\n\n蓝布上，还带着一点温度。\n\n你把它收进口袋。\n\n从那天起，你经过花坛边的时候，\n\n总会觉得有人在看你。\n\n但你已经不怕了。\n\n——【反杀温瑶 · 终】结局达成。`,
  ending:"反杀温瑶 · 终",rank:"S"},
"e_become_her":{ch:"结局",ending:true,title:"结局 · 成为下一个温瑶",
  text:`你站在原地，没有动。\n\n温瑶走到你面前。\n\n她抬起手，按在你的额头上。\n\n"你不躲。"\n\n"我不躲。"\n\n"你想好了？"\n\n"想好了。"\n\n"那我们就换。"\n\n她的手指，穿过你的额头。\n\n你看见了一条很长很长的走廊。\n\n走廊尽头，站着一个人。\n\n那是你。\n\n穿着褪色的蓝裙子。\n\n站在 403 门口。\n\n在等下一个新生。\n\n——【成为下一个温瑶】结局达成。`,
  ending:"成为下一个温瑶",rank:"F"},
"e_jinmo_free":{ch:"结局",ending:true,title:"结局 · 季默的解脱",
  text:`你把温瑶的日记，放在季默手里。\n\n他翻开。\n\n他读得很慢。\n\n读到最后一页的时候，他哭了。\n\n"她真的写了。"\n\n"她真的。"\n\n"她不是骗我。"\n\n"她只是……"\n\n他合上日记。\n\n"只是她也没办法。"\n\n他抬起头。\n\n"谢谢。"\n\n"谢谢你告诉我。"\n\n"现在我可以走了。"\n\n他站起来。\n\n他的身体开始发光。\n\n然后他消失了。\n\n地上，只留下一张空学生证。\n\n——【季默的解脱】结局达成。`,
  ending:"季默的解脱",rank:"S"},
"e_jinmo_dead":{ch:"结局",ending:true,title:"结局 · 季默 · 不归",
  text:`你转身离开。\n\n季默跪在原地。\n\n他没有叫住你。\n\n你回到寝室，关上门。\n\n第二天，你听说——\n\n男寝 402 的窗户，破了。\n\n从那以后，再也没有人在 402 出现过。\n\n只有偶尔，深夜经过男寝门口，\n\n会听见里面有人在数数。\n\n"一、二、三……四。"\n\n"一、二、三……四。"\n\n数到四，就会停下。\n\n然后重新开始。\n\n——【季默 · 不归】结局达成。`,
  ending:"季默 · 不归",rank:"F"},
"e_both_free":{ch:"结局",ending:true,title:"结局 · 双人自由",
  text:`你站在校门口。\n\n温瑶在你左边。季默在你右边。\n\n你翻开手册，把温瑶的日记展开。\n\n把季默的学生证，放在日记上。\n\n然后你念出日记的最后一页：\n\n"请你不要恨我。"\n\n"我只是想回家。"\n\n念完的时候，你听见两个人的声音：\n\n"……"\n\n"……"\n\n"温瑶？"\n\n"季默？"\n\n他们同时抬头。\n\n他们看着彼此。\n\n很久。\n\n然后温瑶说：\n\n"对不起。"\n\n季默说：\n\n"没关系。"\n\n两个人一起笑了。\n\n然后，两个人一起，在你面前，慢慢变淡。\n\n最后，地上只留下两朵小白花。\n\n——【双人自由】结局达成。`,
  ending:"双人自由",rank:"EX"},
"e_visitor_break":{ch:"结局",ending:true,title:"结局 · 访客规则破解",
  text:`你撕掉了《新生手册》。\n\n你撕掉了访客规则。\n\n你撕掉了所有你找到的、属于"过去"的东西。\n\n你站在校门口。\n\n风很大。\n\n温瑶在你身后。\n\n季默在你身后。\n\n两个人一起说：\n\n"你在做什么？"\n\n"我在做一件事。"\n\n"什么事？"\n\n"放你们走。"\n\n你转身。\n\n你看着他们。\n\n"我不是访客。"\n\n"我是这一届的第四个。"\n\n"但我可以不签。"\n\n"只要我不签——"\n\n"规则就没办法完成。"\n\n"你们两个就都走不了。"\n\n"但也杀不了我。"\n\n"这就是规则唯一的漏洞。"\n\n两个人沉默了。\n\n然后温瑶说：\n\n"你……"\n\n"你早就知道了。"\n\n"对。"\n\n"那你为什么——"\n\n"因为我想给你们一个选择。"\n\n两个人对视了一眼。\n\n然后他们一起笑了。\n\n"谢谢你。"\n\n——【访客规则破解】结局达成。`,
  ending:"访客规则破解",rank:"SSS"},

/* ============ 序章 ============ */
"start":{ch:"序章",title:"临江大学 · 校门",
  text:`九月的风里有一股铁锈味。\n\n你拖着行李箱站在"临江大学"的校门下。牌匾上的字是暗红色的，像是被人反复描过很多遍——描得太厚，反而看不清笔画。\n\n手机里新生群还在跳消息：\n\n【新生A】有人知道为什么官网的校历只排到12月31日吗？\n【新生B】别问。\n【新生B】别问。\n【新生B】别问。\n【学姐-周】欢迎来到临江大学。请务必保管好你的《新生手册》。\n【学姐-周】以及——不要在晚上数楼梯。`,
  choices:[
    {t:"去报到处领《新生手册》",to:"p_baodao"},
    {t:"在校门口拍一张照",act:"camera",to:"p_photo"},
    {t:"私聊学姐-周，问清楚",to:"p_ask"},
    {t:"在校门口站着，先观察一会儿",to:"p_wait",san:-2}
  ]},
"p_wait":{ch:"序章",title:"校门 · 观察",
  text:`你没有急着进校，而是站在校门外，观察了一会儿。\n\n进出的学生不少，但仔细看，有个奇怪的地方——\n\n所有进去的人，抬脚的时候，都会在门槛前顿一下。\n\n像是踩到了什么。\n\n又像是，在犹豫。\n\n一个学姐从你身边走过，忽然停下，转头看你：\n\n"你是今年 403 的吧？"\n\n你还没回答，她已经走远了。\n\n她背着的包上，挂着一枚铜钱。\n\n和你以后会拿到的那一枚，一模一样。`,
  choices:[
    {t:"跟上去问清楚",to:"p_chase",san:-4},
    {t:"去报到处",to:"p_baodao",set:{sawBlue:true}}
  ]},
"p_chase":{ch:"序章",title:"追",
  text:`你追上去。\n\n可学姐走得很快，拐进一条小巷就没了踪影。\n\n巷子里只有一面旧墙。\n\n墙上有人用红漆写了一行字：\n\n<span class="r">"别追。追的人，都会成为今年的那个。"</span>\n\n你回头。\n\n校门还在。梧桐道还在。\n\n只是天，好像比刚才暗了一点。`,
  choices:[
    {t:"退出小巷，去报到处",to:"p_baodao",san:-6,set:{chased:true}}
  ]},
"p_photo":{ch:"序章",title:"校门 · 照片",
  text:`你收起手机，低头看刚才拍下的那张照片。\n\n照片里，校门下站着很多人——拖着行李的新生、举牌的志愿者、撑伞的家长。\n\n你数了数。你数不清。\n\n照片右下角，有个穿深蓝色外套的女生正对着镜头笑。她没有影子。\n\n你抬头看向真实的校门。没有人对你笑。`,
  choices:[
    {t:"把照片删掉",to:"p_photo_del",set:{sawBlue:true}},
    {t:"放大看看那个女生",to:"p_photo_zoom",san:-6,set:{sawBlue:true}}
  ]},
"p_photo_del":{ch:"序章",title:"删除",
  text:`你按下删除。\n\n相册问："确定要删除这张照片吗？"\n\n你点了确定。照片消失了。\n\n但你的手机相册里，最后一张照片变成了一张新图——校门口，空无一人，只有你自己的行李箱孤零零立在原地。\n\n而行李箱旁边，站着一双没穿鞋的脚。\n\n你锁屏。手心全是汗。\n\n"同学，报到处在这边。"一个学姐笑着指路。`,
  choices:[{t:"跟着学姐去报到处",to:"p_baodao"}]},
"p_photo_zoom":{ch:"序章",title:"放大",
  text:`你把照片放大到最大。\n\n那个深蓝色外套的女生，脸是模糊的。但她举着一块牌子，牌子上写着：\n\n【欢迎新同学 · 第 4 届】\n\n第4届？临江大学建校一百多年了。\n\n你再看时，女生的位置变成了空白。照片里只剩下你一个人，站在校门下，笑得僵硬。\n\n你根本没笑过。`,
  choices:[
    {t:"立刻删掉照片，去报到处",to:"p_baodao",set:{sawBlue:true}},
    {t:"把这张照片设为壁纸",to:"p_photo_wall",san:-10,set:{sawBlue:true,wallpaper:true}}
  ]},
"p_photo_wall":{ch:"序章",title:"壁纸",
  text:`你鬼使神差地把那张照片设成了壁纸。\n\n屏幕暗下去的一瞬间，你看见锁屏上自己的倒影——倒影里的你，穿的是深蓝色外套。\n\n你迅速按亮屏幕。壁纸变成了纯黑。\n\n你松了一口气，把手机塞进口袋，转身往报到处走。身后，校门牌匾上的暗红字迹似乎又厚了一层。`,
  choices:[{t:"去报到处",to:"p_baodao"}]},
"p_ask":{ch:"序章",title:"私聊",
  text:`你点开学姐-周的头像，打了一行字：\n\n"学姐，为什么晚上不能数楼梯？"\n\n对方"正在输入……"了很久。\n\n【学姐-周】你还没领手册吧。\n【学姐-周】去领。\n【学姐-周】领完先看第 3 页，再看第 7 页。\n【学姐-周】顺序不能错。\n【学姐-周】最后——\n【学姐-周】如果你在宿舍听到有人叫你的名字，只叫了一声，不要答应。`,
  choices:[
    {t:"再问：叫两声呢？",to:"p_ask2"},
    {t:"道谢，去领手册",to:"p_baodao",set:{knowsName:true}}
  ]},
"p_ask2":{ch:"序章",title:"两声",
  text:`【你】那叫两声呢？\n\n对方沉默了很久。\n\n【学姐-周】叫两声，你就要看猫眼。\n【学姐-周】如果猫眼外面黑得像没开灯——\n【学姐-周】那你就当没听见。\n【学姐-周】还有，别问我叫什么名字。\n【学姐-周】我已经毕业三年了。\n\n你盯着"毕业三年"这四个字。\n\n聊天框上方，她的昵称变成了灰色。\n\n【该用户已注销】`,
  choices:[{t:"去报到处领手册",to:"p_baodao",san:-8,set:{knowsName:true,ghostSenior:true}}]},
"p_baodao":{ch:"序章",title:"报到处",set:{hasManual:true},
  text:`报到处设在老体育馆里，空气闷得像盖了层棉被。\n\n排在你前面的女生小声抱怨："这手册好厚啊，跟砖头一样。"\n\n轮到你时，桌后的老师抬起头。她的眼睛很亮，亮得不太正常。\n\n"姓名、学号。"\n\n你报上信息。她在一本泛黄的本子上划了一笔，然后把一本深红色封皮的册子推过来。\n\n《临江大学 · 新生手册》\n\n封皮上没有校徽，只有一个烫金的数字：<span class="r">403</span>。\n\n"保管好。"她说，"丢了的话……我们也没办法补。"\n\n<span class="d">（手册已经放进背包了。右上角可以打开。）</span>`,
  choices:[
    {t:"当场翻开看",to:"p_manual"},
    {t:"先塞进包里，去找宿舍",to:"p_road"},
    {t:"问老师：403 是不是有什么特别的？",to:"p_baodao_q",san:-5}
  ]},
"p_baodao_q":{ch:"序章",title:"报到处的追问",
  text:`"老师，403 是不是有什么特别的？"\n\n她抬起头，看了你三秒。\n\n那三秒里，你听见体育馆里所有的声音都消失了——风扇声、脚步声、纸张翻动的声音，全没了。\n\n然后她笑了。\n\n"特别？"\n\n"每一年，都有一个新生这么问。"\n\n"每一年，我都要回答同一句话。"\n\n她靠近你，声音很低：\n\n"403 不特别。"\n\n"特别的是——"\n\n"下一个。"\n\n她直起身，把桌子上的其他册子推给你看。\n\n每一本封皮上，烫金的数字都是 403。`,
  choices:[
    {t:"拿着手册离开",to:"p_manual",san:-6,set:{know403:true}}
  ]},
"p_manual":{ch:"序章",title:"新生手册",
  text:`你翻开手册。\n\n第一页是校长致辞，字体很正，措辞很怪：\n\n"……希望各位同学在临江大学度过四年，或者更久，或者更短……"\n\n第二页是校园地图。你找了半天，发现地图上所有的建筑都标了号，唯独有一栋没有——教学楼西侧，一片灰色的空白。\n\n第三页开始，是<span class="r">校规总则</span>。`,
  choices:[
    {t:"认真读完校规总则",to:"p_rules1"},
    {t:"直接跳到第7页",to:"p_rules7",set:{skipTo7:true}},
    {t:"先看校园地图那一片空白",to:"p_map_hole",san:-4}
  ]},
"p_map_hole":{ch:"序章",title:"地图 · 空白",
  text:`你把手册翻到第二页，凑近看那片空白。\n\n很淡，但确实有东西。\n\n空白里，其实有字。\n\n是铅笔写的，已经被擦掉大半，只留下浅浅的凹痕。\n\n你侧着光看，勉强认出三个字：\n\n<span class="r">"老校区"</span>\n\n下面还有一行更小的字：\n\n<span class="d">"1987 年后封闭"</span>`,
  choices:[
    {t:"翻回第三页读校规",to:"p_rules1",set:{knowsOldCampus:true}},
    {t:"直接去老校区看看",to:"o_enter",san:-8,set:{knowsOldCampus:true}}
  ]},
"p_rules1":{ch:"序章",title:"校规总则",
  text:`<span class="r">【临江大学学生行为守则 · 总则】</span>\n\n一、本校所有课程均在 23:00 前结束。若你在 23:00 后仍听到下课铃，请留在原地，闭眼，默数六十下。\n\n二、本校只有十二层以下的楼层。若你在电梯中看到"13"，请立刻按下所有按钮，并在最近的楼层离开。\n\n三、图书馆闭馆时间为 22:00。若 22:00 后馆内仍亮着灯，那不是图书馆。\n\n四、食堂每餐只提供三样菜。若你看到第四样菜，请假装没看见，并且当天不要再进食堂。\n\n五、若你发现自己在数楼梯，请立刻停下。楼梯的阶数不是固定的。\n\n六、本校没有"深蓝色外套"的校服。若有人穿深蓝色外套向你问路，请回答"我不知道"，然后离开，不要回头。\n\n七、<span class="g">以上规则不适用于 403 寝室。</span>\n\n你盯着第七条看了很久。\n\n"不适用于 403 寝室。"\n\n——是什么意思？`,
  choices:[
    {t:"翻到第 7 页",to:"p_rules7"},
    {t:"合上手册，去找宿舍",to:"p_road",set:{readRules:true}},
    {t:"回头再看第六条",to:"p_rule6",san:-3}
  ]},
"p_rule6":{ch:"序章",title:"第六条",
  text:`你反复读第六条。\n\n<span class="r">"若有人穿深蓝色外套向你问路，请回答'我不知道'，然后离开，不要回头。"</span>\n\n你忽然意识到一件事——\n\n规则里说"不要回头"，但没说"不要回答"。\n\n也就是说，只要你回答了，就没事。\n\n——除非，答案错了。\n\n你把这句话记在心里。`,
  choices:[
    {t:"翻到第 7 页",to:"p_rules7",set:{readRules:true,rule6:true}},
    {t:"合上手册，去找宿舍",to:"p_road",set:{readRules:true,rule6:true}}
  ]},
"p_rules7":{ch:"序章",title:"第 7 页",
  text:`第 7 页只有一行字，居中，字号很大：\n\n<span class="r">"403 寝室的规则，贴在 403 寝室的门后。"</span>\n\n下面还有一行小字，像是后来加上去的，笔迹潦草：\n\n<span class="d">"如果你被分到了 403，请无论如何，活到毕业。"</span>\n\n你翻到第 8 页。\n\n第 8 页被撕掉了。\n\n撕口很整齐，像是用尺子比着裁的。`,
  choices:[{t:"去宿舍楼",to:"p_road",set:{readRules:true,know403:true}}]},
"p_road":{ch:"序章",title:"通往宿舍",
  text:`宿舍区在校区最北边，要穿过一整条梧桐道。\n\n九月了，梧桐叶却一片都没黄，绿得发黑，垂得很低。\n\n路上没什么人。你走了大约十分钟，忽然意识到一件事——\n\n你已经经过了四次"三号宿舍楼"。\n\n第一次，你以为是看错了。第二次，你告诉自己校区布局重复。第三次，你停下脚步，抬头认真看清了楼牌：\n\n<span class="r">三号宿舍楼</span>\n\n第四次，你站在同一块楼牌下。\n\n而你手里的新生手册，第 12 页的宿舍分配表上，白纸黑字写着：\n\n<span class="g">姓名：你　寝室：403　楼号：四号楼</span>`,
  choices:[
    {t:"继续往前走，找四号楼",to:"p_road2"},
    {t:"回头，原路返回校门",to:"p_road_back"},
    {t:"站在原地，翻开手册第 12 页再看一遍",to:"p_road3",san:-5},
    {t:"走进三号楼看看",to:"p_road_3",san:-6}
  ]},
"p_road_3":{ch:"序章",title:"三号楼",
  text:`你推开了三号宿舍楼的门。\n\n楼里很暗，声控灯没亮。\n\n一楼走廊尽头，有一扇门虚掩着。\n\n门后传出一个女生的声音，很轻：\n\n"进来吧。"\n\n"这栋楼里，只有我一个人。"\n\n"我等了很久了。"\n\n你站在门口，没有动。\n\n你注意到——门缝下面的光，是从门外照进来的。\n\n而门里，是纯黑的。`,
  choices:[
    {t:"推门进去",to:"p_room_ghost",san:-14},
    {t:"转身离开，去四号楼",to:"p_road2",san:-6}
  ]},
"p_room_ghost":{ch:"序章",title:"三号楼 · 房间",
  text:`你推开门。\n\n房间里空无一人。\n\n只有一张床，床上的被子叠得整整齐齐。\n\n床头放着一本深红色的手册，烫金的数字是 403。\n\n你走过去，翻开。\n\n扉页上写着一行字：\n\n<span class="r">"1987 级 张敏　1998 级 周未　2003 级 陆澜　…"</span>\n\n名单很长。\n\n每一行都是一个人名，一个年份。\n\n最后一栏，写着：\n\n<span class="g">"2025 级 ——"</span>\n\n空白。\n\n但空白处，有一道浅浅的铅笔印。\n\n像是有人刚写过，又擦掉。`,
  choices:[
    {t:"合上册子，离开三号楼",to:"p_road2",san:-8,set:{sawNameList:true}},
    {t:"在空白处写下自己的名字",to:"e_namelist",san:-30,danger:true}
  ]},
"p_road2":{ch:"序章",title:"继续",
  text:`你决定不再理会那块楼牌，埋头往前。\n\n梧桐叶在头顶沙沙作响，像是有人在低声念你的名字。\n\n走了大约五分钟，一栋灰白色的老楼出现在视野尽头。楼牌上写着：\n\n<span class="g">四号宿舍楼</span>\n\n你松了口气。\n\n但就在你踏进楼门的一瞬间，你听见身后传来一声极轻的、几乎听不见的叹息。\n\n"……又来一个。"`,
  choices:[{t:"上楼，去 403",to:"d_door"},{t:"先在一楼看看",to:"d_lobby"}]},
"d_lobby":{ch:"寝室",title:"四号楼 · 一楼",
  text:`一楼很窄，只有一张桌子，桌上放着一本登记簿。\n\n你翻开登记簿。\n\n是入住登记。\n\n最新的几行是：\n\n<span class="g">苏也　403</span>\n<span class="g">李薇　403</span>\n<span class="g">陈默　403</span>\n\n第四行是空的。\n\n但第四行的笔迹，已经压出来了——纸上有一个很深的凹痕。\n\n像是有人先写了名字，又用橡皮擦掉了。\n\n你凑近看。\n\n凹痕的轮廓，是三个字。\n\n——你自己的名字。`,
  choices:[
    {t:"上楼，去 403",to:"d_door",san:-6,set:{sawRegister:true}}
  ]},
"p_road_back":{ch:"序章",title:"回头",
  text:`你转过身。\n\n梧桐道还在，但尽头不是校门——是另一栋宿舍楼。\n\n你走回去。楼牌上是"三号宿舍楼"。\n\n你又走回来。楼牌还是"三号宿舍楼"。\n\n你掏出手机想导航，屏幕上显示：\n\n<span class="r">定位中……定位失败。当前位置：未知。</span>\n\n电量从 68% 掉到了 12%。\n\n你深吸一口气，往唯一亮着灯的方向走去。`,
  choices:[
    {t:"走向灯光",to:"p_road2",san:-12,set:{lostOnce:true}},
    {t:"不再往宿舍走，掉头跑向校门",to:"p_gate_escape",san:-10}
  ]},
"p_gate_escape":{ch:"序章",title:"校门",
  text:`你跑回校门。\n\n保安亭里没有人。栏杆抬着。\n\n外面是马路，路灯亮着，有车经过。\n\n只要跨过栏杆，你就能离开这里。\n\n你回头看了一眼。\n\n梧桐道尽头，隐约站着一个人。\n\n她没有动。\n\n只是在看你。`,
  choices:[
    {t:"跨过栏杆，走出校门",to:"e_out",san:-15},
    {t:"退回校园，不走了",to:"p_road2",san:-8}
  ]},
"p_road3":{ch:"序章",title:"第 12 页",
  text:`你翻开手册第 12 页。\n\n分配表还在。\n\n但你的名字下面，多了一行手写的字，墨迹还没干透：\n\n<span class="r">"别数了。"</span>\n\n你猛地合上手册，四下张望。\n\n没有人。\n\n梧桐道上，只有你一个人，和满地一片都没落的绿叶。`,
  choices:[{t:"快步走向四号楼",to:"p_road2",san:-8}]},

/* ============ 寝室篇 ============ */
"d_door":{ch:"寝室",title:"403 门口",
  text:`四号宿舍楼没有电梯。你爬到四楼，走廊很长，灯是声控的，但你每走一步，灯就灭一盏，在你身后。\n\n走廊尽头，403。\n\n门是暗红色的，和手册封面一样的颜色。门上贴着一张 A4 纸，边角已经卷起，纸上的字是打印的：\n\n<span class="r">【403 寝室规则】</span>\n\n你正要细看，门从里面打开了。\n\n一个高个子女生探出头，咧嘴一笑："哟，最后一个到了！快进来快进来。"\n\n她身后，另外两个人正围着桌子收拾东西。`,
  choices:[
    {t:"先进门，打招呼",to:"d_enter"},
    {t:"先看完门上的规则",to:"d_rules",set:{sawRules:true}},
    {t:"站在门口，先观察一下寝室里面",to:"d_observe",san:-4},
    {t:"站在门口，先开口：「我知道这是 403 的四人间。」",need:(S)=>S.flags.know403,lockHint:"需先读完手册第 7 页",to:"h_door_claim",san:-3}
  ]},
"d_observe":{ch:"寝室",title:"观察",
  text:`你没有立刻进门，而是站在门口往里看。\n\n寝室是标准的四人间。但靠窗的位置，摆着三张床。\n\n三张。\n\n你数了两遍。三张床，三张书桌，三个衣柜。\n\n可门上的牌子写着"403 · 四人间"。\n\n那个高个子女生顺着你的目光看过去，笑容僵了一下，然后很快恢复：\n\n"哦，第四张床啊……上学期拆了。快进来吧，别在门口站着。"\n\n她说"上学期拆了"，可这栋楼今年才第一次住新生。`,
  choices:[
    {t:"进门",to:"d_enter",set:{knows3beds:true}},
    {t:"问她：这楼今年才启用吧？",to:"d_ask_floor",san:-6,set:{knows3beds:true}}
  ]},
"d_ask_floor":{ch:"寝室",title:"追问",
  text:`"这楼……不是今年才第一次住人吗？"\n\n空气安静了两秒。\n\n高个子女生脸上的笑慢慢收了。她侧过身，让开门口，用一种很轻的声音说：\n\n"你挺聪明的。"\n\n"聪明人在 403 活不长。"\n\n她顿了顿，又说：\n\n"但也可能活得最长。进来吧，把门关上。门一定要关严。"\n\n你进了门。门在你身后"咔哒"一声合上。`,
  choices:[{t:"和室友互相认识",to:"d_meet",set:{smart:true}}]},
"d_enter":{ch:"寝室",title:"403 室内",
  text:`你拖着箱子进了门。\n\n寝室比想象中要旧。墙皮有些发黄，靠门那面墙上贴着一张泛黄的纸，被胶带压得严严实实。\n\n高个子女生拍了拍你的肩膀："我叫苏也，体院的，你叫我椰子就行。"\n\n戴眼镜的女生从书堆里抬起头，推了推眼镜："李薇，中文系。"\n\n靠窗坐着的第三个人没说话。她穿着一件洗得发白的灰T恤，正低头擦一双很旧的布鞋。\n\n苏也咳了一声："那是陈默，她不爱说话，你别介意。"\n\n陈默忽然抬起头，看了你一眼。\n\n那一眼很平，但你莫名觉得——她在确认什么。`,
  choices:[
    {t:"主动跟陈默打招呼",to:"d_meet_chen"},
    {t:"先看看门后的那张纸",to:"d_rules",set:{sawRules:true}},
    {t:"先收拾自己的东西",to:"d_meet",set:{quiet:true}},
    {t:"问苏也：第四张床到底去哪了？",to:"d_ask_bed4",san:-5}
  ]},
"d_ask_bed4":{ch:"寝室",title:"第四张床",
  text:`"第四张床……到底去哪了？"\n\n苏也的动作停住了。\n\n她没有回头，只是背对着你，慢慢地说：\n\n"没去哪。"\n\n"只是，你还没来。"\n\n"等你来了，它就在了。"\n\n你顺着她的目光看过去——靠窗那面墙，原本空着的位置，慢慢多了一张床。\n\n很旧，床头掉漆。\n\n床上没有人。\n\n但被子上，有一个凹陷。\n\n像是刚刚有人坐过。`,
  choices:[
    {t:"走过去看看",to:"d_bed4_look",san:-12},
    {t:"装作没看见，去门后看规则",to:"d_rules",san:-6,set:{sawRules:true,knows3beds:true}}
  ]},
"d_bed4_look":{ch:"寝室",title:"第四张床",
  text:`你走过去。\n\n床很干净，被子叠得方方正正。\n\n枕头底下，露出一角纸。\n\n你抽出来。\n\n是一张照片，有点发黄。\n\n照片上是四个女生，站在 403 门口，笑得很开心。\n\n你仔细看。\n\n其中三个，是苏也、李薇、陈默。\n\n第四个——\n\n是你。\n\n<span class="r">而且你穿的那件外套，是深蓝色的。</span>`,
  choices:[
    {t:"把照片放回去",to:"d_rules",san:-12,set:{sawRules:true,sawPhoto4:true}},
    {t:"把照片收起来",to:"d_rules",san:-10,set:{sawRules:true,sawPhoto4:true,hasPhoto4:true}}
  ]},
"d_meet_chen":{ch:"寝室",title:"陈默",
  text:`"你好，我叫……"\n\n"我知道你叫什么。"陈默打断你，"门上的名单我看了。"\n\n她放下手里的布鞋，抬头：\n\n"我只说一遍。"\n\n"这个寝室有七条规矩。晚上十一点前必须回来。熄灯后不要照镜子。听到敲门先看猫眼。有人叫你名字，叫一次别应，叫两次别应，叫三次必须应。"\n\n"还有——"\n\n她指了指门后那张纸。\n\n"自己看。看完记住。记不住的话，别怪我。"`,
  choices:[
    {t:"去看门后的纸",to:"d_rules",set:{sawRules:true,chenTrust:1}},
    {t:"问她：那第七条呢？",to:"d_chen_7",san:-5,set:{chenTrust:1}}
  ]},
"d_chen_7":{ch:"寝室",title:"第七条",
  text:`"第七条是什么？"你问。\n\n陈默沉默了很久。\n\n"第七条是——"\n\n苏也突然大声咳嗽起来，李薇的书"啪"地掉在地上。\n\n陈默闭上嘴，重新低下头擦鞋，好像什么都没发生。\n\n过了一会儿，她用几乎听不见的声音说：\n\n"第七条，不能说出来。"\n\n"说出来就不灵了。"`,
  choices:[{t:"去看门后的纸",to:"d_rules",set:{sawRules:true,chenTrust:2}}]},
"d_meet":{ch:"寝室",title:"三个人",
  text:`你选了个靠门的位置，把行李放下。\n\n苏也很热情，一直在讲学校的各种传闻：哪个食堂的阿姨会多给你一勺，哪个澡堂的热水要等十分钟，哪栋楼晚上会"多出一个人"。\n\n"不过你别信那些啊，"她哈哈笑，"都是学姐吓唬新生的。"\n\n李薇推了推眼镜，小声说："我信。"\n\n"去年有个学姐，在图书馆待到闭馆，第二天就没来上课。"\n\n"后来呢？"\n\n"后来……"李薇顿了一下，"后来她的名字出现在借书卡的最后一栏。借阅日期是明年。"`,
  choices:[
    {t:"问李薇：借书卡是什么？",to:"d_liwei"},
    {t:"去门后看那张纸",to:"d_rules",set:{sawRules:true}},
    {t:"先睡觉，太累了",to:"d_firstnight"},
    {t:"问苏也：你呢，你怎么会来 403？",to:"d_suye_story",san:-5}
  ]},
"d_suye_story":{ch:"寝室",title:"苏也的故事",
  text:`"我？"\n\n苏也把被子抖开，笑了笑。\n\n"我是保送的。"\n\n"体院看我成绩好，提前录了。"\n\n"不过——"\n\n她顿了顿。\n\n"我填志愿的时候，本来填的是 401。"\n\n"后来系统出错，给我调到了 403。"\n\n"我给招生办打电话，那边说：'\n\n"403 不是挺好的吗。"\n\n"我说我不想去。"\n\n"那边就沉默了。"\n\n"然后他说：'如果你不来，那你就是今年的那个。'"\n\n"我就来了。"`,
  choices:[
    {t:"不去深究，继续收拾",to:"d_liwei",san:-6,set:{suyeStory:true}},
    {t:"追问：'那个'是什么？",to:"d_suye_story2",san:-8,set:{suyeStory:true}}
  ]},
"d_suye_story2":{ch:"寝室",title:"那个",
  text:`"那个……到底是什么？"\n\n苏也把被子铺平，拍了拍枕头。\n\n"就是我之前说的那个。"\n\n"每年 10 月 14 日，学校会少一个人。"\n\n"如果我不来 403，那个人就是我。"\n\n"所以我来了。"\n\n"然后，"她转过身，看着你，"就得有人替我。"\n\n"你懂我意思吗？"`,
  choices:[
    {t:"我懂",to:"d_liwei",san:-10,set:{suyeStory:true,suyeKnows:true}},
    {t:"我不懂，也不想知道",to:"d_liwei",san:-6,set:{suyeStory:true}}
  ]},
"d_liwei":{ch:"寝室",title:"借书卡",
  text:`"图书馆的旧书，最后一页会贴一张借书卡。"李薇说，"借过的人会在上面签名。"\n\n"我上个月借了一本《临江校志》，最后一栏的签名是——"\n\n她掏出手机，翻出一张照片。\n\n照片上，借书卡的最后一行写着：\n\n<span class="r">姓名：李薇　借阅日期：2025年10月14日　归还日期：——</span>\n\n"今天是九月八号。"李薇说。\n\n"我还没借过那本书。"`,
  choices:[
    {t:"把照片删了，别想了",to:"d_rules",set:{sawRules:true,liweiCard:true}},
    {t:"问她还不还那本书",to:"d_liwei2",san:-7,set:{liweiCard:true}}
  ]},
"d_liwei2":{ch:"寝室",title:"空的",
  text:`"因为还没还。"李薇说。\n\n她把手机收起来，笑了笑，那个笑很难看。\n\n"我一直在想，如果我十月十四号那天不去图书馆，是不是就不会还了。"\n\n"可是昨天，我发现我的书包里多了一本书。"\n\n她从桌肚里抽出一本深蓝色的硬皮书，封面已经磨得看不清字。\n\n"《临江校志》，1999 年版。"\n\n"我从来没借过它。"`,
  choices:[
    {t:"让她把书扔了",to:"d_rules",set:{sawRules:true,liweiCard:true}},
    {t:"接过那本书翻一翻",to:"d_book_open",san:-10,set:{liweiCard:true,hasBook:true}}
  ]},
"d_book_open":{ch:"寝室",title:"校志",
  text:`你接过书。\n\n书很沉，比看上去要沉得多。\n\n你翻开目录页，第一条就是：\n\n<span class="r">第四节 · 四号宿舍楼 403 寝室历任住户名录（1987—）</span>\n\n你往下看。\n\n名单很长，一年一行。每一行最后都标着两个字：\n\n1987　张××　【毕业】\n1988　李××　【毕业】\n1989　王××　【毕业】\n1990　——　<span class="r">【缺】</span>\n1991　刘××　【毕业】\n\n一直翻到最后一页。\n\n2025 年的那一行，已经印好了三个名字：\n\n<span class="g">苏也　李薇　陈默</span>\n\n第四格是空白的。\n\n但空白处有一道很浅的铅笔印，像是有人先写了又擦掉。\n\n你凑近了看，勉强认出两个字的轮廓——\n\n<span class="r">是你自己的名字。</span>\n\n<span class="d">（这本书已经放进背包了，可以随时翻看。）</span>`,
  choices:[
    {t:"合上书，什么都不说",to:"d_rules",san:-12,set:{sawRules:true,hasBook:true,sealName:true}},
    {t:"问李薇：这书我能留着吗？",to:"d_rules",san:-8,set:{sawRules:true,hasBook:true}}
  ]},
"d_rules":{ch:"寝室",title:"403 寝室规则",
  text:`你凑近门后那张泛黄的纸。\n\n纸上的字是打印的，但边角有许多手写补充，字迹各不相同，显然是一届一届留下来的。\n\n<span class="r">【403 寝室规则】</span>\n\n一、每晚 23:00 前必须回到寝室。23:00 后走廊的灯会熄灭，如果你还在外面，请<b>不要</b>回头确认身后有没有人。\n\n二、22:30 熄灯后，<b>任何人不得照镜子</b>。包括手机屏幕的反光。\n\n三、如听到敲门声，先看猫眼。若猫眼外一片漆黑（即使走廊有灯），<b>不要开门</b>，也不要出声。\n\n四、若室友在半夜叫你的名字：<b>叫一次不要应，叫两次不要应，叫三次必须应</b>。\n\n五、拖鞋不要摆成"八"字，鞋尖统一朝门。\n\n六、<b>不要在寝室里说"我想回家"。</b>\n\n七、<span class="g">本条内容已被人为涂抹，无法辨认。</span>\n\n最下方，有一行用红笔写的、字迹很新的补充：\n\n<span class="r">"如果半夜醒来，发现寝室里多了一张床——请立刻闭眼装睡，直到天亮。无论听到什么。"</span>\n\n<span class="d">（规则已经抄进背包了，可以随时查看。）</span>`,
  choices:[
    {t:"用手机把规则拍下来",to:"d_rules_photo",set:{hasRules:true}},
    {t:"问苏也：第七条到底是什么？",to:"d_rules_q7",set:{hasRules:true}},
    {t:"记住，然后去睡觉",to:"d_firstnight",set:{hasRules:true}},
    {t:"仔细看第七条被涂抹的痕迹",to:"d_rules_scratch",san:-10,set:{hasRules:true}}
  ]},
"d_rules_photo":{ch:"寝室",title:"拍照",
  text:`你掏出手机，对着规则拍了一张。\n\n闪光灯亮起的一瞬间，整张纸上的字全部变成了红色，像是被血浸透。\n\n你眨了眨眼。再看时，照片里只有一张空白的墙。\n\n你回头看向门后——规则还在，字还在。\n\n但第七条那行涂抹的痕迹，似乎淡了一点。\n\n隐约能看见第一个字：\n\n<span class="r">"不"</span>`,
  choices:[
    {t:"不再深究，去睡觉",to:"d_firstnight",set:{hasRules:true}},
    {t:"伸手去抠那层涂抹",to:"d_rules_scratch",san:-10,set:{hasRules:true}}
  ]},
"d_rules_scratch":{ch:"寝室",title:"涂抹",
  text:`你的指甲刚碰到纸面，陈默的手就扣住了你的手腕。\n\n她的力气大得惊人。\n\n"别碰。"\n\n"上一届有个学姐，就是这么碰的。"\n\n"然后呢？"\n\n"然后她成了第七条。"\n\n陈默松开手，退回自己的床位。\n\n"规矩不是用来研究的，"她说，"是用来活的。"`,
  choices:[
    {t:"道歉，去睡觉",to:"d_firstnight",set:{hasRules:true,chenTrust:3}},
    {t:"追问她：第七条到底写了什么？",to:"d_chen_7",set:{hasRules:true}},
    {t:"回到门后，在第七条上补一笔",to:"d_rule_write",san:-10,set:{hasRules:true}}
  ]},
"d_rule_write":{ch:"寝室",title:"门后",
  text:`你站在门后那张泛黄的规则前。\n\n第七条被涂抹的地方，空白着。\n\n你摸了摸自己的口袋，摸出一支笔。\n\n笔尖停在纸上。\n\n你知道，如果你写下去——\n\n你就会成为这扇门的一部分。`,
  choices:[
    {t:"写下第七条",to:"e_rule",san:-30,danger:true,need:(S)=>S.flags.hasRules,lockHint:"需要先拿到寝室规则"},
    {t:"放下笔，离开",to:"d_back_dorm",san:-6}
  ]},
"d_rules_q7":{ch:"寝室",title:"问苏也",
  text:`"椰子，第七条是什么？"\n\n苏也正在铺床，动作停了一下。\n\n"我哪知道。"她笑笑，"我来的时候那行就被涂了。"\n\n"那你不好奇？"\n\n"好奇啊。"她把被子抖开，"好奇的人，都在楼下的公告栏上。"\n\n"什么公告栏？"\n\n"一楼门口那个。"苏也背对着你，"你去看看就知道了。上面贴的都是'违纪学生通报'。"\n\n"不过你注意，那些通报的日期，全是<span class="r">同一天</span>。"`,
  choices:[
    {t:"下楼去看公告栏",act:"interact",it:"noticeboard",san:-6,set:{hasRules:true,sawBoard:true}},
    {t:"不去了，先睡觉",to:"d_firstnight",set:{hasRules:true}}
  ]},
"d_run_back":{ch:"寝室",title:"回寝",
  text:`你转身就跑。\n\n楼梯很长。你跑了一层又一层，跑到腿发软，终于看见"四楼"的牌子。\n\n你冲进走廊，冲到 403 门口，推门进去，反手把门摔上。\n\n三个人都被你吓了一跳。\n\n"你干嘛去了？"苏也问。\n\n你喘着气，说不出话。\n\n陈默坐在床上，看着你，慢慢地说：\n\n"你数楼梯了吗？"\n\n你愣住了。\n\n刚才，你跑的时候……好像真的在心里数了。\n\n一、二、三、四……\n\n你数到几了？`,
  choices:[
    {t:"我数了，但我不记得数到几",to:"d_n1_count",san:-12,set:{counted:true}},
    {t:"我没数",to:"d_firstnight",set:{lied:true}}
