  ]},
"d_n1_count":{ch:"寝室",title:"数到几",
  text:`"我数了。"你说，"但我不记得数到几。"\n\n寝室里安静下来。\n\n陈默站起来，从自己枕头底下摸出一样东西，塞进你手里。\n\n是一枚铜钱，用红绳系着，边缘磨得发亮。\n\n"戴着。"她说，"睡觉也别摘。"\n\n"这能挡什么？"\n\n"挡不了什么。"陈默躺回床上，背对着你，"只是让你下次数的时候，数得慢一点。"\n\n"慢一点，就来得及停下。"\n\n<span class="d">（铜钱已经放进背包了。它可以救你一次。）</span>`,
  choices:[{t:"戴上铜钱，去睡觉",to:"d_firstnight",set:{hasCoin:true,chenTrust:3}}]},
"d_stand_still":{ch:"寝室",title:"站着",
  text:`你站住不动，屏住呼吸。\n\n脚步声越来越近，停在你身后大约三步远的地方。\n\n你能闻到一股很淡的、潮湿的霉味，像放了很久的旧书。\n\n"……你也是新生？"\n\n一个很轻的声音问。\n\n你没有回答。\n\n"你几班的？"\n\n还是没有回答。\n\n沉默了几秒，那个声音叹了口气：\n\n"别数楼梯。"\n\n脚步声远去。走廊尽头的灯重新亮起。\n\n你转过身。公告栏上，多了一张新的通报。\n\n上面写着你的名字。\n\n日期是——10 月 14 日。`,
  choices:[{t:"撕掉那张通报",to:"d_tear",san:-10},{t:"冲回寝室",to:"d_run_back2",san:-8}]},
"d_tear":{ch:"寝室",title:"撕",
  text:`你伸手去撕那张通报。\n\n纸很脆，一撕就碎。\n\n但在你撕开的地方，底下还贴着一张——一模一样的通报，一模一样的名字。\n\n再撕，还有一张。\n\n再撕，还有。\n\n你停下动作，往后退了一步。\n\n整块公告栏上密密麻麻贴满了几百张通报，每一张上面都是你的名字。\n\n你转身跑上楼。\n\n回到 403 时，你的手还在抖。\n\n陈默看了你一眼，什么都没问，只是把一枚铜钱放在你桌上。\n\n"戴着。"她说。`,
  choices:[{t:"戴上铜钱，睡觉",to:"d_firstnight",set:{hasCoin:true,chenTrust:2}}]},
"d_run_back2":{ch:"寝室",title:"回寝",
  text:`你转身冲上楼梯，一口气跑回四楼，推门进了 403。\n\n三个人都还醒着。\n\n"你脸色好差。"李薇说。\n\n你张了张嘴，最后还是没说公告栏的事。\n\n陈默从枕头底下摸出一枚铜钱，放在你桌上。\n\n"戴着。"\n\n"为什么？"\n\n"因为你在楼下站了超过十秒。"她说，"能站着回来的，都该戴着。"`,
  choices:[{t:"戴上铜钱，睡觉",to:"d_firstnight",set:{hasCoin:true,chenTrust:3}}]},
"d_firstnight":{ch:"寝室",title:"第一夜 · 23:00",
  text:`22:40，李薇关了灯。\n\n四个人各自躺下。黑暗里，能听见彼此均匀的呼吸声。\n\n你睡不着。\n\n你盯着天花板，脑子里全是手册上的规则、楼下的公告栏、还有那个空的第四张床的位置。\n\n墙上的挂钟滴答滴答地走。\n\n23:00。\n\n钟声敲响的一瞬间，走廊里的灯全灭了。你听见远处传来"啪"的一声，接着是第二声、第三声——那是整栋楼的灯，一层一层地灭下去。\n\n然后，你听见了脚步声。\n\n就在门外。\n\n<span class="r">咚。咚。咚。</span>`,
  choices:[
    {t:"装睡，什么都不做",to:"d_knock_ignore"},
    {t:"轻手轻脚下床，去看猫眼",act:"interact",it:"peephole",set:{sawRules:true}},
    {t:"直接开门",act:"interact",it:"doorway",danger:true},
    {t:"把铜钱贴在门缝上",need:(S)=>S.flags.hasCoin,lockHint:"需要陈默给的铜钱",to:"h_coin_door",san:3}
  ]},
"d_knock_ignore":{ch:"寝室",title:"装睡",
  text:`你闭上眼睛，把被子拉到下巴。\n\n敲门声持续了大约一分钟。\n\n然后停了。\n\n走廊里安静得可怕，静到你能听见自己的心跳。\n\n就在你以为结束的时候——\n\n门外传来一个女生的声音，很轻，很温柔：\n\n"同学，我的钥匙掉了，能帮我开下门吗？"\n\n"我就住隔壁 404。"\n\n那声音听起来那么正常，那么真实。你几乎要坐起来了。\n\n这时，对面床铺的陈默忽然翻了个身，用很轻很轻的声音说：\n\n"别动。"\n\n"404 是杂物间。"`,
  choices:[{t:"继续装睡",to:"d_knock_ignore2",set:{chenTrust:3}},{t:"起身开门",act:"interact",it:"doorway",danger:true}]},
"d_knock_ignore2":{ch:"寝室",title:"她走了",
  text:`你一动不动。\n\n门外安静了很久。\n\n久到你几乎要睡着了。\n\n然后你听见那个女生的声音贴着门缝，几乎是贴着你的耳朵说：\n\n"好的，那你明天再来找我。"\n\n脚步声远去。\n\n你睁开眼。黑暗中，你看见门缝底下塞进来一张纸条。\n\n第二天早上，你把纸条捡起来。上面只有一行字：\n\n<span class="r">"10 月 14 日，图书馆见。"</span>\n\n你把纸条揉成一团扔进垃圾桶。等你洗漱回来，垃圾桶里空空如也。\n\n纸条不见了。\n\n而你的枕头底下，多了一张一模一样的。\n\n<span class="d">（纸条已经放进背包了。）</span>`,
  choices:[{t:"把纸条烧掉",to:"d_n2_start",san:-8,set:{gotNote:true}},{t:"留着纸条",to:"d_n2_start",set:{gotNote:true,keepNote:true}}]},
"d_knock_peek2":{ch:"寝室",title:"退回去",
  text:`你几乎是滚回床上的，把被子蒙过头顶。\n\n门外安静了。\n\n你听着自己的心跳，一下，一下，慢慢地平复下来。\n\n过了很久，你听见陈默在黑暗里开口：\n\n"你看了猫眼？"\n\n你"嗯"了一声。\n\n"看见眼睛了？"\n\n"……看见了。"\n\n"那就好。"陈默说，"看见了，说明它只是想看看你。"\n\n"如果猫眼外面是亮着的，那才麻烦。"\n\n"为什么？"\n\n"因为那说明它已经进来了，正站在门里面看你。"`,
  choices:[{t:"不敢再睡，睁眼到天亮",to:"d_n2_start",san:-6,set:{sawEye:true}},{t:"强迫自己睡觉",to:"d_n2_start",set:{sawEye:true}}]},
"d_wake_suye":{ch:"寝室",title:"叫醒苏也",
  text:`"椰子！椰子！"\n\n你伸手去推苏也的床。被子是软的，手伸进去，摸到一个硬邦邦的东西。\n\n你缩回手。\n\n苏也不在床上。\n\n她的被子被叠得整整齐齐，枕头摆得方方正正——就像她根本没有睡过。\n\n你环顾寝室。\n\n李薇的床，被子也叠着。\n\n陈默的床……陈默坐在床上，睁着眼睛看你。\n\n"她们都出去了。"她说。\n\n"去哪儿了？"\n\n"去找门了。"\n\n"什么门？"\n\n"你敲的那扇门。"\n\n你僵硬地转过头。\n\n403 的门，不知道什么时候——打开了。\n\n门外面不是走廊。\n\n是黑的。纯粹的，什么都没有的黑。`,
  choices:[{t:"立刻去把门关上",to:"d_close_door",san:-14},{t:"站在原地，等陈默说话",to:"d_wait_chen",san:-10}]},
"d_close_door":{ch:"寝室",title:"关门",
  text:`你冲到门口，双手抓住门把手，用力往回拉。\n\n门很沉。非常沉。像是有几百斤的东西卡在门缝里。\n\n你咬着牙，一点一点把门拉回来。\n\n就在门快要合上的一瞬间，黑暗里伸出一只手，抓住了门框。\n\n是一只很白的手，指甲修剪得干干净净，指节上戴着一枚银戒指。\n\n你看见那只手的主人——深蓝色外套。\n\n她抬头看你，笑了笑。\n\n"不好意思，"她说，"我找 403。"\n\n你没有回答。你用尽全身力气，把门摔上了。\n\n"砰。"\n\n你靠在门上滑坐下来，喘着粗气。\n\n再抬头时，苏也和李薇都躺在床上，睡得很熟。\n\n被子没有叠。\n\n一切正常。\n\n只有门板上，多了一个淡淡的手印。`,
  choices:[{t:"回到床上，天亮再说",to:"d_n2_start",san:-10,set:{metBlue:true}}]},
"d_wait_chen":{ch:"寝室",title:"等",
  text:`你站在原地，没有动。\n\n陈默看了你很久，然后慢慢躺下。\n\n"聪明。"\n\n"如果你刚才去关门，你就会看见她。"\n\n"看见她会怎样？"\n\n"她会跟你打招呼。"陈默闭上眼睛，"被她打过招呼的人，都活不到期末。"\n\n门"咔哒"一声，自己关上了。\n\n寝室恢复了原样。苏也和李薇在床上睡着，呼吸均匀。\n\n你低头看自己的手——手心全是冷汗。\n\n而那枚铜钱，正在你胸口发烫。`,
  choices:[{t:"躺下，天亮再说",to:"d_n2_start",san:-5,set:{chenTrust:4}}]},
"d_slam":{ch:"寝室",title:"砰",
  text:`你用尽全力把门摔上。\n\n"砰！"\n\n门板震得你虎口发麻。\n\n你反锁，挂上链子，靠在门上大口喘气。\n\n身后，苏也被吵醒了。\n\n"你干嘛呢……"\n\n"外面有人！"你压着嗓子说。\n\n苏也揉着眼睛坐起来："谁啊？"\n\n"穿深蓝色外套的！"\n\n苏也的动作僵住了。\n\n黑暗里，李薇的声音也很轻地响起：\n\n"我们学校，没有深蓝色外套的校服。"\n\n三个人都没再说话。\n\n陈默翻了个身，说：\n\n"睡吧。明天去买把锁。"`,
  choices:[{t:"睡下，等天亮",to:"d_n2_start",san:-8,set:{metBlue:true}}]},

/* ============ 第二天 ============ */
"d_n2_start":{ch:"寝室",title:"第二天 · 清晨",
  text:`你几乎整夜没睡。\n\n闹钟响的时候，天已经蒙蒙亮。窗外有鸟叫，走廊里有拖把拖地的声音，隔壁传来洗漱的水声。\n\n一切都正常得不像话。\n\n苏也伸着懒腰坐起来："走啊，去吃早饭！"\n\n李薇已经穿好衣服，正对着镜子整理领子。\n\n镜子。\n\n你猛地想起规则第二条：<span class="r">熄灯后不得照镜子</span>。\n\n现在是早上，应该没问题。\n\n但你还是注意到，李薇照镜子的时候，镜中的她，慢了半拍才抬起头。`,
  choices:[
    {t:"提醒李薇别照镜子",to:"d_warn_liwei",set:{warned:true}},
    {t:"不说，先去洗漱",to:"d_morning"},
    {t:"检查一下自己的镜子",act:"interact",it:"mirror",san:-6},
    {t:"先去阳台看看",to:"d_balcony_morning",san:-2}
  ]},
"d_balcony_morning":{ch:"寝室",title:"阳台 · 清晨",
  text:`你走到阳台上。\n\n清晨的空气很凉，能看到整个校园。\n\n操场上有人在跑步，食堂的烟囱冒着白烟，教学楼那边很安静。\n\n一切正常。\n\n但你往下看的时候，发现楼下的花坛边，站着一个人。\n\n她背对着你，穿着深蓝色外套。\n\n她没有动。\n\n像是从昨晚开始，就一直站在那里。`,
  choices:[
    {t:"回寝室，装作没看见",to:"d_warn_liwei",san:-6,set:{sawBlueDown:true}},
    {t:"喊她一声",to:"d_call_her",san:-12,set:{sawBlueDown:true}}
  ]},
"d_call_her":{ch:"寝室",title:"喊",
  text:`你对着楼下喊了一声："喂——"\n\n楼下的人，慢慢转过身。\n\n她抬起头。\n\n脸是模糊的，但你感觉她在笑。\n\n然后她抬起手，指了指你。\n\n又指了指她自己。\n\n然后，她消失了。\n\n你回到寝室，发现镜子上的水汽，被人用手指画了一个字：\n\n<span class="r">"来"</span>`,
  choices:[{t:"擦掉镜子上的字，去吃早饭",to:"d_warn_liwei",san:-10,set:{sawBlueDown:true,called:true}}]},
"d_warn_liwei":{ch:"寝室",title:"提醒",
  text:`"李薇，规则上说……"\n\n"我知道。"李薇打断你，扶了扶眼镜，"早上没关系的。"\n\n"可是——"\n\n"昨天我梦见我站在镜子前面，"李薇说，"镜子里的我问我要不要换。"\n\n"换什么？"\n\n"换个位置。"\n\n李薇笑了一下，那个笑很累。\n\n"我没答应。"她说，"但今天早上照镜子的时候，我发现我左边的眉毛，比昨天高了一点点。"\n\n"就一点点。"`,
  choices:[
    {t:"拉她离开镜子",to:"d_morning",set:{warned:true,liweiSaved:true}},
    {t:"让她自己决定",to:"d_morning",san:-5,set:{liweiDoomed:true}}
  ]},
"d_morning":{ch:"寝室",title:"早饭",
  text:`你们三个——苏也、李薇、你——出了寝室。\n\n陈默没去。她说她不饿，蜷在床上闭着眼。\n\n下楼的时候，你特意数了一下台阶。\n\n从四楼到一楼，三段楼梯，每段十二级，一共三十六级。\n\n很正常。\n\n你松了口气。\n\n食堂在宿舍楼东边，走五分钟。路上，苏也一直在讲笑话，李薇偶尔搭一句，你笑不出来。\n\n到了食堂门口，你看见门口贴着一张通知：\n\n<span class="r">【通知】今日食堂供应：早餐 三样。午餐 三样。晚餐 三样。</span>\n\n下面有人用马克笔加了一行：\n\n<span class="g">"多出来的那一样，别拿。"</span>`,
  choices:[
    {t:"进食堂吃饭",act:"interact",it:"canteen"},
    {t:"不吃了，直接去教学楼",to:"t_enter"},
    {t:"回寝室找陈默聊聊",to:"d_chen_talk"},
    {t:"去操场走走，看那个跑步的女生",to:"m_playground"},
    {t:"去教务处，问能不能退学",to:"campus_admin",san:-6},
    {t:"去一趟校医室，拿点药",to:"d_clinic"},
    {t:"去图书馆门口转转",to:"v_first"},
    {t:"去四号楼门口看看",to:"j_first"},
    {t:"和苏也她们一起去旧教学楼",to:"s_plan"}
  ]},
"d_clinic":{ch:"校园",title:"校医室",
  text:`你推开门。\n\n校医室的灯亮着，但里面没有人。\n\n桌上放着一包干茶叶，旁边压着一张纸条：\n\n「如果觉得撑不住，就泡一杯。\n\n一包只能喝一次。\n\n——校医」\n\n你把茶叶收进了口袋。\n\n<span class="d">（静心茶已经放进背包。它会在你理智低于 29 时自动消耗。）</span>`,
  choices:[{t:"离开校医室",to:"d_morning",set:{hasTea:true}}]},
"d_chen_talk":{ch:"寝室",title:"陈默",
  text:`你折回寝室。\n\n陈默还躺在床上，背对着门，像是睡着了。\n\n你在自己床沿坐下。\n\n"陈默。"\n\n"嗯。"\n\n"你到底知道多少？"\n\n沉默了很久。\n\n"比你多。"她说，"比她们多。"\n\n"你为什么不走？"\n\n"走不了。"陈默翻过身，看着天花板，"我大一的时候，也想过退学。"\n\n"我去教务处递申请，那个老师看了我一眼，说：'你确定？'"\n\n"我说确定。"\n\n"她就把一本册子推到我面前，让我签字。"\n\n"我签了。"\n\n"然后呢？"\n\n"然后我醒来的时候，还躺在 403 的床上。"陈默说，"签到表的日期是——我入学的第一天。"`,
  choices:[
    {t:"问她：那本册子叫什么？",to:"d_chen_book",san:-8,set:{chenTrust:4}},
    {t:"不问了，去上课",to:"t_enter",set:{chenTrust:2}},
    {t:"问她：那你后悔吗？",to:"d_chen_regret",san:-6,set:{chenTrust:3}},
    {t:"问她：陈默，你到底是谁？",to:"e_chen",san:-15}
  ]},
"d_chen_regret":{ch:"寝室",title:"后悔",
  text:`"你后悔吗？"\n\n陈默看着天花板，很久。\n\n"后悔什么？"\n\n"后悔签了字。"\n\n她沉默了一会儿。\n\n"不后悔。"\n\n"因为我签了字，苏也才能活。"\n\n"李薇才能活。"\n\n"她们都是上一届的。"\n\n"她们签给了别人，然后别人又签给了别人。"\n\n"我们四个人，就像一条链子。"\n\n"每年，都要有一个人，把链子接下去。"\n\n"今年——"\n\n她转过头，看着你。\n\n"是你。"\n\n她从枕头底下摸出一个红布包，塞进你手里。\n\n"戴上。"\n\n"这是什么？"\n\n"护身符。"陈默说，"我不会用，你也许用得着。"\n\n<span class="d">（护身符已经放进背包。它会在你理智低于 29 时自动燃烧。）</span>`,
  choices:[
    {t:"沉默着离开",to:"d_morning",san:-10,set:{chenTrust:5,knowsChain:true,hasCharm:true}},
    {t:"问她：如果我不接呢？",to:"d_chen_refuse",san:-8,set:{chenTrust:5,knowsChain:true,hasCharm:true}}
  ]},
"d_chen_refuse":{ch:"寝室",title:"不接",
  text:`"如果我不接呢？"\n\n陈默看了你很久。\n\n然后她笑了。\n\n那个笑很轻，但很难看。\n\n"那你就是第一年，没有人接的那一年。"\n\n"1987 年，没有人接。"\n\n"那一年，403 的四个人，全没了。"\n\n"1990 年，有人接了。"\n\n"那一年，三个人活了下来。"\n\n她闭上眼睛。\n\n"你决定吧。"`,
  choices:[{t:"离开寝室，回到早晨",to:"d_morning",san:-10,set:{chenTrust:5,knowsChain:true,hasCharm:true}}]},
"d_chen_book":{ch:"寝室",title:"那本册子",
  text:`"那本册子叫什么名字？"\n\n陈默看着你，很久。\n\n"《临江大学 · 新生手册》。"\n\n你愣住了。你从包里掏出自己那本。\n\n封皮深红，烫金的数字——403。\n\n"我那本上面，印的是 402。"陈默说。\n\n"402 寝室，三年前就不住人了。"\n\n"因为那一年，402 的四个学生，全都没毕业。"\n\n"教务处说她们转学了。"\n\n"但我在图书馆的旧报纸上，看见过一条消息。"\n\n陈默顿了顿。\n\n"1987 年 10 月 14 日，四号宿舍楼 402 寝室，四名学生失踪。"`,
  choices:[
    {t:"问她：为什么是 10 月 14 日？",to:"d_oct14",san:-10,set:{chenTrust:5,knowsOct14:true}},
    {t:"沉默着离开，去上课",to:"t_enter",san:-6,set:{knowsOct14:true}}
  ]},
"d_oct14":{ch:"寝室",title:"10 月 14 日",
  text:`"为什么是 10 月 14 日？"\n\n陈默坐起来，从枕头底下抽出一样东西。\n\n是一张日历，撕下来的，边缘毛糙。\n\n日期：<span class="r">10 月 14 日</span>。\n\n"每年这一天，学校会少一个人。"她说，"有时候是学生，有时候是老师。"\n\n"少的那个人，会被写进《临江校志》。"\n\n"写在哪一页？"\n\n"写在第 403 页。"\n\n陈默把日历塞回枕头底下。\n\n"今天是 9 月 8 日。"她说，"你还有 36 天。"`,
  choices:[
    {t:"把这件事记在心里，去上课",to:"t_enter",set:{knowsOct14:true,chenTrust:5}},
    {t:"问她：怎么才能活下来？",to:"d_howlive",san:-8,set:{knowsOct14:true}}
  ]},
"d_howlive":{ch:"寝室",title:"怎么活",
  text:`"怎么才能活下来？"\n\n陈默沉默了很久，久到你以为她不会回答了。\n\n"三个条件。"她说。\n\n"第一，永远不要在 23:00 后出门。"\n\n"第二，找到那本 1999 年版的《临江校志》，把第 403 页撕下来。"\n\n"第三——"\n\n她停住了。\n\n"第三是什么？"\n\n"第三，你得在 10 月 14 日那天，找到一个愿意替你签字的人。"\n\n"签什么字？"\n\n"《新生手册》最后一页的空白处。"陈默说，"那一页，一直都在。"\n\n你翻开自己的手册，翻到最后一页。\n\n果然是空白的。\n\n但空白纸的正中央，有一个很浅很浅的凹痕。\n\n像是有人曾经在那里，用力写过字。`,
  choices:[{t:"合上手册，去上课",to:"t_enter",set:{knowsOct14:true,chenTrust:5,rule3:true}}]},

/* ============ 教务处 ============ */
"campus_admin":{ch:"校园",title:"教务处",
  text:`教务处在一栋很新的楼里。\n\n窗口后面坐着一位很和气的老师。\n\n"同学，办什么？"\n\n"我想退学。"\n\n她笑了。\n\n"每年都有新生来。"\n\n"填表吧。"\n\n她把一张表推到你面前。\n\n表上第一栏是：<span class="r">"姓名"</span>。\n\n你拿起笔。`,
  choices:[
    {t:"签下自己的名字",to:"e_dropout",san:-15,danger:true},
    {t:"放下笔，说再考虑一下",to:"d_back_dorm",san:-4}
  ]},

/* ============ 食堂篇 ============ */
"c_ask_aunt":{ch:"食堂",title:"阿姨",
  text:`"阿姨，"你压低声音，"为什么要数？"\n\n她的手停住了。\n\n"你听见了？"\n\n"嗯。"\n\n她左右看了一眼，然后飞快地从围裙口袋里掏出一样东西，隔着窗口塞给你。\n\n是一张折叠的餐巾纸。\n\n"别看。"她说，"回寝室再看。"\n\n"还有——今天不要吃红烧肉。"\n\n"为什么？"\n\n"因为今天不是三样。"她把帽子往下压了压，"今天，是四样。"`,
  choices:[{t:"把餐巾纸收好，端着餐盘走开",to:"c_sit",set:{hasNapkin:true}},{t:"现在就看",to:"c_read_napkin",san:-10,set:{hasNapkin:true}}]},
"c_read_napkin":{ch:"食堂",title:"餐巾纸",
  text:`你打开餐巾纸。\n\n里面用圆珠笔写了一行很小的字：\n\n<span class="r">"第四样菜，是用失踪的人做的。"</span>\n\n<span class="r">"每年 10 月 14 日，食堂会加一道菜。"</span>\n\n<span class="r">"不要吃。"</span>\n\n<span class="r">"如果你吃了，你就会变成下一年的第四样。"</span>\n\n最后还有一行，字迹不一样，明显是另一个人写的：\n\n<span class="g">"我吃了。我在 403 等你。"</span>\n\n你猛地抬头。\n\n窗口后面，那个阿姨已经不见了。\n\n取而代之的是一个穿深蓝色外套的女人。\n\n她对着你，慢慢露出一个微笑。\n\n<span class="d">（餐巾纸已经放进背包了。）</span>`,
  choices:[{t:"扔下餐盘就跑",to:"c_run",san:-12},{t:"站着不动，看着她",to:"c_stare",san:-15}]},
"c_run":{ch:"食堂",title:"跑",
  text:`你扔下餐盘，转身就跑。\n\n身后没有人追。食堂里所有人都停下筷子，抬起头，看着你。\n\n她们的脸，都是模糊的。\n\n你冲出食堂大门，扑倒在台阶上。\n\n阳光很好。梧桐叶绿得发亮。\n\n你喘着气回头。食堂里，一切正常。有人在吃饭，有人在聊天。\n\n窗口后面，是那个戴白帽子的阿姨。\n\n她隔着玻璃，对你摇了摇头。\n\n像是在说：<span class="r">别跑，会引人注意。</span>`,
  choices:[{t:"去教学楼上课",to:"t_enter",san:-8}]},
"c_stare":{ch:"食堂",title:"对视",
  text:`你没有跑。\n\n你站在原地，隔着玻璃，看着她。\n\n她笑了。\n\n然后她抬起手，指了指你胸口的位置。\n\n你低头。\n\n你胸前的铜钱，正在发烫。\n\n再抬头时，窗口后面恢复如常。白帽子的阿姨还在打菜，一切正常。\n\n只有你自己知道，刚才那一瞬间，食堂里所有的声音都消失了。\n\n包括你自己的心跳。\n\n它停了整整两秒。`,
  choices:[{t:"去教学楼",to:"t_enter",san:-12,set:{heartStopped:true}}]},
"c_redo":{ch:"食堂",title:"重新打",
  text:`"阿姨，我不要红烧肉，重新打一份。"\n\n阿姨看了你一眼。\n\n"确定？"\n\n"确定。"\n\n她把那块补上的肉夹了回去，然后重新舀了一勺。\n\n这次，只有一勺。\n\n"好孩子。"她小声说，"少一样，就少一样。"\n\n"什么？"\n\n"少一样，你就少一样麻烦。"她把餐盘推给你，"记住，今天只吃三样。以后每天都只吃三样。"\n\n你端着餐盘走开。身后，你听见她又在轻轻数：\n\n"一。二。三。"\n\n"……四。"\n\n你回头。窗口后面空无一人。`,
  choices:[{t:"找位置坐下吃饭",to:"c_sit",set:{auntieFriend:1}}]},
"c_sit":{ch:"食堂",title:"吃饭",
  text:`你找了个靠窗的位置坐下。\n\n苏也和李薇已经在那儿了。苏也正在狼吞虎咽，李薇小口小口地扒着饭。\n\n"你怎么才来？"苏也嘴里塞满了饭。\n\n"没事。"\n\n你低头吃饭。青菜有点咸，土豆丝没炒熟，红烧肉……你没要。\n\n吃到一半，你听见隔壁桌两个女生在小声说话。\n\n"你听说了吗，今年 403 又住满四个人了。"\n\n"不是说只安排三个吗？"\n\n"对啊，所以第四张床是空的。"\n\n"那……那张床是给谁的？"\n\n"给那个'名额'啊。"\n\n"什么名额？"\n\n"每年 10 月 14 日，学校要交一个人的。"女生压低了声音，"403 年年都是最后一个满的。"\n\n"因为 403 的那个人，是自己走进去的。"`,
  choices:[
    {t:"继续吃饭，装作没听见",to:"c_after"},
    {t:"起身去问那两个女生",to:"c_ask_girls",san:-8},
    {t:"放下筷子，立刻回寝室",to:"d_back_dorm"},
    {t:"去后厨看看",to:"c_kitchen",san:-10},
    {t:"夹起那块补上的红烧肉，吃掉",to:"e_canteen",san:-30,danger:true}
  ]},
"c_ask_girls":{ch:"食堂",title:"两个女生",
  text:`你端着餐盘走过去。\n\n"同学，你们刚才说的'名额'，是什么意思？"\n\n两个女生同时抬起头。\n\n她们长得一模一样。\n\n"你听错了。"左边那个说。\n\n"我们什么都没说。"右边那个说。\n\n然后她们同时低头，继续吃饭。\n\n你站在原地，愣了几秒。\n\n你注意到，她们餐盘里的菜——是四样。\n\n而她们吃饭的动作，也一模一样。\n\n每一口，都是同时送进嘴里，同时咀嚼，同时咽下。\n\n你退回到自己的座位。`,
  choices:[{t:"快点吃完，去上课",to:"c_after",san:-8}]},
"c_kitchen":{ch:"食堂",title:"后厨",
  text:`你绕过窗口，推开后厨的门。\n\n后厨很大，但没有人。\n\n灶上炖着一锅汤，咕嘟咕嘟冒着热气。\n\n你走近看。\n\n汤里浮着一些东西。\n\n不是肉。\n\n是纸。\n\n一张一张的纸片，被炖得发软。\n\n上面还能勉强看清字迹。\n\n是名字。\n\n一个接一个的名字。\n\n<span class="r">张××　李××　王××　刘××……</span>\n\n最后一张纸，刚刚浮上来。\n\n上面的字还没被炖烂。\n\n你看见那三个字，正是你自己。`,
  choices:[
    {t:"立刻离开后厨",to:"c_after",san:-14,set:{sawSoup:true}},
    {t:"把火关掉",to:"c_fire_off",san:-12,set:{sawSoup:true}},
    {t:"喝一口那锅汤",to:"e_soup",san:-30,danger:true}
  ]},
"c_fire_off":{ch:"食堂",title:"关火",
  text:`你伸手，把火拧灭。\n\n"噗。"\n\n汤不沸了。\n\n整个后厨安静下来。\n\n你回头。\n\n门口站着一个女生，穿着白裙子，头发湿漉漉的。\n\n她看着你，笑了。\n\n"你关掉了。"\n\n"上一次，是我关的。"\n\n"再上一次，是一个男生。"\n\n"再再上一次——"\n\n她顿了顿。\n\n"是我姐姐。"\n\n"我们都没能关掉。"\n\n"你是第一个关掉的。"\n\n"谢谢你。"\n\n她转身走了。\n\n地板上，留下一串湿脚印。`,
  choices:[{t:"离开后厨",to:"c_after",san:-8,set:{sawSoup:true,metWhite:true}}]},
"c_after":{ch:"食堂",title:"饭后",
  text:`你吃完饭，把餐盘放到回收处。\n\n回程的路上，苏也接了个电话，说是篮球队有事，先走了。李薇说要去图书馆查点资料。\n\n只剩你一个人。\n\n你站在食堂门口，看着校园。\n\n阳光正好，梧桐叶绿得发亮，有学生在草坪上坐着看书，有人在远处打球。\n\n一切都那么正常。\n\n正常得让你觉得，昨晚发生的一切，是不是自己的幻觉。\n\n你摸了摸胸口。\n\n铜钱还在，还是温的。`,
  choices:[
    {t:"去教学楼，看看课表",to:"t_enter"},
    {t:"去图书馆，找李薇",to:"l_enter"},
    {t:"回寝室，休息一下",to:"d_back_dorm"},
    {t:"去操场走走",to:"m_playground"},
    {t:"去老校区看看",need:(S)=>S.flags.knowsOldCampus,lockHint:"需先发现地图上的空白",to:"o_enter",san:-10}
  ]},
"d_back_dorm":{ch:"寝室",title:"回寝",
  text:`你回到 403。\n\n陈默还在。她正坐在桌前，用一支很旧的钢笔，在一张纸上写字。\n\n"你回来了。"她没抬头。\n\n"嗯。"\n\n"吃了几样？"\n\n"三样。"\n\n"好。"她放下笔，"记住，以后每天都三样。"\n\n"如果有一天你数出四样，"她抬起头看着你，"那就当天不要再吃东西。"\n\n"饿着，也比变成菜好。"`,
  choices:[
    {t:"问她纸上写的是什么",to:"d_chen_paper",san:-6},
    {t:"躺下休息一会儿",to:"d_rest"},
    {t:"去阳台透透气",to:"d_balcony_morning",san:-3}
  ]},
"d_chen_paper":{ch:"寝室",title:"纸上的字",
  text:`你凑过去看。\n\n纸上写的是一串名字，密密麻麻，至少有几十个。\n\n每个名字后面，都画了一个符号。\n\n有的画了"√"，有的画了"×"，有的画了一个圈。\n\n最后一个名字后面，什么都没画。\n\n"这是什么？"\n\n"403 住过的人。"陈默说。\n\n"√ 是毕业的，× 是失踪的，圈是——"\n\n"圈是什么？"\n\n"圈是还在的。"陈默把纸折起来，"比如我。"\n\n"那最后一个呢？"\n\n陈默看了你一眼。\n\n"最后一个，是还没有结果的。"`,
  choices:[{t:"不问了，躺下休息",to:"d_rest",san:-6,set:{chenTrust:5}},{t:"问她：我能不能看看那张纸？",to:"d_chen_paper2",san:-8}]},
"d_chen_paper2":{ch:"寝室",title:"名单",
  text:`陈默把纸递给你。\n\n你一行行往下看。名字很多，年份从 1987 一直到 2025。\n\n你注意到，1987 年那一届，四个人名后面全是"×"。\n\n1990 年那一届，只有一个人，后面是"√"，其他三个是"×"。\n\n"1990 年那个毕业的人，"你问，"是怎么毕业的？"\n\n陈默沉默了很久。\n\n"她找了个替身。"\n\n"什么？"\n\n"《新生手册》最后一页，签字。"陈默说，"只要你让别人签了字，那一年的名额就归他。"\n\n"那个替她签字的人呢？"\n\n"被写进了《临江校志》第 403 页。"\n\n"然后呢？"\n\n"然后就成了图书馆里的一本书。"陈默说，"一本没有人会借的书。"`,
  choices:[{t:"把名单还给她，躺下休息",to:"d_rest",san:-10,set:{knowsSubstitute:true}}]},
"d_rest":{ch:"寝室",title:"午睡",
  text:`你躺下，闭上眼睛。\n\n很累，但睡不着。\n\n迷迷糊糊中，你听见有人在说话。声音很远，像是从水底传来的。\n\n"……又一个。"\n\n"……第几个了？"\n\n"……第 4 个。"\n\n"……第 4 个总是最麻烦的。"\n\n"……为什么？"\n\n"……因为第 4 个，是'名额'。"\n\n你猛地睁开眼。\n\n寝室里空无一人。陈默不在了，桌上那张纸也不在了。\n\n窗外，太阳已经偏西。\n\n你看了一眼手机。下午四点。\n\n你睡了整整三个小时。\n\n但你完全不记得自己睡着过。`,
  choices:[
    {t:"起身，去找陈默",to:"d_find_chen",san:-6},
    {t:"去教学楼，看看情况",to:"t_enter"},
    {t:"去阳台看看楼下的花坛",to:"d_balcony_afternoon",san:-6}
  ]},
"d_balcony_afternoon":{ch:"寝室",title:"阳台 · 傍晚",
  text:`你走到阳台上。\n\n这一次，花坛边上没有人。\n\n但你注意到，花坛里的花，全都朝一个方向倒着。\n\n那个方向——是操场。\n\n你顺着花倒的方向看过去。\n\n操场上，有人在跑步。\n\n一圈，一圈，一圈。\n\n看起来很正常的一个人。\n\n但她的影子，是两个。`,
  choices:[
    {t:"去操场看看",to:"m_playground",san:-8},
    {t:"回寝室，不去管它",to:"d_find_chen",san:-4},
    {t:"靠在栏杆上，在这里待一整夜",to:"e_balcony",san:-15},
    {t:"去走廊尽头看看那扇不存在的门",to:"d_402",san:-10,need:(S)=>S.flags.sawPhoto4,lockHint:"需要先看到四人合影"}
  ]},
"d_402":{ch:"寝室",title:"402 门口",
  text:`你在四楼走廊里，看见了另一扇门。\n\n门牌上写着：<span class="r">402</span>。\n\n这栋楼只有 401、403、404。\n\n402 不该存在。\n\n门缝里透出很淡的光。\n\n你听见里面有人在吃饭，筷子碰到碗沿的声音，很轻，很整齐。`,
  choices:[
    {t:"敲门",to:"e_402",san:-20},
    {t:"离开，回寝室",to:"d_back_dorm",san:-6}
  ]},
"d_find_chen":{ch:"寝室",title:"找陈默",
  text:`你出了寝室，在走廊里转了一圈。\n\n四楼没有。三楼没有。二楼没有。\n\n你回到四楼的时候，看见陈默站在楼梯口，背对着你，正低头看着什么。\n\n"陈默？"\n\n她转过身。\n\n她手里拿着一枚铜钱，和你胸前那枚一模一样。\n\n"你醒了。"她说，"正好。"\n\n"你刚才去哪了？"\n\n"去楼下还东西。"\n\n"还什么？"\n\n"上一个人的铜钱。"陈默把那枚铜钱收进口袋，"她昨天晚上，把名字签在了手册上。"\n\n"所以她把铜钱还回来了。"`,
  choices:[{t:"问她：那个人是谁？",to:"d_who_signed",san:-10},{t:"不问了，去教学楼",to:"t_enter",san:-5}]},
"d_who_signed":{ch:"寝室",title:"签字的人",
  text:`"谁？"\n\n陈默看着你，很久。\n\n"你昨天在食堂，有没有看见一个女生？"\n\n"很多女生。"\n\n"穿白裙子的，坐在最角落。"\n\n你想了想。昨天在食堂，你确实看见过一个穿白裙子的女生，独自坐在角落里，面前摆着四样菜。\n\n她一直在笑。\n\n"她昨天晚上，签了。"陈默说。\n\n"签给谁？"\n\n"签给了一个穿深蓝色外套的女人。"\n\n"然后呢？"\n\n"然后她今天早上，成了图书馆的一本书。"陈默顿了顿，"一本叫《白裙》的书。"`,
  choices:[{t:"去图书馆，看看那本书",to:"l_white_dress",san:-8,set:{knowsWhite:true}},{t:"不去，去教学楼",to:"t_enter"}]},

/* ============ 教学楼篇 ============ */
"t_enter":{ch:"教学楼",title:"西侧教学楼",
  text:`下午四点，你来到教学楼。\n\n楼很旧，比宿舍楼还旧。外墙爬满了爬山虎，绿得发黑。正门上方挂着一块牌子：\n\n<span class="g">临江大学 · 西教学楼（1—12 层）</span>\n\n牌子下面，有人用粉笔写了一行小字：\n\n<span class="r">"13 楼不存在。"</span>\n\n你推门进去。\n\n大厅很空，只有一部电梯，和两侧的楼梯。\n\n电梯的楼层按钮，从 1 排到 12。\n\n最上面那个按钮的位置，有一个很淡的凹痕——像是曾经有过第 13 个按钮，后来被抹掉了。`,
  choices:[
    {t:"坐电梯上楼",act:"interact",it:"elevator"},
    {t:"走楼梯",to:"t_stairs"},
    {t:"先在大厅看看公告栏",to:"t_board"},
    {t:"去二楼的走廊看看",to:"t_floor2"}
  ]},
"t_board":{ch:"教学楼",title:"公告栏",
  text:`大厅左侧有一块公告栏。\n\n最上面贴着一张课程表，是给大一新生的：\n\n<span class="g">周一 1-2 节　高等数学　301\n周一 3-4 节　大学物理　302\n周二 1-2 节　思想道德与法治　403</span>\n\n你盯着最后一行。\n\n403。\n\n教学楼也有 403。\n\n你继续往下看。课程表最下面，有一行加粗的字：\n\n<span class="r">"本学期所有课程，均在 23:00 前结束。若你在 23:00 后仍听到下课铃，请留在原地，闭眼，默数六十下。"</span>\n\n和手册上写的一样。`,
  choices:[
    {t:"坐电梯上楼",act:"interact",it:"elevator"},
    {t:"走楼梯",to:"t_stairs"},
    {t:"去楼上看 403 教室",to:"t_403_search",san:-4}
  ]},
"t_403_search":{ch:"教学楼",title:"寻找 403",
  text:`你顺着楼梯往上走，一层一层地找。\n\n301、302、303……\n\n四楼的牌子写着 401、402、403。\n\n但 403 的门，是关着的。\n\n门上贴着一张纸，字迹很淡：\n\n<span class="r">"本节课堂点名：\n\n请以下同学到教室后门口集合。\n\n苏也\n李薇\n陈默\n（第四个名字，被撕掉了）"</span>\n\n你站在门口。\n\n门里，传来翻书声。`,
  choices:[
    {t:"推门进去",to:"t_403_room",san:-12},
    {t:"转身离开",to:"t_stairs",san:-6}
  ]},
"t_floor2":{ch:"教学楼",title:"二楼走廊",
  text:`二楼走廊很长，比三楼安静。\n\n墙上挂着历届毕业照。\n\n你走过去，一张一张看。\n\n2001 届、2005 届、2010 届……\n\n到了 2019 届那张，你停住了。\n\n照片正中间，站着四个女生。\n\n最右边那个，长得很像陈默。\n\n只是照片下面写的名字是：<span class="r">陈 未</span>。\n\n不是陈默。\n\n你继续往后看。\n\n2020 届那张，最右边又是一个很像陈默的女生。\n\n名字是：<span class="r">陈 澜</span>。\n\n2021 届，最右边是：<span class="r">陈 渔</span>。\n\n2022 届——\n\n是陈默。`,
  choices:[
    {t:"离开走廊，去别的地方",to:"t_stairs",san:-10,set:{sawPhotos:true}},
    {t:"问旁边的同学：陈未是谁？",to:"t_ask_chenwei",san:-8,set:{sawPhotos:true}}
  ]},
"t_ask_chenwei":{ch:"教学楼",title:"陈未",
  text:`你转身，走廊里正好有个女生经过。\n\n"同学，陈未是谁？"\n\n她停下来，看了你一眼。\n\n"陈未？"\n\n"没听过。"\n\n"不过这栋楼里，很多名字都带'陈'。"\n\n"陈未、陈澜、陈渔、陈默……"\n\n"有人说，她们其实都是一个人。"\n\n"只不过换了名字。"\n\n"为什么要换名字？"\n\n"因为——"\n\n她靠近你，压低了声音：\n\n"因为名字留在纸上，人就不能走。"\n\n"想走，就得换个名字。"\n\n说完，她走了。`,
  choices:[{t:"回楼梯间",to:"t_stairs",san:-8,set:{sawPhotos:true,knowsNameChange:true}}]},
"t_elev_close":{ch:"教学楼",title:"关门",
  text:`你疯狂地按关门键。\n\n门缓缓合上。就在最后一道缝隙要消失的时候，一只手伸了进来。\n\n是刚才电梯镜子里——你自己的手。\n\n你后退一步，撞在电梯壁上。\n\n门又开了。\n\n门外还是那间教室。教室里坐满了人，全都背对着门，低着头，一动不动。\n\n讲台上站着一个老师。\n\n她转过身来，看着你，笑了笑。\n\n"同学，"她说，"你迟到了。"\n\n"快找个位置坐下。"`,
  choices:[{t:"冲出去，从楼梯下楼",to:"t_elev_escape",san:-15},{t:"走进去坐下",to:"t_13f_class",san:-20},{t:"按下所有楼层按钮",to:"t_elev_all",san:-12}]},
"t_elev_all":{ch:"教学楼",title:"所有按钮",
  text:`你想起手册第二条：<span class="r">若你在电梯中看到"13"，请立刻按下所有按钮，并在最近的楼层离开。</span>\n\n你伸手，把 1 到 12 的按钮全部按了下去。\n\n电梯开始乱颤。显示屏上的数字疯狂跳动：13、12、7、2、9、13、13、13……\n\n门猛地打开。\n\n外面是 3 楼。走廊正常，灯正常，有人走过。\n\n你冲了出去。\n\n电梯门在你身后关上。\n\n你回头，看见电梯里的镜子里，还站着一个人——她还在电梯里，对着你挥手。\n\n那个人，是你自己。`,
  choices:[{t:"不去上课了，回寝室",to:"d_back_dorm",san:-12,set:{leftSelf:true}},{t:"硬着头皮去找 301 教室",to:"t_hall"}]},
"t_elev_escape":{ch:"教学楼",title:"逃生",
  text:`你从电梯里冲出来，冲进那间教室旁边的消防通道。\n\n楼梯。\n\n你往下跑。一层，两层，三层。\n\n跑到第四层的时候，你停下来。\n\n因为你看见，楼梯间的墙上写着"13"。\n\n你继续往下跑。\n\n五层、六层、七层。\n\n墙上写的是"13"。\n\n你跑了很久，跑到腿都在抖。\n\n墙上还是"13"。`,
  choices:[{t:"停下，靠着墙喘气",to:"t_stairs_stuck",san:-18},{t:"闭上眼睛，继续跑",to:"t_stairs_blind",san:-14}]},
"t_stairs_blind":{ch:"教学楼",title:"闭眼",
  text:`你闭上眼睛，扶着扶手，继续往下走。\n\n不看楼层号，不看墙。\n\n一步、两步、三步。\n\n你数着台阶。每段十二级。\n\n数到第三十六级的时候，你听见前面有人说话。\n\n"同学。"\n\n你睁开眼。\n\n是保安。她站在一楼大厅里，看着你。\n\n"你怎么从楼梯间出来的？"\n\n"我……"\n\n"楼梯间三点半就锁了。"保安说，"你怎么进去的？"\n\n你回头。楼梯间的门是关着的，上面挂着一把锈迹斑斑的锁。`,
  choices:[{t:"说自己是走错了",to:"t_hall",san:-10},{t:"问保安：这栋楼有 13 层吗？",to:"t_ask_guard",san:-8}]},
"t_ask_guard":{ch:"教学楼",title:"保安",
  text:`"师傅，这栋楼有 13 层吗？"\n\n保安看了你一眼。\n\n"没有。"\n\n"可我刚才——"\n\n"没有。"她打断你，"你记错了。"\n\n她顿了顿，又说：\n\n"丫头，我在这栋楼看了二十年门。"\n\n"每年都有学生跑来问我这个问题。"\n\n"你知道她们后来怎么样了吗？"\n\n"怎么样了？"\n\n"她们都变成了我的问题。"保安说，"因为每年 10 月 14 日之后，我就得重新记一遍这栋楼有多少层。"`,
  choices:[{t:"道谢离开，去找教室",to:"t_hall",san:-8},{t:"再问她：那你记得几个？",to:"t_guard_more",san:-6}]},
"t_guard_more":{ch:"教学楼",title:"保安 · 更多",
  text:`"你记得几个？"\n\n保安沉默了一会儿。\n\n"记不清了。"\n\n"但我记得，每年 10 月 14 日，这栋楼都会多一层。"\n\n"多出来的那一层，平时不在。"\n\n"只有那一天，才会打开。"\n\n"开给谁？"\n\n"开给一个，今年没人替代的人。"\n\n"如果我不去呢？"\n\n"那你就是去年的我。"\n\n她低下头，继续看她的报纸。\n\n你注意到，报纸的日期是——1987 年 10 月 14 日。`,
  choices:[
    {t:"去上课",to:"t_hall",san:-8,set:{knowsGuard:true}},
    {t:"问她：我可以做守夜人吗？",to:"e_guard",san:-15,set:{knowsGuard:true}}
  ]},
"t_stairs_stuck":{ch:"教学楼",title:"卡住",
  text:`你靠着墙，慢慢滑坐下来。\n\n腿已经不听使唤了。\n\n你掏出手机，想打电话。屏幕上显示：<span class="r">无服务</span>。\n\n时间：23:47。\n\n不可能。你明明是下午四点进来的。\n\n你抬起头。楼梯间的墙上，"13"那个数字，正在慢慢往下淌。\n\n不是油漆。\n\n是血。\n\n你听见楼上传来下课铃的声音。\n\n<span class="r">叮铃铃铃铃——</span>\n\n你想起手册第一条：<span class="r">若你在 23:00 后仍听到下课铃，请留在原地，闭眼，默数六十下。</span>`,
  choices:[{t:"闭眼，开始数",to:"t_count60",san:-10},{t:"捂住耳朵，往楼下冲",to:"t_charge",san:-20}]},
"t_count60":{ch:"教学楼",title:"六十下",
  text:`你闭上眼。\n\n"一。"\n\n"二。"\n\n"三。"\n\n你数得很慢。每数一下，铃声就轻一点。\n\n"……四十。"\n\n"……五十。"\n\n"……五十九。"\n\n"六十。"\n\n你睁开眼。\n\n楼梯间的灯亮着，墙上干干净净，没有"13"，也没有血。\n\n你的手机显示：下午 4 点 12 分。\n\n你只进来了十二分钟。\n\n你站起来，腿还有点软，但能走。\n\n你推开楼梯间的门，回到一楼大厅。\n\n保安看了你一眼，什么都没说。`,
  choices:[{t:"上楼去找 301 教室",to:"t_hall",set:{counted60:true}},{t:"直接离开教学楼",to:"t_leave"}]},
"t_charge":{ch:"教学楼",title:"冲",
  text:`你捂住耳朵，往楼下冲。\n\n楼梯在你脚下不断延伸，永远没有尽头。\n\n你跑了很久，跑到肺里像着了火。\n\n然后你听见一个声音，就在你耳边：\n\n"别跑了。"\n\n"你已经跑到第 13 层了。"\n\n你停下脚步。\n\n抬头。\n\n楼梯间上方，写着"13F"。\n\n你明明一直在往下跑。`,
  choices:[{t:"转身往上跑",to:"e_13f_end",san:-30},{t:"坐下来，等天亮",to:"t_wait_dawn",san:-20}]},
"t_wait_dawn":{ch:"教学楼",title:"等天亮",
  text:`你坐下来，抱着膝盖，闭上眼睛。\n\n不知道过了多久。\n\n你听见有人叫你的名字。\n\n"同学，同学？"\n\n你睁开眼。\n\n天亮了。阳光从楼梯间的窗户照进来，灰尘在光柱里飘。\n\n一个清洁工阿姨正站在你面前，手里拿着拖把。\n\n"你怎么睡在这儿啊？"\n\n你站起来，腿麻得几乎摔倒。\n\n"我……"\n\n"快去吧，"阿姨说，"上课要迟到了。"\n\n你走出楼梯间。大厅里，学生们来来往往。\n\n一切正常。\n\n只是你注意到，你的影子比别人的，淡了一点点。`,
  choices:[{t:"去上课",to:"t_hall",san:-15,set:{faded:true}}]},
"t_13f":{ch:"教学楼",title:"13 楼",
  text:`你走出了电梯。\n\n走廊很长，两边都是教室。教室门上的牌子依次是：1301、1302、1303……\n\n走廊尽头，有一间教室，门开着。\n\n你走过去，站在门口。\n\n教室里坐满了学生，全都背对着你，一动不动。\n\n黑板上写着板书：\n\n<span class="g">第 13 讲 · 如何成为别人</span>\n\n讲台上，老师转过身来。\n\n她穿着深蓝色的外套。\n\n"欢迎。"她说，"这是我们班今年的第四个学生。"\n\n"请坐。"`,
  choices:[{t:"转身就跑",to:"t_13f_run",san:-20},{t:"走进去，找个位置坐下",to:"t_13f_class",san:-25},{t:"问她：前三个是谁？",to:"t_13f_ask",san:-18}]},
"t_13f_ask":{ch:"教学楼",title:"前三个",
  text:`"前三个是谁？"\n\n老师笑了。\n\n"你自己看。"\n\n她抬手一指。\n\n教室里的学生，一个一个地转过头来。\n\n第一张脸，是苏也。\n\n第二张脸，是李薇。\n\n第三张脸，是陈默。\n\n她们三个都在笑，笑得很正常，正常到诡异。\n\n"她们昨天就来了。"老师说，"今天是她们第一天上课。"\n\n"你要不要坐她们旁边？"\n\n"那里有个空位。"`,
  choices:[{t:"转身就跑",to:"t_13f_run",san:-25},{t:"走向那个空位",to:"e_13f_end",san:-30}]},
"t_13f_run":{ch:"教学楼",title:"跑",
  text:`你转身就跑。\n\n走廊比来时更长。你跑过 1303、1302、1301……但数字不是变小的。\n\n1303、1304、1305。\n\n1306、1307、1308。\n\n数字在变大。\n\n走廊尽头，是 1313 教室。\n\n门开着。\n\n里面坐满了人。\n\n你回头，身后也是 1313。\n\n你被包围了。`,
  choices:[{t:"闭上眼睛，往一个方向冲",to:"t_13f_blind",san:-20},{t:"推门进 1313",to:"e_13f_end",san:-30}]},
"t_13f_blind":{ch:"教学楼",title:"冲",
  text:`你闭上眼，朝一个方向拼命跑。\n\n风在耳边呼啸。\n\n你听见很多声音在喊你，有苏也的、李薇的、陈默的，还有你自己的。\n\n你没有停下。\n\n不知道跑了多久，你撞上了一扇门。\n\n门开了。\n\n你摔在地上。\n\n睁开眼，你在一楼大厅。阳光从门口照进来。\n\n保安站在你旁边，低头看着你。\n\n"同学，你没事吧？"\n\n"我……没事。"\n\n"你刚才在这儿转圈转了十分钟。"保安说，"一直闭着眼睛。"`,
  choices:[{t:"道谢，离开教学楼",to:"t_leave",san:-15,set:{survived13:true}},{t:"问她：现在几点？",to:"t_ask_time",san:-10}]},
"t_ask_time":{ch:"教学楼",title:"几点",
  text:`"师傅，现在几点？"\n\n保安看了看表。\n\n"下午四点十二。"\n\n你愣了一下。\n\n你进教学楼的时候，也是四点。\n\n"怎么了？"\n\n"没什么。"\n\n你走出教学楼。\n\n外面的天，还是下午四点的天。太阳挂在西边，一寸都没动。\n\n你看着手机上的时间。\n\n16:12。\n\n16:12。\n\n16:12。\n\n秒针在走，但分钟不动。\n\n你站在教学楼门口的台阶上，站了很久。\n\n直到太阳终于动了一格。`,
  choices:[{t:"回寝室",to:"d_back_dorm",san:-12,set:{timeStuck:true}},{t:"去图书馆",to:"l_enter",san:-8}]},
"t_13f_class":{ch:"教学楼",title:"坐下",
  text:`你走进教室，在最后一排找了个空位坐下。\n\n椅子是凉的。\n\n你环顾四周，教室里大约坐了三十个人，全都低着头，看不见脸。\n\n老师开始讲课。\n\n"今天讲第一章，如何替换一个人。"\n\n"替换的关键，是名字。"\n\n"名字是唯一的锚点。只要你把别人的名字，写在自己的位置上，你就是她。"\n\n她在黑板上写下三个字。\n\n是你的名字。\n\n"这位同学，"她看向你，"请你上来，把你的名字擦掉。"\n\n"然后，写上别人的。"\n\n全班三十个人，同时抬起了头。`,
  choices:[
    {t:"站起来，冲上讲台把黑板砸了",to:"t_smash",san:-25},
    {t:"站起来，往外跑",to:"t_13f_run",san:-22},
    {t:"坐着不动",to:"e_13f_class",san:-30},
    {t:"不去反抗，安静地坐下听课",to:"e_selfstudy",san:-25,danger:true}
  ]},
"t_smash":{ch:"教学楼",title:"砸",
  text:`你冲上讲台，抓起黑板擦，用力砸向黑板。\n\n"哗啦——"\n\n黑板碎了。\n\n碎片飞溅，教室里响起一片尖叫——但那些声音不像是人发出来的，更像是纸张被撕裂。\n\n教室开始崩塌。\n\n墙皮剥落，露出后面的砖。砖缝里塞满了纸，一张一张，密密麻麻。\n\n每一张纸上，都写着一个名字。\n\n你看见了很多熟悉的名字。\n\n你甚至看见了——你自己的。\n\n天花板塌下来。\n\n你眼前一黑。`,
  choices:[{t:"……",to:"t_wake_floor",san:-15}]},
"t_wake_floor":{ch:"教学楼",title:"醒来",
  text:`你睁开眼。\n\n你躺在教学楼一楼的大厅地板上。\n\n天花板上是完好的灯。地板是干净的大理石。\n\n保安蹲在你旁边，手里拿着一瓶水。\n\n"醒了？"\n\n"我……"\n\n"你在电梯里睡着了。"保安说，"电梯卡在 4 楼和 5 楼之间，我们把你弄出来的。"\n\n"你睡了两个小时。"\n\n你坐起来，摸了摸口袋。\n\n手册还在。铜钱还在。\n\n只是封皮上烫金的"403"，变成了"404"。`,
  choices:[{t:"离开教学楼，回寝室",to:"d_back_dorm",san:-10,set:{book404:true}},{t:"问保安：我进过 13 楼吗？",to:"t_ask_guard",san:-8}]},
"t_stairs":{ch:"教学楼",title:"楼梯",
  text:`你决定走楼梯。\n\n楼梯间很窄，墙是绿色的，漆掉了一半。\n\n你开始往上走。\n\n第一段，十二级。\n\n转角。\n\n第二段，十二级。\n\n转角。\n\n第三段，十二级。\n\n转角。\n\n第四段——\n\n你停住了。\n\n从一楼到二楼，应该只有两段楼梯。\n\n你退回去，数了一遍。\n\n第一段，十二级。\n\n第二段，十二级。\n\n第三段，十二级。\n\n第四段，十二级。\n\n你抬头，楼层牌上写着"2F"。\n\n你站在四段楼梯的中间，进退不得。`,
  choices:[{t:"原路返回一楼",to:"t_back_down",san:-8},{t:"继续往上走",to:"t_up_more",san:-12},{t:"闭上眼睛，原地默数六十下",to:"t_count60b"}]},
"t_back_down":{ch:"教学楼",title:"返回",
  text:`你转身往回走。\n\n第一段，十二级。\n\n第二段，十二级。\n\n第三段，十二级。\n\n第四段，十二级。\n\n你回到了"1F"。\n\n但你记得，你上来的时候，也是四段。\n\n你站在一楼，看着楼梯间。\n\n楼梯间里，隐隐约约传来脚步声。\n\n有人正在往下走。\n\n一步，一步，很慢。\n\n你退到大厅。大厅里空无一人。`,
  choices:[{t:"坐电梯（明知道危险）",act:"interact",it:"elevator",san:-10},{t:"直接离开教学楼",to:"t_leave",set:{fledStairs:true}}]},
"t_up_more":{ch:"教学楼",title:"继续",
  text:`你继续往上走。\n\n第五段，十二级。\n\n第六段，十二级。\n\n第七段，十二级。\n\n楼层牌上的数字开始变化：2F、3F、4F、5F……\n\n你一直走到"12F"。\n\n然后是第十三段楼梯。\n\n楼梯尽头，是一扇门。\n\n门上贴着一张纸，纸上写着：\n\n<span class="r">"如果你数到了这里，说明你已经数不清了。"</span>\n\n<span class="r">"请原路返回，并且忘掉你数到的数字。"</span>\n\n<span class="r">"如果你还记得——"</span>\n\n<span class="g">"那就进来吧。"</span>`,
  choices:[{t:"原路返回",to:"t_back_down",san:-15},{t:"推开门",to:"e_13f_end",san:-30}]},
"t_count60b":{ch:"教学楼",title:"数",
  text:`你闭上眼睛，开始数。\n\n一、二、三……\n\n数到三十的时候，你听见楼梯间里有什么东西在爬。\n\n数到四十的时候，那个东西经过了你身边。\n\n数到五十的时候，你感觉到有冰凉的东西碰了碰你的手。\n\n数到六十。\n\n你睁开眼。\n\n你站在一楼大厅。楼梯间恢复了正常，两段楼梯，通向二楼。\n\n只是你的左手背上，多了一个很淡的印记。\n\n像是被谁的手指，按了一下。`,
  choices:[{t:"上楼，去找教室",to:"t_hall",san:-8,set:{marked:true}},{t:"离开教学楼",to:"t_leave"}]},
"t_elev_count":{ch:"教学楼",title:"六十下",
  text:`你站在原地，闭上眼，开始数。\n\n一、二、三……\n\n数到六十。\n\n你睁开眼。\n\n电梯门关着，显示屏上写着"3"。\n\n你按下开门键。\n\n门开了。外面是三楼走廊。灯很亮，一切正常。\n\n你走了出去。\n\n电梯门在你身后合上。\n\n你没有回头。`,
  choices:[{t:"去找 301 教室",to:"t_hall",set:{counted60:true}}]},
"t_hall":{ch:"教学楼",title:"三楼走廊",
  text:`你来到三楼。\n\n走廊很长，两侧都是教室。教室门牌从 301 一直排到 312。\n\n你注意到一件事。\n\n<span class="r">奇数号的教室，门都是开着的。偶数号的教室，门都是关着的。</span>\n\n301 开着。302 关着。\n\n303 开着。304 关着。\n\n305 开着。306 关着。\n\n你要找的教室是——`,
  choices:[
    {t:"去 301",to:"t_room301"},
    {t:"去 302",to:"t_room302",danger:true},
    {t:"先看看 302 里面",to:"t_peek302",san:-6},
    {t:"去 305 看看",to:"t_room305",san:-5}
  ]},
"t_room305":{ch:"教学楼",title:"305 教室",
  text:`你推开 305 的门。\n\n教室里坐着一个人。\n\n一个中年女人，穿着很旧的中山装，坐在讲台后面。\n\n她抬起头，看你。\n\n"你是今年的第四个？"\n\n"你怎么知道？"\n\n"因为前三个，昨天来过。"\n\n"他们在哪儿？"\n\n她抬手，指了指窗外。\n\n你顺着看过去。\n\n三只纸鹤，停在窗台上。\n\n风吹过来，其中一只，晃了一下。`,
  choices:[
    {t:"问她：纸鹤是什么？",to:"t_room305_q",san:-8},
    {t:"离开教室",to:"t_hall",san:-5}
  ]},
"t_room305_q":{ch:"教学楼",title:"纸鹤",
  text:`"那三只纸鹤，是前三个学生。"\n\n"你确定？"\n\n"确定。"她笑了笑，"每年，都会有三个学生变成纸鹤。"\n\n"然后呢？"\n\n"然后，它们就会飞走。"\n\n"飞去哪儿？"\n\n"飞去老校区的那个房间。"\n\n"那个房间里，摆着 39 只纸鹤。"\n\n"39 只，是 39 个名字。"\n\n"第 40 只——"\n\n她看着你。\n\n"就是你。"`,
  choices:[{t:"离开教室，去 301",to:"t_room301",san:-12,set:{knowsPaperCrane:true}}]},
"t_peek302":{ch:"教学楼",title:"302 的窗户",
  text:`你走到 302 门口，透过门上的小窗往里看。\n\n教室里坐着人。满满当当，一个空位都没有。\n\n但她们的头，全都朝着同一个方向——黑板。\n\n黑板上什么都没写。\n\n你就这样看了几秒。\n\n然后，最前排的一个女生，缓缓地转过头来。\n\n她看着你，嘴唇动了动。\n\n你没有听见声音，但你读出了她的口型：\n\n<span class="r">"别进来。"</span>\n\n然后她又转了回去，就像什么都没发生。`,
  choices:[{t:"去 301",to:"t_room301",set:{warned302:true}},{t:"硬着头皮推开 302 的门",to:"t_room302",danger:true}]},
"t_room302":{ch:"教学楼",title:"302 教室",
  text:`你推开了 302 的门。\n\n门轴发出"吱呀"一声。\n\n教室里，三十多个人同时转过头来。\n\n她们的脸——都是你的脸。\n\n每一个都长得一模一样。每一个都在笑。\n\n"你来了。"最前排的那个说，"我们等你好久了。"\n\n"我们就是你，你就是我们。"\n\n"坐下吧，今天是你的第一堂课。"\n\n讲台上，老师敲了敲黑板。\n\n"今天讲，如何变成一个人。"\n\n"第一步，先杀死你自己。"`,
  choices:[{t:"转身夺门而出",to:"t_escape302",san:-20},{t:"站在原地，闭上眼睛",to:"t_302_close",san:-15},{t:"坐下",to:"e_replace",san:-40,danger:true}]},
"t_escape302":{ch:"教学楼",title:"逃出 302",
  text:`你转身拉门。\n\n门把手不见了。门板上只有一片平滑的木头。\n\n你用手拍，用拳头砸，用肩膀撞。\n\n身后，脚步声越来越近。\n\n"别怕。"那些声音说，"我们只是想让你留下来。"\n\n"留下来，成为我们。"\n\n你闭上眼，用尽全力，撞向门板。\n\n"砰！"\n\n你摔在走廊的地板上。\n\n门在你身后关上了。\n\n走廊里，301 的门还开着。302 的门关得严严实实，门上什么痕迹都没有。`,
  choices:[{t:"进 301 教室",to:"t_room301",san:-15},{t:"直接下楼离开",to:"t_leave",san:-12}]},
"t_302_close":{ch:"教学楼",title:"闭眼",
  text:`你闭上眼睛，站在原地。\n\n你听见那些声音在你耳边说话，越来越近，越来越响。\n\n"睁开眼看看我们。"\n\n"看看你自己。"\n\n你没有睁眼。\n\n你开始数数。\n\n一、二、三……\n\n数到二十的时候，声音开始变远。\n\n数到四十的时候，周围一片安静。\n\n数到六十的时候，你睁开了眼。\n\n教室里空无一人。黑板上写着一行字：\n\n<span class="r">"你很聪明。"</span>\n\n<span class="r">"下次可没这么容易了。"</span>`,
  choices:[{t:"离开教室，去 301",to:"t_room301",san:-10,set:{smart:true}}]},
"t_room301":{ch:"教学楼",title:"301 教室",
  text:`301 教室里坐了不少人，都是新生。\n\n你在后排找了个位置坐下。\n\n讲台上，一个年轻女老师正在讲课。她看起来很疲惫，眼下有很重的黑眼圈。\n\n"……所以，洛必达法则的适用条件是……"\n\n很正常的高数课。\n\n你松了口气，翻开课本。\n\n这时，老师忽然停下讲课，看向窗外。\n\n窗外，天已经黑了。你记得你进来的时候，还是下午四点。\n\n她看了看表，皱了皱眉。\n\n"同学们，"她说，"今天提前下课。"\n\n"现在，请大家排好队，一个跟一个，从楼梯下楼。"\n\n"不要坐电梯。"\n\n"不要回头。"\n\n"不要数台阶。"`,
  choices:[
    {t:"跟着大家一起走",to:"t_eva_teach"},
    {t:"问老师：发生什么事了？",to:"t_ask_teacher",san:-6},
    {t:"趁乱溜去别的楼层",to:"t_sneak",san:-10},
    {t:"问老师：您是第几届的？",to:"t_ask_teacher2",san:-5}
  ]},
"t_ask_teacher2":{ch:"教学楼",title:"问届数",
  text:`"老师，您是第几届的？"\n\n她停下了整理教案的动作。\n\n"为什么问这个？"\n\n"我想知道，您还记不记得自己叫什么。"\n\n她沉默了很久。\n\n然后她笑了。\n\n"我记得。"\n\n"我叫周未。"\n\n"1998 级，403。"\n\n"我已经在这栋楼里，教了 27 年的高数。"\n\n"每一年，我都讲同样的内容。"\n\n"因为我怕——"\n\n"怕什么？"\n\n"怕有一天，我自己也忘了怎么讲。"`,
  choices:[
    {t:"跟着大家下楼",to:"t_eva_teach",set:{knowTeacher:true,knowsName:true}},
    {t:"问她：怎么才能彻底离开？",to:"t_teacher_how",san:-8,set:{knowTeacher:true,knowsName:true}}
  ]},
"t_ask_teacher":{ch:"教学楼",title:"老师",
  text:`"老师，出什么事了？"\n\n老师看了你一眼。她的眼睛很红。\n\n"你是 403 的？"\n\n你愣住了。\n\n"你怎么知道？"\n\n"因为只有 403 的人，才会问这种问题。"她苦笑了一下，"每年都问。"\n\n"老师，你也是——"\n\n"我是 1998 级的。"她说，"403，1998 年。"\n\n"那你毕业了吗？"\n\n"我毕业了。"她顿了顿，"但我的名字，还留在这栋楼里。"\n\n"每年的这一天，我都要回来上一节课。"\n\n"上完这节课，我才能再走。"\n\n她看了看表。\n\n"快走吧。还有三分钟。"`,
  choices:[
    {t:"跟着大家下楼",to:"t_eva_teach",set:{knowTeacher:true}},
    {t:"问她：怎么才能彻底离开？",to:"t_teacher_how",san:-8,set:{knowTeacher:true}}
  ]},
"t_teacher_how":{ch:"教学楼",title:"彻底离开",
  text:`"怎么才能彻底离开？"\n\n老师沉默了。\n\n"找到你的名字。"她说。\n\n"你的名字被写在这栋楼的某一处。找到它，划掉它。"\n\n"划掉之后，你就自由了。"\n\n"但是——"\n\n"但是什么？"\n\n"但是被你顶替的那个位置，会空出来。"老师说，"然后就会有下一个人，被填进去。"\n\n"就像我当年一样。"\n\n她看了看表，脸色一变。\n\n"快走！"\n\n走廊里的灯，一盏一盏地灭了。`,
  choices:[{t:"跟着大家一起冲下楼",to:"t_eva_teach",san:-10,set:{knowTeacher:true,nameIdea:true}}]},
"t_sneak":{ch:"教学楼",title:"溜走",
  text:`你趁乱溜出教室，往楼上走。\n\n你想去看看四楼。\n\n四楼走廊里，一个人都没有。灯是灭的。\n\n你摸着墙往前走。\n\n走到走廊尽头，你看见一间教室，门牌上写着：\n\n<span class="r">403</span>\n\n教学楼的 403。\n\n门虚掩着。里面透出很微弱的光。`,
  choices:[{t:"推门进去",to:"t_403_room",san:-12},{t:"转身下楼",to:"t_eva_teach",san:-6}]},
"t_403_room":{ch:"教学楼",title:"教学楼 403",
  text:`你推门进去。\n\n教室里只有一张桌子，桌上放着一本很旧的书。\n\n书的封面是深蓝色的，磨得看不清字。\n\n你走过去，翻开。\n\n扉页上写着一行字：\n\n<span class="r">《临江校志》1999 年版</span>\n\n你翻到第 403 页。\n\n第 403 页上，密密麻麻写满了名字。你一眼就看见了陈默的名字，还有苏也、李薇。\n\n你自己的名字也在上面。\n\n但你的名字后面，是空白的。\n\n而别人的名字后面，都写着两个字：\n\n<span class="r">【已签】</span>\n\n书页的右下角，有一行很小的字：\n\n<span class="g">"未签者，即为名额。"</span>`,
  choices:[{t:"把这一页撕下来",to:"t_tear403",san:-12,set:{hasPage:true}},{t:"合上书，立刻离开",to:"t_eva_teach",san:-8,set:{saw403page:true}}]},
"t_tear403":{ch:"教学楼",title:"撕页",
  text:`你抓住第 403 页，用力一撕。\n\n纸很韧，撕得很慢。\n\n撕到一半，你听见一个声音，从书里传出来：\n\n"你确定吗？"\n\n"撕掉这一页，上面所有的名字，都会消失。"\n\n"包括你室友的。"\n\n"包括你的。"\n\n你停住了手。\n\n"你还有三秒钟。"那个声音说。\n\n"三。"\n\n"二。"`,
  choices:[{t:"继续撕下去",to:"t_tear_done",san:-15,set:{hasPage:true,torePage:true}},{t:"松手，把书合上",to:"t_eva_teach",san:-6,set:{saw403page:true}}]},
"t_tear_done":{ch:"教学楼",title:"撕下",
  text:`你撕下了那一页。\n\n教室里所有的光瞬间熄灭。\n\n黑暗中，你听见无数人在叹气。\n\n然后，你听见有人鼓掌。\n\n"很好。"那个声音说，"你做出了选择。"\n\n"现在，你手里拿着的，是这一年的名额。"\n\n"你可以留着它。"\n\n"也可以，把它交给别人。"\n\n你低头看手里的纸。\n\n第 403 页上，所有的名字都在慢慢褪色。\n\n只剩下你自己的名字，还清清楚楚。\n\n纸的边缘，有一行小字：\n\n<span class="g">"在空白处签名，即可转让。"</span>`,
  choices:[{t:"把纸收起来，下楼",to:"t_eva_teach",set:{hasPage:true,hasQuota:true}},{t:"当场把自己的名字划掉",to:"t_cross_name",san:-15,set:{hasPage:true,hasQuota:true}}]},
"t_cross_name":{ch:"教学楼",title:"划掉",
  text:`你掏出笔，把自己的名字用力划掉。\n\n一道，两道，三道。\n\n纸在你手里燃烧起来，蓝色的火，没有温度。\n\n火光中，你看见了很多画面。\n\n你看见 1987 年的四个学生，站在这间教室里。\n\n你看见 1990 年那个毕业的人，把一个女生的名字写在自己的位置上。\n\n你看见陈默坐在 403 的床上，低头擦着一双旧布鞋。\n\n你看见——你自己，在 10 月 14 日的夜里，站在 403 门口。\n\n火灭了。\n\n纸不见了。\n\n教室里空荡荡的，只有你一个人。\n\n窗外，天亮了。`,
  choices:[
    {t:"下楼",to:"t_dawn",san:5},
    {t:"直接去校门口，等到 10 月 14 日",to:"t_final",san:-8}
  ]},
"t_dawn":{ch:"教学楼",title:"天亮",
  text:`你走出教学楼。\n\n天是灰白色的，像是刚下过雨。空气里有股泥土的味道。\n\n校园里一个人都没有。\n\n你回到宿舍楼，上了四楼，推开 403 的门。\n\n三张床。三个人还在睡。\n\n你走到自己床边，坐下。\n\n枕头底下，有一本深红色的册子。\n\n你翻开最后一页。\n\n空白。\n\n但在纸的中央，那个浅浅的凹痕，变得深了一点。\n\n像是有人已经写过，又擦掉了。`,
  choices:[
    {t:"把手册收好，躺下睡觉",to:"e_dawn_mid",set:{freed:true}},
    {t:"起身，去门后把那张规则撕下来",to:"e_dawn",san:-5,
      need:(S)=>S.flags.hasRules,lockHint:"需要先拿到寝室规则"},
    {t:"把手册扔进垃圾桶，彻底忘掉这一切",to:"e_loop",san:5},
    {t:"什么都不做，正常过完这一年",to:"e_safe",san:5},
    {t:"留在学校，做两届之间的桥",to:"e_bridge",san:-6,need:(S)=>S.flags.sawNameList || S.flags.sawOld403,lockHint:"需要知道往届名单"},
    {t:"带着日记和学生证，去校门口做最后的了断",to:"t_choice",san:-8,
      need:(S)=>S.flags.hasDiary || S.flags.hasJinmoCard,
      lockHint:"需要温瑶的日记或季默的学生证"}
  ]},
"t_eva_teach":{ch:"教学楼",title:"撤离",
  text:`你跟着队伍下楼。\n\n楼梯间里挤满了人，但没有人说话。所有人都低着头，一个跟一个。\n\n你数了数前面的人。十个。二十个。三十个。\n\n走到二楼的时候，你听见前面有人在小声数：\n\n"一、二、三、四……"\n\n你想起手册上的话：<span class="r">不要在晚上数楼梯。</span>\n\n你想开口提醒，但喉咙发紧。\n\n队伍继续往下走。\n\n走到一楼的时候，你发现前面的人少了一半。\n\n没有人注意到。`,
  choices:[{t:"装作没看见，走出教学楼",to:"t_leave",san:-10},{t:"大声提醒前面的人别数",to:"t_shout",san:-12}]},
"t_shout":{ch:"教学楼",title:"喊",
  text:`"别数了！"\n\n你的声音在楼梯间里回荡。\n\n所有人都停下了脚步。\n\n然后，所有人同时转过头来，看着你。\n\n她们的脸，都是模糊的。\n\n只有一个人是清楚的。\n\n站在队伍最前面，穿着深蓝色外套，正对着你笑。\n\n"谢谢。"她说。\n\n"谢谢你把她们叫停。"\n\n"我本来还在想，怎么才能留住她们。"\n\n你退后一步。\n\n楼梯间的门在你身后，关上了。`,
  choices:[{t:"闭上眼睛，撞向门",to:"t_break_door",san:-15},{t:"站着不动",to:"e_blue",san:-35,danger:true}]},
"t_break_door":{ch:"教学楼",title:"撞",
  text:`你闭上眼，用尽全身力气撞向门。\n\n"砰！"\n\n门开了。你滚了出去，摔在一楼大厅的地板上。\n\n你爬起来，跑出教学楼。\n\n外面的夜风很凉。你大口喘着气。\n\n回头看去，教学楼里一片漆黑。只有一楼的窗户亮着灯。\n\n窗边站着一个人。\n\n她穿着深蓝色的外套，对你挥了挥手。\n\n然后拉上了窗帘。`,
  choices:[{t:"跑回寝室",to:"d_back_dorm",san:-15,set:{metBlue:true}}]},
"t_leave":{ch:"教学楼",title:"离开",
  text:`你走出教学楼。\n\n天已经完全黑了。路灯一盏盏亮起来，把梧桐叶照成暗黄色。\n\n校园里还有零星的人，三三两两。\n\n你看了一眼手机。22:47。\n\n你出来得还算及时。\n\n你加快脚步，往宿舍楼走。\n\n走到一半，你听见身后传来下课铃的声音。\n\n<span class="r">叮铃铃铃铃——</span>\n\n你回头。\n\n教学楼所有的窗户，同时亮了。\n\n每一扇窗户里，都站满了人。\n\n她们都在往下看。\n\n看着你。`,
  choices:[{t:"立刻闭眼，默数六十下",to:"t_bell_count",san:-8},{t:"跑起来，冲回寝室",to:"t_bell_run",san:-12}]},
"t_bell_count":{ch:"教学楼",title:"六十下",
  text:`你闭上眼，站在原地，开始数。\n\n一、二、三……\n\n周围很安静。你能听见自己的呼吸。\n\n数到四十的时候，你听见有人从你身边经过。脚步很轻。\n\n数到五十的时候，你听见有人在你耳边说了一句：\n\n"你数得真慢。"\n\n数到六十。\n\n你睁开眼。\n\n教学楼黑了。窗边没有人。\n\n你继续往宿舍走。\n\n路上，你摸了摸口袋。手册还在。\n\n但你的手背上，刚才那个淡淡的印记，深了一点。`,
  choices:[{t:"回寝室",to:"d_back_dorm",san:-8,set:{marked:true}}]},
"t_bell_run":{ch:"教学楼",title:"跑",
  text:`你转身就跑。\n\n梧桐道上，路灯一盏一盏地在你身后熄灭。\n\n你跑过三号宿舍楼的楼牌。\n\n又跑过三号宿舍楼的楼牌。\n\n又跑过三号宿舍楼的楼牌。\n\n你停下来。\n\n前面还有一块楼牌，写着"三号宿舍楼"。\n\n你深吸一口气，转过身。\n\n身后，也有一块楼牌，写着"三号宿舍楼"。\n\n铃声还在响。\n\n你站在原地，听着铃声，一遍，一遍，一遍。\n\n然后铃声停了。\n\n你面前的路，出现了分岔。\n\n左边通向一栋亮着灯的楼，右边是漆黑一片。`,
  choices:[{t:"走向左边亮灯的楼",to:"d_back_dorm",san:-10},{t:"走向右边的黑暗",to:"e_dark",san:-25,danger:true}]},

/* ============ 终章 ============ */
"t_final":{ch:"终章",title:"10 月 14 日 · 校门口",
  text:`10 月 14 日，晚上 23:00。\n\n你站在校门口。\n\n风很大。牌匾上的字，红得像要滴下来。\n\n你手里有一张纸——第 403 页。\n\n纸上的名字，已经褪得只剩你自己的了。\n\n你可以把它交出去。\n\n也可以，撕掉它。\n\n<span class="d">（你感觉理智正在快速流失。快做出选择。）</span>`,
  choices:[
    {t:"撕掉第 403 页，作废名额",to:"e_grad",san:-10,need:(S)=>S.flags.torePage,lockHint:"需要已撕下第 403 页"},
    {t:"念出所有 39 个名字",to:"e_remember_all",san:-8,need:(S)=>S.flags.rememberXiaoMan && S.flags.savedXiaoMan,lockHint:"需要记住小满"},
    {t:"把第 403 页交给别人",to:"e_blue",san:-30,danger:true},
    {t:"先划掉名字，再作废名额，最后念出所有名字",to:"e_true",san:-5,
      need:(S)=>S.flags.torePage && S.flags.rememberXiaoMan && S.flags.savedXiaoMan && S.flags.liweiAlive,
      lockHint:"需要：撕下第 403 页 + 记住小满 + 李薇存活"}
  ]},

/* ============ 图书馆篇 ============ */
"l_enter":{ch:"图书馆",title:"图书馆",
  text:`图书馆在校园正中，是一栋很老的三层建筑，红砖墙，拱形窗。\n\n门口立着一块石碑，上面刻着：\n\n<span class="g">"临江大学图书馆 · 建于 1901 年"</span>\n\n石碑下面，有人用刀刻了一行小字：\n\n<span class="r">"不要借第 403 页有名字的书。"</span>\n\n你推门进去。\n\n里面很安静，只有翻书的声音。空气中有股旧纸和灰尘的味道。\n\n前台坐着一个老太太，戴着老花镜，正在整理一摞卡片。\n\n她抬起头，看了你一眼。\n\n"新生？"\n\n"是。"\n\n"手册带来了吗？"\n\n"带了。"\n\n"给我看看。"\n\n你把手册递过去。她翻开封皮，看到那个烫金的"403"，手顿了一下。\n\n然后她在卡片盒里翻找了一会儿，抽出一张卡片，递给你。\n\n"拿着。这是你的借书卡。"\n\n卡片上印着你的名字。\n\n以及一栏：\n\n<span class="r">借阅上限：0 本</span>`,
  choices:[
    {t:"问她：为什么是 0 本？",to:"l_ask_card",san:-6},
    {t:"收下卡片，去书架看看",to:"l_shelf"},
    {t:"问她：李薇在哪儿？",to:"l_ask_liwei"},
    {t:"对老太太说：「我在找第 403 页。」",need:(S)=>S.flags.hasBook,lockHint:"需先获得《临江校志》",to:"h_lib_truth",san:-5}
  ]},
"l_ask_card":{ch:"图书馆",title:"0 本",
  text:`"为什么是 0 本？"\n\n老太太推了推眼镜。\n\n"因为你的名字还没有落定。"\n\n"什么意思？"\n\n"图书馆的书，每一本都有借书卡。"她说，"借书卡上签名的人，名字就会被记住。"\n\n"名字被记住的人，才能借书。"\n\n"而你的名字——"\n\n她从抽屉里抽出一张纸，摊开。\n\n是一张借书卡，最后一栏空白。\n\n"你的名字，还没有写上去。"\n\n"等你写上去的那天，你就可以借书了。"\n\n"但是——"\n\n她把纸收回去。\n\n"那一天，你也就成了图书馆的书。"`,
  choices:[{t:"去书架看看",to:"l_shelf",san:-8},{t:"问她：怎么才能避免？",to:"l_ask_avoid",san:-6}]},
"l_ask_avoid":{ch:"图书馆",title:"避免",
  text:`"怎么才能避免？"\n\n老太太笑了。她的牙齿很黄。\n\n"很简单。"\n\n"永远不要在这栋楼里，写下你的名字。"\n\n"一个字都不要。"\n\n"包括——"\n\n她指了指你手里的《新生手册》。\n\n"包括那本书的最后一页。"\n\n"那本书，本来就是借书卡。"`,
  choices:[{t:"把手册收好，去书架",to:"l_shelf",san:-6,set:{knowManual:true}}]},
"l_ask_liwei":{ch:"图书馆",title:"找李薇",
  text:`"李薇？中文系那个戴眼镜的？"\n\n"对。"\n\n老太太想了想。\n\n"她刚才来过。"\n\n"现在呢？"\n\n"现在在二楼，中文图书区。"老太太顿了顿，"不过你最好别上去。"\n\n"为什么？"\n\n"因为二楼的中文图书区，正在装修。"\n\n"装修？"\n\n"对。"老太太说，"装修了三年了。"\n\n"那李薇上去干什么？"\n\n"她说，她去找一本 1999 年版的《临江校志》。"`,
  choices:[{t:"冲上二楼",to:"l_second",san:-8},{t:"先去书架看看",to:"l_shelf"}]},
"l_second":{ch:"图书馆",title:"二楼",
  text:`你沿着木楼梯上到二楼。\n\n二楼果然在"装修"。走廊两侧堆满了脚手架和油漆桶，但没有人施工。\n\n中文图书区的门开着。\n\n里面很黑。\n\n你摸索着走进去，喊了一声："李薇？"\n\n没有人回答。\n\n你打开手机手电筒，照了一圈。\n\n书架一排排立着，上面全是灰。\n\n地上，有一副眼镜。\n\n你认得那副眼镜——李薇的。\n\n你捡起来，镜片上有一道裂痕。\n\n镜框内侧，刻着两个字：\n\n<span class="r">"已借"</span>`,
  choices:[{t:"继续往里面找",to:"l_second_deep",san:-10},{t:"拿着眼镜下楼",to:"l_down_stairs",san:-8}]},
"l_second_deep":{ch:"图书馆",title:"深处",
  text:`你继续往里走。\n\n书架上，书的排列开始变得奇怪。\n\n第一排：《临江校志》《临江校志》《临江校志》……\n\n第二排：《临江校志》《临江校志》《临江校志》……\n\n整整一排，全是同一本书。\n\n你抽出其中一本。\n\n深蓝色的封面，磨得看不清字。\n\n你翻开扉页：1999 年版。\n\n你翻到第 403 页。\n\n上面密密麻麻全是名字。\n\n你一行行找。\n\n在最后一栏，你看见了：\n\n<span class="r">李薇　借阅日期：2025 年 10 月 14 日</span>\n\n<span class="r">归还日期：——</span>\n\n而在他下面，还有一行新写的：\n\n<span class="g">你　借阅日期：2025 年 10 月 14 日</span>\n\n<span class="g">归还日期：——</span>\n\n你猛地合上书。\n\n书架深处，传来"沙沙"的翻书声。`,
  choices:[{t:"把书放回去，立刻离开",to:"l_down_stairs",san:-12},{t:"把这一页撕下来",to:"l_tear",san:-15},{t:"顺着声音走进去",to:"l_deep",san:-18}]},
"l_tear":{ch:"图书馆",title:"撕书",
  text:`你抓住第 403 页，用力一撕。\n\n书页撕开的声音，在寂静的图书馆里格外刺耳。\n\n然后，整排书架开始震动。\n\n一本、两本、十本、一百本——《临江校志》从书架上掉下来，砸在地上，摊开，全都停在第 403 页。\n\n每一页上都有名字。\n\n每一页上都有你的名字。\n\n你手里那张纸，开始变烫。\n\n你松开手，纸飘落在地。\n\n落地的一瞬间，它变成了一张借书卡。\n\n卡片上，只有一个名字。\n\n是你的。`,
  choices:[{t:"捡起卡片，跑下楼",to:"l_down_stairs",san:-15,set:{hasCard:true}},{t:"踩碎这张卡片",to:"l_stomp",san:-12,set:{hasCard:true}}]},
"l_stomp":{ch:"图书馆",title:"踩",
  text:`你抬起脚，用力踩下去。\n\n卡片碎了。\n\n碎片像灰一样飘起来，在空中转了一圈，然后重新聚拢。\n\n聚成一张新的卡片。\n\n还是那张卡，还是那个名字。\n\n只是卡片角落，多了一行小字：\n\n<span class="r">"每踩一次，借阅上限 +1"</span>\n\n你低头看。\n\n借阅上限：1 本。\n\n你愣了两秒，然后转身就跑。`,
  choices:[{t:"冲下楼梯",to:"l_down_stairs",san:-12,set:{limit1:true}}]},
"l_deep":{ch:"图书馆",title:"深处的声音",
  text:`你顺着翻书声往里走。\n\n书架越来越密，光线越来越暗。\n\n最后，在一排书架后面，你看见了李薇。\n\n她背对着你，蹲在地上，面前摊着一本书。\n\n"李薇？"\n\n她没有回头。\n\n"你来得正好。"她说，"帮我看看，这一页是不是第 403 页。"\n\n你走过去，低头看。\n\n她面前那本书，是摊开的。左页是 402，右页是——\n\n空白。\n\n"404 页不见了。"李薇说。\n\n"什么意思？"\n\n"这本书一共 403 页。"李薇抬起头，看着你，笑了，"所以最后一页，是 403。"\n\n"但你刚才说，左页是 402。"\n\n"对啊。"李薇说，"那右页就是 403。"\n\n"可它是空白的。"\n\n"不是空白。"李薇把书举起来，对着灯光，"你仔细看。"\n\n灯光透过纸背。\n\n纸上，有字。\n\n很浅很浅的字，像是写完之后被人擦掉，只留下一点凹痕。\n\n你凑近了看。\n\n那两个字是——<span class="r">你的名字。</span>`,
  choices:[{t:"把书合上",to:"l_close_book",san:-15},{t:"问李薇：你在干什么？",to:"l_ask_liwei2",san:-10}]},
"l_ask_liwei2":{ch:"图书馆",title:"李薇的回答",
  text:`"你在干什么？"\n\n李薇低着头，继续看那本书。\n\n"我在找我的名字。"\n\n"找到了吗？"\n\n"找到了。"她指了指左页，"402 页，倒数第三行。"\n\n你低头看。\n\n402 页上确实有一行名字：李薇。\n\n后面写着：<span class="r">【已签】</span>。\n\n"你签了什么？"你问。\n\n"我签了转让协议。"李薇说。\n\n"什么？"\n\n"我把我的名字，转让给了 403 页的那个人。"她抬起头，笑了笑，"这样我就安全了。"\n\n"那 403 页的人呢？"\n\n"403 页的人——"\n\n李薇指了指书。\n\n"就是你啊。"`,
  choices:[{t:"把书抢过来撕了",to:"l_grab",san:-18},{t:"后退，离开这里",to:"l_down_stairs",san:-15}]},
"l_grab":{ch:"图书馆",title:"抢",
  text:`你一把抢过那本书。\n\n书很轻，轻得不像有 403 页。\n\n你翻到 403 页。\n\n空白。\n\n你把书举起来，对着灯光。\n\n纸上有凹痕。\n\n你用手指去摸，摸到了两个字的轮廓。\n\n你没有看清，但你不用看清。\n\n你知道那是你的名字。\n\n你把书用力摔在地上，用脚踩。\n\n"啪嗒。"\n\n书散了。\n\n散成了一地的纸页。\n\n每一页都是空白。\n\n只有一张，慢慢飘到你脚边。\n\n那张纸上，写着：\n\n<span class="r">"谢谢。"</span>`,
  choices:[{t:"捡起那张纸",to:"l_pick",san:-12},{t:"不管它，跑下楼",to:"l_down_stairs",san:-10}]},
"l_pick":{ch:"图书馆",title:"那张纸",
  text:`你弯腰捡起那张纸。\n\n纸很薄，很凉。\n\n你把它翻过来。\n\n背面写着一行小字：\n\n<span class="g">"你可以留着它。"</span>\n\n<span class="g">"在 10 月 14 日之前，把它交给任何一个人。"</span>\n\n<span class="g">"那个人就会代替你。"</span>\n\n你把纸折起来，塞进口袋。\n\n口袋里的《新生手册》，忽然变得很重。\n\n你低头看。\n\n手册的封皮上，那个烫金的"403"，正在慢慢变红。`,
  choices:[{t:"快步下楼离开",to:"l_down_stairs",san:-12,set:{hasTransfer:true}}]},
"l_close_book":{ch:"图书馆",title:"合上",
  text:`你伸手，把书合上了。\n\n"啪。"\n\n李薇抬起头，看着你。\n\n"你干什么？"\n\n"别看了。"\n\n"我快找到了。"她伸手要抢。\n\n你按住书。\n\n"李薇，你听我说。"\n\n"你已经在 402 页上了。"\n\n"你已经签过字了。"\n\n李薇愣住了。\n\n她慢慢松开手，坐到地上，摘下眼镜，用袖子擦了擦。\n\n"我知道。"她说。\n\n"我早就知道了。"\n\n"我只是想看看，我到底变成了哪一本书。"`,
  choices:[{t:"拉她起来，一起下楼",to:"l_leave_together",san:-8},{t:"自己下楼",to:"l_down_stairs",san:-10}]},
"l_leave_together":{ch:"图书馆",title:"一起",
  text:`你把李薇拉起来。\n\n她很轻。比看上去轻很多。\n\n你们一起走下楼梯。\n\n到了一楼，前台的灯还亮着。老太太还在整理卡片。\n\n"找到了？"她问。\n\n"找到了。"李薇说。\n\n"那还回去吗？"\n\n李薇沉默了很久。\n\n"还。"她说。\n\n老太太点点头，从盒子里抽出一张卡片，递给李薇。\n\n卡片上印着"李薇"两个字。\n\n借阅上限：0。\n\n李薇接过卡片，把它撕成两半，放在柜台上。\n\n"我不借了。"她说。\n\n老太太看着那两半卡片，叹了口气。\n\n"行吧。"她说，"那我就记一下。"\n\n她拿起笔，在一本厚厚的册子上写了一行。\n\n你瞥了一眼。\n\n册子的最后一栏，写着：\n\n<span class="r">2025 年 10 月 14 日　李薇　【未还】</span>`,
  choices:[
    {t:"拉着李薇离开图书馆",to:"l_out",san:-8,set:{liweiAlive:true}},
    {t:"把撕碎的借书卡捡起来，交给老太太",to:"e_liwei_alive",san:-6,set:{liweiAlive:true}}
  ]},
"l_down_stairs":{ch:"图书馆",title:"下楼",
  text:`你转身下楼。\n\n楼梯很窄，你走得很快。\n\n走到一半，你听见身后有翻书声，跟在你身后，越来越近。\n\n你没有回头。\n\n到了一楼，前台的老太太还在。\n\n"找到你要的书了吗？"\n\n"没有。"\n\n"那就好。"她说，"没找到，就是最好的结果。"\n\n她递给你一张卡片。\n\n是你刚进门时那张，借阅上限：0。\n\n"拿好。"她说，"别丢。"\n\n"丢了会怎么样？"\n\n"丢了，你就要留在这里，当一本书。"`,
  choices:[{t:"收好卡片，离开图书馆",to:"l_out",san:-6,set:{hasCard:true}}]},
"l_out":{ch:"图书馆",title:"出门",
  text:`你走出图书馆。\n\n天已经黑了。路灯亮起来。\n\n你站在台阶上，回头看了一眼。\n\n图书馆的二楼，窗户里透出微弱的光。\n\n窗帘后面，有一个人的轮廓。\n\n她正站在窗边，低着头，看书。\n\n你想起老太太的话：<span class="r">图书馆闭馆时间是 22:00。若 22:00 后馆内仍亮着灯，那不是图书馆。</span>\n\n你加快脚步，往回走。`,
  choices:[
    {t:"回寝室",to:"d_back_dorm"},
    {t:"去食堂吃点东西",act:"interact",it:"canteen"},
    {t:"去操场走走",to:"m_playground"},
    {t:"去湖边坐一会儿",to:"w_enter",san:-4}
  ]},
"l_shelf":{ch:"图书馆",title:"书架",
  text:`你在书架间穿行。\n\n大部分书都蒙着灰，很久没人动过。\n\n走到文学区的时候，你看见一本白色的书，夹在两本厚书之间，露出一个角。\n\n书脊上写着两个字：\n\n<span class="r">《白裙》</span>`,
  choices:[{t:"抽出这本书",to:"l_white_dress",san:-6},{t:"不看，直接离开",to:"l_out"},{t:"继续往深处走",to:"l_shelf_deep",san:-6}]},
"l_shelf_deep":{ch:"图书馆",title:"书架 · 深处",
  text:`你继续往里走。\n\n书架越来越密，光线越来越暗。\n\n最后一排书架后面，有一个小隔间。\n\n隔间里，放着一张小桌子，一把椅子。\n\n桌上放着一本登记簿。\n\n你翻开。\n\n是"借阅登记"。\n\n第一页，第一行，写着：\n\n<span class="r">1949 年 10 月 14 日　无名　《临江校志》</span>\n\n最后一页，最后一行，写着：\n\n<span class="g">2025 年 10 月 14 日　（空）</span>`,
  choices:[
    {t:"把登记簿放回去，离开",to:"l_out",san:-10,set:{sawRegister:true}},
    {t:"在空白处，写下自己的名字",to:"l_write_register",san:-25,danger:true}
  ]},
"l_write_register":{ch:"图书馆",title:"写下名字",
  text:`你掏出笔，在空白处写下自己的名字。\n\n笔尖刚离开纸面，登记簿就猛地合上了。\n\n"啪。"\n\n然后，从书架深处，传来一个很轻的声音：\n\n"欢迎。"\n\n"你是第 40 个。"\n\n你愣住。\n\n你回头。\n\n书架尽头，站着一个人。\n\n她穿着深蓝色外套。\n\n她对你笑了笑。\n\n"跟我来吧。"\n\n"你该上课了。"`,
  choices:[{t:"跟她走",to:"e_lib",san:-30,danger:true}]},
"l_white_dress":{ch:"图书馆",title:"《白裙》",
  text:`你抽出那本书。\n\n书名就叫《白裙》。封面是白色的，没有作者，没有出版社。\n\n你翻开。\n\n第一页写着：\n\n<span class="r">"2025 年 9 月 8 日，我坐在食堂最角落。"</span>\n\n<span class="r">"我的面前有四样菜。"</span>\n\n<span class="r">"我知道我不该吃，但我还是吃了。"</span>\n\n<span class="r">"因为我太饿了。"</span>\n\n你继续往下翻。\n\n第二页：\n\n<span class="r">"9 月 9 日，我发现我的裙子变白了。"</span>\n\n<span class="r">"9 月 10 日，我发现没有人能看清我的脸。"</span>\n\n<span class="r">"9 月 11 日，我坐在图书馆里，发现自己变成了一本书。"</span>\n\n最后一页：\n\n<span class="r">"如果你在读这本书，说明你已经看见我了。"</span>\n\n<span class="r">"请你记住我的名字。"</span>\n\n<span class="r">"我的名字是——"</span>\n\n后面的字，被撕掉了。`,
  choices:[
    {t:"把书合上，放回书架",to:"l_out",san:-10},
    {t:"在空白处写下自己的名字",to:"l_write_name",san:-20,danger:true},
    {t:"去食堂找那个白裙子女生",act:"interact",it:"canteen",san:-6}
  ]},
"l_write_name":{ch:"图书馆",title:"写下名字",
  text:`你掏出笔，在空白处写下自己的名字。\n\n笔尖刚离开纸面，书页就渗出一行新的字。\n\n<span class="r">"谢谢你。"</span>\n\n<span class="r">"现在，你有名字了。"</span>\n\n你愣住。\n\n你低头看自己的手。\n\n你的手，正在变得透明。\n\n你赶紧把名字划掉。\n\n划了三道。\n\n手恢复了一点。\n\n但书页上，又渗出新的字：\n\n<span class="g">"没关系。你已经借过了。"</span>\n\n<span class="g">"借阅上限：1。"</span>`,
  choices:[{t:"把书塞回书架，跑出去",to:"l_out",san:-18,set:{borrowed:true}}]},

/* ============ 操场 ============ */
"m_playground":{ch:"校园",title:"操场",
  text:`操场在校园东侧，跑道是红色的，中间是草坪。\n\n傍晚的操场有不少人，跑步的、踢球的、坐在草地上聊天的。\n\n你在跑道边坐下，看着夕阳。\n\n这是你入学以来，第一次觉得正常。\n\n"同学。"\n\n你转头。\n\n一个穿运动服的女生站在你旁边，手里拿着两瓶水。\n\n"能帮我个忙吗？"她指了指跑道，"我在数圈数，数到第十圈的时候，帮我喊一声。"\n\n"好。"\n\n她跑了起来。\n\n一圈、两圈、三圈……\n\n你数着。\n\n数到第八圈的时候，你忽然意识到——\n\n跑道上只有她一个人。\n\n但她经过你身边的时候，你听见的是两个人的脚步声。\n\n数到第九圈。\n\n她跑过你身边，气喘吁吁地说：\n\n"还有一圈。"\n\n你低头看。\n\n她的脚下，有两道影子。`,
  choices:[
    {t:"数到第十圈时，喊一声",to:"m_play_count",san:-8},
    {t:"立刻离开操场",to:"m_play_leave",san:-10},
    {t:"跟着她跑",to:"m_play_run",san:-14},
    {t:"问她：你的名字是什么？",to:"m_play_name",san:-6}
  ]},
"m_play_name":{ch:"校园",title:"名字",
  text:`"你的名字是什么？"\n\n她停下脚步，气喘吁吁地看着你。\n\n"你要知道我的名字？"\n\n"是。"\n\n她沉默了。\n\n然后她笑了笑。\n\n"我叫小满。"\n\n"2024 级。"\n\n"去年 10 月 14 日，我在操场上跑丢了。"\n\n她低头看了看自己的脚。\n\n"从那天起，我就一直在跑。"\n\n"跑到第十圈，就有人能看见我。"\n\n"跑到第一百圈，也许就有人能记住我。"`,
  choices:[
    {t:"告诉她：我记住你了",to:"m_remember",san:-4},
    {t:"沉默着看她跑",to:"m_play_count",san:-6}
  ]},
"m_remember":{ch:"校园",title:"记住",
  text:`"我记住你了。"\n\n她愣住。\n\n然后，她低下头。\n\n"你记住我了？"\n\n"嗯。"\n\n她抬起头的时候，脸上有泪。\n\n"谢谢。"\n\n"谢谢你还记得。"\n\n她转身，跑进夕阳里。\n\n跑道尽头，她的身影慢慢变淡。\n\n最后，连那道多余的影子，也没有了。\n\n草地上，留下一个东西。\n\n是一瓶水。\n\n水瓶上贴着一张标签：\n\n<span class="g">"谢谢你陪我。"</span>`,
  choices:[
    {t:"拿起那瓶水",to:"m_take_water",san:-6,set:{rememberXiaoMan:true}},
    {t:"不拿，回寝室",to:"d_back_dorm",san:-4,set:{rememberXiaoMan:true}}
  ]},
"m_play_count":{ch:"校园",title:"第十圈",
  text:`第十圈。\n\n她跑到你面前，停下来。\n\n"几圈了？"\n\n"十圈。"\n\n她笑了笑，弯腰撑着膝盖喘气。\n\n"谢谢。"\n\n她转身要走。\n\n"等等。"你叫住她，"你……为什么要在晚上跑步？"\n\n她回过头。\n\n"因为白天跑，会被人看见。"\n\n"看见什么？"\n\n"看见我只有一个人。"\n\n她走了。\n\n你低头看跑道。她刚才站过的地方，有两个湿脚印。\n\n一大一小。`,
  choices:[{t:"回寝室",to:"d_back_dorm",san:-8},{t:"记住她的名字",to:"m_remember",san:-4}]},
"m_play_leave":{ch:"校园",title:"离开",
  text:`你站起来，转身就走。\n\n身后传来脚步声。\n\n"同学，你去哪儿？还有一圈呢。"\n\n你没有回头，加快了脚步。\n\n脚步声也跟着快了。\n\n"就一圈。"那个声音说，"你答应过我的。"\n\n你跑了起来。\n\n跑出操场，跑过林荫道，跑进宿舍楼。\n\n上楼，进门，关门，反锁。\n\n你靠在门上喘气。\n\n门外，传来轻轻的敲门声。\n\n"咚。咚。咚。"\n\n三下。`,
  choices:[{t:"看猫眼",act:"interact",it:"peephole",san:-10},{t:"装睡，不理",to:"d_knock_ignore",san:-6}]},
"m_play_run":{ch:"校园",title:"跟着跑",
  text:`你站起来，跟着她跑。\n\n她的速度不快，但你怎么追都追不上。\n\n跑道在你脚下延伸。一圈，两圈，三圈。\n\n你数着。\n\n数到第十圈的时候，你抬头。\n\n前面已经没有人了。\n\n你停下来，喘着气。\n\n跑道边上，放着一瓶没开过的水。\n\n水瓶上贴着一张标签：\n\n<span class="r">"谢谢陪我。"</span>\n\n<span class="r">"我叫小满，2024 级。"</span>\n\n<span class="r">"去年 10 月 14 日，我在操场上跑丢了。"</span>`,
  choices:[{t:"拿起那瓶水",to:"m_take_water",san:-10},{t:"不拿，回寝室",to:"d_back_dorm",san:-8}]},
"m_take_water":{ch:"校园",title:"那瓶水",
  text:`你拿起那瓶水。\n\n水是冰的。\n\n你拧开盖子，犹豫了一下。\n\n你想起食堂的警告：不要吃第四样。\n\n但这是一瓶水。\n\n你喝了一口。\n\n很甜。\n\n你回到寝室，倒头就睡。\n\n第二天早上，你醒来，发现自己床头的日历上，多了一个日期：\n\n<span class="r">10 月 14 日</span>\n\n红笔圈出来的。\n\n你撕掉那一页。第二天，它又出现了。`,
  choices:[{t:"去上课",to:"t_enter",san:-12,set:{waterDrunk:true}},{t:"去找陈默",to:"d_chen_talk",san:-8,set:{waterDrunk:true}}]},

/* ============ 湖畔 ============ */
"w_enter":{ch:"校园",title:"湖畔",
  text:`校园的最西边，有一个小湖。\n\n湖水很暗，看不见底。\n\n岸边有一张旧长椅，长椅上放着一朵白花。\n\n你走过去。\n\n湖面很静。\n\n但静到一定程度，就会开始出问题。\n\n你看着湖面，湖面也在看你。\n\n——不，湖面里不是你的倒影。\n\n是另一个人。`,
  choices:[
    {t:"仔细看湖里的倒影",to:"w_look_reflection",san:-10},
    {t:"拿起那朵白花",to:"w_take_flower",san:-6},
    {t:"在长椅上坐下",to:"w_sit",san:-4}
  ]},
"w_look_reflection":{ch:"校园",title:"倒影",
  text:`你凑近湖面，仔细看。\n\n湖里那个人，长得和你一模一样。\n\n但她穿着一件深蓝色的外套。\n\n她看着你，慢慢开口。\n\n你没有听见声音，但你读出了口型：\n\n<span class="r">"你什么时候来换我？"</span>\n\n你后退一步。\n\n湖面泛起一圈涟漪。\n\n再看时，湖里只有你自己的倒影了。\n\n但你的外套——\n\n变成了深蓝色。`,
  choices:[
    {t:"立刻离开湖边",to:"l_out",san:-14,set:{sawReflection:true}},
    {t:"对着湖面说：我不换",to:"w_refuse",san:-10,set:{sawReflection:true}}
  ]},
"w_refuse":{ch:"校园",title:"拒绝",
  text:`"我不换。"\n\n湖面安静了一瞬。\n\n然后，从湖底，传来一个很远的声音：\n\n"你会的。"\n\n"每一个站在这里的人，最后都会换。"\n\n"因为——"\n\n"如果你不换，你就要替别人。"\n\n"你不想替别人。"\n\n"所以你只能换。"\n\n"这就是 403 的规则。"`,
  choices:[
    {t:"离开湖边",to:"l_out",san:-12,set:{sawReflection:true,knowsLakeTruth:true}},
    {t:"再问：你是谁？",to:"w_who",san:-10,set:{sawReflection:true,knowsLakeTruth:true}}
  ]},
"w_who":{ch:"校园",title:"你是谁",
  text:`"你是谁？"\n\n湖底沉默了很久。\n\n"我是 1949 年的那个。"\n\n"第一个。"\n\n"第一个被换的人。"\n\n"我在这湖里，已经泡了 76 年。"\n\n"每一年，我都在等一个人，愿意替我去上课。"\n\n"你能吗？"\n\n你后退。\n\n湖水忽然变得很平静。\n\n平静得像什么都没发生过。`,
  choices:[{t:"转身离开",to:"l_out",san:-14,set:{met1949:true,knowsLakeTruth:true}}]},
"w_take_flower":{ch:"校园",title:"白花",
  text:`你拿起那朵白花。\n\n花茎是断的。\n\n断口很新。\n\n你抬起头。\n\n湖对岸，站着一个人。\n\n她背对着你，穿着白裙子。\n\n"那朵花，是我放的。"\n\n她说。\n\n"每年 10 月 14 日，我都会放一朵。"\n\n"纪念一个，回不来的人。"\n\n"今年——"\n\n"是纪念你。"`,
  choices:[
    {t:"问她：你是谁？",to:"w_ask_white",san:-10,set:{hasFlower:true,metWhite:true}},
    {t:"转身离开",to:"l_out",san:-8,set:{hasFlower:true}}
  ]},
"w_ask_white":{ch:"校园",title:"白裙",
  text:`"你是谁？"\n\n她没有转身。\n\n"我是去年那个。"\n\n"去年这个时候，我也站在这里。"\n\n"有人在湖对岸，放了一朵白花。"\n\n"我拿起那朵花。"\n\n"然后我听见湖底有人说话。"\n\n"我拒绝了。"\n\n"第二天，我就变成了图书馆里那本《白裙》。"\n\n"你看过那本书吗？"\n\n她转过身。\n\n脸是模糊的。\n\n"没关系。"她说。\n\n"你很快就会看了。"`,
  choices:[{t:"离开湖边",to:"l_out",san:-12,set:{hasFlower:true,metWhite:true}}]},
"w_sit":{ch:"校园",title:"长椅",
  text:`你在长椅上坐下。\n\n椅子很凉。\n\n湖面很平静。\n\n你坐了很久，看着天色一点点暗下去。\n\n天完全黑的时候，你听见旁边有人说话。\n\n"这个位置，是我先坐的。"\n\n你转头。\n\n长椅的另一端，坐着一个女生。\n\n她很瘦，脸色很白。\n\n"你是今年的第四个？"\n\n"是。"\n\n"那你坐吧。"\n\n"我坐够了。"\n\n她站起来，走进湖里。\n\n没有溅起一点水花。`,
  choices:[
    {t:"站起来，回寝室",to:"d_back_dorm",san:-10,set:{metLakeGirl:true}},
    {t:"跟着她，看湖水深处",to:"w_deep_lake",san:-14,set:{metLakeGirl:true}},
    {t:"把白花放进湖里",to:"e_lake_peace",san:-8,need:(S)=>S.flags.hasFlower,lockHint:"需要白花"}
  ]},
"w_deep_lake":{ch:"校园",title:"湖水深处",
  text:`你走到湖边。\n\n湖水很黑。\n\n黑得不像水，像一扇门。\n\n你低头往里看。\n\n湖底有很多东西。\n\n眼镜、书包、笔、鞋。\n\n还有一本一本，深蓝色的书。\n\n每一本书脊上，都写着一个名字。\n\n你数了数。\n\n三十九本。`,
  choices:[
    {t:"离开湖边",to:"d_back_dorm",san:-12,set:{saw39Books:true}},
    {t:"伸手去捞其中一本",to:"w_grab_book",san:-16,set:{saw39Books:true}}
  ]},
"w_grab_book":{ch:"校园",title:"捞书",
  text:`你伸手，抓住离你最近的那本书。\n\n很轻。\n\n你把它拉上来。\n\n书脊上的名字，是"小满"。\n\n你翻开。\n\n第一页写着：\n\n<span class="r">"2024 年 9 月 8 日，我开始在操场上跑步。"</span>\n\n<span class="r">"跑到第十圈，就能看见我。"</span>\n\n<span class="r">"如果有人愿意记住我，我就能休息了。"</span>\n\n最后一页：\n\n<span class="g">"如果你读到了这一页，请告诉我，你记住我了。"</span>`,
  choices:[
    {t:"对着湖水说：我记住你了",to:"w_say_remember",san:-8,set:{hasXiaoManBook:true}},
    {t:"把书放回湖里",to:"d_back_dorm",san:-14,set:{hasXiaoManBook:true}}
  ]},
"w_say_remember":{ch:"校园",title:"记住",
  text:`"我记住你了。"\n\n湖水微微一颤。\n\n然后，从湖底传来轻轻的一声：\n\n"谢谢。"\n\n你手里的书，慢慢化成水。\n\n水流回湖里。\n\n湖面恢复了平静。\n\n只是从那天起，你每次经过操场，都会看到跑道上——\n\n有一个人在跑步。\n\n她跑完第十圈，就会对着你，笑一下。`,
  choices:[{t:"回寝室",to:"d_back_dorm",san:-4,set:{savedXiaoMan:true}}]},

/* ============ 老校区 ============ */
"o_enter":{ch:"隐藏",title:"老校区",
  text:`你沿着一条小路，往校园深处走。\n\n路越走越窄，树越来越密。\n\n最后，在树林深处，你看见了一片废墟。\n\n几栋老楼歪歪斜斜地立着，墙皮剥落，窗户破碎。\n\n最中间那栋楼，门口挂着一块牌子。\n\n牌子上的字已经看不清了。\n\n但你能勉强辨认出：\n\n<span class="r">"老校区 · 1987 年封闭"</span>`,
  choices:[
    {t:"走进去",to:"o_inside",san:-10},
    {t:"回到校园",to:"l_out",san:-4}
  ]},
"o_inside":{ch:"隐藏",title:"老校区 · 内部",
  text:`你走进老楼。\n\n楼道很暗，地板一踩就响。\n\n你扶着墙往前走。\n\n墙上有旧报纸，报纸已经发黄。\n\n你凑近看。\n\n报纸的日期是 1987 年 10 月 14 日。\n\n头条是：\n\n<span class="r">【临江大学四名学生失踪，校方称正在调查】</span>\n\n下面有一张照片。\n\n照片上是四个女生。\n\n她们站在一栋楼前。\n\n楼的门牌上写着：403。`,
  choices:[
    {t:"继续往里走",to:"o_room",san:-12},
    {t:"把报纸撕下来带走",to:"o_take_paper",san:-10},
    {t:"顺着楼梯往下，去地下室",to:"o_basement",san:-8}
  ]},
"o_basement":{ch:"隐藏",title:"老校区 · 地下室",
  text:`楼梯很陡，越往下越冷。\n\n地下室的门虚掩着，推开时有"吱呀"一声。\n\n里面堆满了旧箱子。最深处有一张桌子，桌上放着一把铜钥匙。\n\n钥匙柄上刻着一个数字：<span class="g">13</span>。\n\n钥匙下面压着一张纸条，字迹已经褪色：\n\n<span class="d">"如果你拿走了这把钥匙——"</span>\n\n<span class="d">"说明你已经走到了不该走的地方。"</span>`,
  choices:[
    {t:"拿起钥匙，原路返回",to:"o_room",set:{hasKey:true}},
    {t:"往地下室更深处走",to:"e_tunnel",san:-20,danger:true}
  ]},
"o_take_paper":{ch:"隐藏",title:"撕报纸",
  text:`你伸手，把报纸撕了下来。\n\n报纸很脆，一撕就碎。\n\n碎片落在你的手心。\n\n你低头看。\n\n碎片上的照片，还在。\n\n但那四个女生，只剩三个了。\n\n最右边那个，位置上空着。\n\n你翻过来看报纸的背面。\n\n背面有一行铅笔字，很淡：\n\n<span class="g">"第四个人，是后来加上去的。"</span>`,
  choices:[
    {t:"收好报纸碎片，往里走",to:"o_room",san:-10,set:{hasOldPaper:true}},
    {t:"退出老校区",to:"l_out",san:-6,set:{hasOldPaper:true}}
  ]},
"o_room":{ch:"隐藏",title:"老校区 · 房间",
  text:`走廊尽头，有一扇门。\n\n门上写着：403。\n\n你推开门。\n\n房间里很干净，不像废弃了几十年。\n\n一张床，一张桌。\n\n桌上放着一本深红色的册子。\n\n《新生手册》，烫金的数字是 403。\n\n你翻开。\n\n扉页上写着：\n\n<span class="r">"1987 级 张敏　1988 级 李岚　1989 级 王渔"</span>\n\n<span class="r">"1990 级 ——"</span>\n\n名单一直写到 2024 级。\n\n最后一栏，是 2025 级。\n\n空白。\n\n但空白处，有一个很浅的铅笔印。\n\n像是有人刚写过，又擦掉了。`,
  choices:[
    {t:"合上册子，离开房间",to:"l_out",san:-10,set:{sawOld403:true}},
    {t:"在空白处写下自己的名字",to:"e_namelist",san:-30,danger:true},
    {t:"把名单上的名字，一个一个折成纸鹤",to:"e_paper_crane",san:-15,need:(S)=>S.flags.sawNameList || S.flags.sawOld403,lockHint:"需要先看到名单"},
    {t:"走出老校区，但把这里记在心里",to:"e_old_campus",san:-10,need:(S)=>S.flags.hasOldPaper,lockHint:"需要带走旧报纸"}
  ]},

/* ============ 隐藏支线 ============ */
"h_door_claim":{ch:"隐藏",title:"403 门口 · 摊牌",
  text:`你站在门口，没有往里看。\n\n你先开口了：\n\n"我知道 403 的四人间是假的。"\n\n"我知道门后那张规则上，第七条被涂了。"\n\n"我也知道，你们在等一个'第四个'。"\n\n门里的空气，安静了一下。\n\n苏也的笑，慢慢收了回去。\n\n她侧过身，让开门口，用一种很平静的语气说：\n\n"你挺有意思的。"\n\n"进来吧。"\n\n"既然你都知道了——"\n\n"那就别装了。"\n\n你走进门。\n\n陈默从窗边抬起头，看了你一眼。\n\n那一眼里，第一次，有了点别的意思。\n\n像是在说：\n\n<span class="r">"终于来了个不装傻的。"</span>`,
  choices:[{t:"坐下，和三个人面对面",to:"d_meet",set:{smart:true,openCard:true,chenTrust:3}}]},
"h_coin_door":{ch:"隐藏",title:"铜钱 · 贴门",
  text:`你从枕头底下摸出那枚铜钱。\n\n红绳很旧，铜面很亮，握在手里是温的。\n\n你走到门边，把铜钱贴在门缝上。\n\n一瞬间——\n\n铜钱烫得像烧红的铁。\n\n你听见门外有什么东西，"嘶"地一声缩了回去。\n\n然后，是长长的、很轻的吸气声。\n\n像有人在门缝外面，贴着你的耳朵，吸了一口气。\n\n铜钱慢慢凉了下来。\n\n你低头看。\n\n铜面上，多了一道细细的裂纹。\n\n红绳还在。\n\n但铜钱，已经不像刚才那样沉了。\n\n门外，安静了很久。\n\n然后，你听见那个女生的声音，从很远的地方传来：\n\n"……有意思。"\n\n"这年头，还有人用这个。"`,
  choices:[{t:"回到床上，握住铜钱",to:"d_knock_ignore2",san:5,set:{chenTrust:4,coinCracked:true}}]},
"h_lib_truth":{ch:"隐藏",title:"图书馆 · 第 403 页",
  text:`你没有绕弯子。\n\n"我在找第 403 页。"\n\n老太太推眼镜的手，停在了半空中。\n\n她看了你很久。\n\n"你是今年那个？"\n\n"……什么？"\n\n"403 的第四个。"\n\n她把眼镜摘下来，放在柜台上。\n\n"我在这张桌子后面，坐了 47 年。"\n\n"每一个 403 的孩子，最后都会来问我一样的话。"\n\n"他们问：'怎么才能活下来？'"\n\n"我告诉他们同一句话——"\n\n她抬起眼。\n\n"不要写下你的名字。"\n\n"哪怕一次。"\n\n"哪怕只是一个笔画。"\n\n"只要你没写过，你就不在书里。"\n\n"只要不在书里，你就还有机会。"\n\n她从抽屉里摸出一张卡片，递给你。\n\n卡片背面，用很细的笔迹写着一行小字：\n\n<span class="g">"第 403 页的第一个名字，是我写的。"</span>\n\n<span class="g">"那年我 19 岁。"</span>`,
  choices:[{t:"收下卡片，道谢",to:"l_ask_card",san:-5,set:{hasCard:true,libTruth:true}}]},

/* ============ 结局 ============ */
"e_dawn_mid":{ch:"结局",ending:true,title:"结局 · 黎明",
  text:`你躺下。\n\n床很软，被子有阳光的味道。\n\n你闭上眼睛。\n\n这一次，你睡得很沉，没有梦。\n\n第二天早上，闹钟响了。\n\n你睁开眼。\n\n寝室里，苏也在刷牙，李薇在找眼镜，陈默坐在床边系鞋带。\n\n一切正常。\n\n你摸出《新生手册》。\n\n封皮上的烫金数字，从"403"变成了"——"。\n\n你翻开最后一页。\n\n空白纸上，那个浅浅的凹痕消失了。\n\n干干净净。\n\n你合上手册，扔进了垃圾桶。\n\n然后背上书包，出门上课。\n\n阳光很好。\n\n你想，也许今年，你可以正常地过一个学期。\n\n也许。\n\n——【黎明】结局达成。`,
  ending:"黎明",rank:"A"},
"e_dropout":{ch:"结局",ending:true,title:"结局 · 退学",
  text:`你去了教务处。\n\n教务处在一栋很新的大楼里，空调开得很足。\n\n窗口后面的老师很和气。\n\n"想退学？"\n\n"是。"\n\n"为什么？"\n\n"……不适应。"\n\n老师笑了笑，从抽屉里拿出一张表。\n\n"填吧。填完在这儿签字。"\n\n你拿起笔，正要写。\n\n笔尖悬在纸上。\n\n你想起陈默说过的话：\n\n"那个老师看了我一眼，说：'你确定？'"\n\n"我说确定。"\n\n"她就把一本册子推到我面前，让我签字。"\n\n"我签了。"\n\n"然后我醒来的时候，还躺在 403 的床上。"\n\n你放下笔。\n\n"老师，"你说，"我想再考虑一下。"\n\n老师抬起头，看着你，笑了。\n\n"好。"她说，"随时欢迎你回来。"\n\n"我们这儿，永远有人等你。"\n\n——【退学】结局达成。`,
  ending:"退学",rank:"C"},
"e_replace":{ch:"结局",ending:true,title:"结局 · 被替换",
  text:`你坐下了。\n\n椅子很凉。\n\n教室里的三十多个人，都转过头来看着你，露出满意的笑容。\n\n讲台上的老师，在黑板上写下你的名字，然后擦掉。\n\n"从今天起，"她说，"你就是第 4 个。"\n\n"第 4 个什么？"\n\n"第 4 个位置。"她说，"每年，这个位置都会空出来。"\n\n"然后，就会有一个人被填进来。"\n\n"今年是你。"\n\n"明年，会是谁呢？"\n\n你低下头，发现自己的手正在变成纸。\n\n很薄很白的纸。\n\n你的名字，正从你身上一点点脱落。\n\n教室里响起了下课铃。\n\n——【被替换】结局达成。`,
  ending:"被替换",rank:"F"},
"e_13f_end":{ch:"结局",ending:true,title:"结局 · 十三楼的住户",
  text:`你推开了门。\n\n门后是一间教室。\n\n教室里坐满了人，全都背对着你。\n\n讲台上，老师转过身来。\n\n"欢迎。"\n\n"你迟到了整整四年。"\n\n"没关系，从今天开始，你就在这里上课。"\n\n"上到什么时候？"\n\n"上到有人来替你。"\n\n你找了个位置坐下。\n\n前排的同学转过头，对你笑了笑。\n\n她穿着深蓝色的外套。\n\n"别担心。"她说，"这里挺好的。"\n\n"没有考试，没有论文，也没有毕业。"\n\n"只有一节课，一直上下去。"\n\n窗外的天，永远是黄昏。\n\n——【十三楼的住户】结局达成。`,
  ending:"十三楼的住户",rank:"F"},
"e_blue":{ch:"结局",ending:true,title:"结局 · 深蓝",
  text:`你看清了她的脸。\n\n那是你自己的脸。\n\n只是穿着一件深蓝色的外套。\n\n"你好。"她说，"我等这一天很久了。"\n\n"你是——"\n\n"我是上一届的第四个。"她说，"我签了字，所以我活了下来。"\n\n"但活下来，是有代价的。"\n\n"代价就是，我得找到下一个人。"\n\n"找到下一个，愿意签字的人。"\n\n她从口袋里掏出一本深红色的册子。\n\n《临江大学 · 新生手册》。\n\n烫金的数字是"403"。\n\n"签吧。"她把笔递给你，"签了，你就自由了。"\n\n你接过笔。\n\n笔很凉。\n\n——【深蓝】结局达成。`,
  ending:"深蓝",rank:"F"},
"e_13f_class":{ch:"结局",ending:true,title:"结局 · 第 13 讲",
  text:`你走进教室，坐下了。\n\n这一节课，讲了很多东西。\n\n讲了怎么把一个人的名字，写在另一个位置上。\n\n讲了怎么把一个人的记忆，装进另一个身体里。\n\n讲了怎么让一个人，心甘情愿地留下来。\n\n下课铃响了。\n\n老师合上书。\n\n"今天的作业是——"\n\n"请各位同学，回去之后，找一个愿意代替你的人。"\n\n"找到了，下节课带来。"\n\n你站起来，走出教室。\n\n走廊里，你看见镜子里的自己。\n\n你穿着深蓝色的外套。\n\n——【第 13 讲】结局达成。`,
  ending:"第 13 讲",rank:"F"},
"e_dark":{ch:"结局",ending:true,title:"结局 · 黑暗",
  text:`你走向右边的黑暗。\n\n越走越黑，黑到看不见自己的手。\n\n你听见有人在前面说话。\n\n"又一个。"\n\n"今年的第四个。"\n\n"可怜。"\n\n你停下脚步。\n\n"谁？"\n\n"我们。"那些声音说，"我们是往年的第四个。"\n\n"我们都在这里。"\n\n"这里很好，很安静。"\n\n"你也可以留下来。"\n\n"留下来，就不用数楼梯了。"\n\n"就不用看猫眼了。"\n\n"就不用怕 10 月 14 日了。"\n\n你站在原地，很累，很累。\n\n然后你坐了下来。\n\n黑暗拥抱了你。\n\n——【黑暗】结局达成。`,
  ending:"黑暗",rank:"F"},
"e_canteen":{ch:"结局",ending:true,title:"结局 · 第四样菜",
  text:`你吃了那第四样菜。\n\n味道很好。好得不像话。\n\n你吃完，端着空盘子站起来，觉得浑身温暖。\n\n食堂里所有人都看着你，微笑着。\n\n打菜的阿姨摘下帽子，对你鞠了一躬。\n\n"谢谢你。"她说，"今年的名额，凑齐了。"\n\n你走出食堂。\n\n阳光很好。你走在梧桐道上，脚步轻快。\n\n你想起一件事。\n\n你不记得自己叫什么名字了。\n\n你摸了摸口袋，手册还在。\n\n封皮上的烫金数字，变成了"404"。\n\n你翻开最后一页，上面写着：\n\n<span class="r">"2025 年 10 月 14 日　第四样　【已签】"</span>\n\n——【第四样菜】结局达成。`,
  ending:"第四样菜",rank:"F"},
"e_lib":{ch:"结局",ending:true,title:"结局 · 一本书",
  text:`你在借书卡上，写下了自己的名字。\n\n写完的瞬间，你感觉身体变轻了。\n\n很轻，很轻，轻到可以飘起来。\n\n图书馆的灯一盏一盏地灭了。\n\n老太太站起来，走到书架前，把你插进一个空位。\n\n"这一排都是 403 的。"她说，"你是今年的第四本。"\n\n"以前的三本呢？"\n\n"前面那三本。"老太太指了指。\n\n你顺着她的手看去。\n\n书架上，三本书并排立着。\n\n书脊上分别写着：\n\n<span class="r">苏也</span>　<span class="r">李薇</span>　<span class="r">陈默</span>\n\n"她们什么时候来的？"\n\n"昨天。"老太太说，"她们比你早一天。"\n\n"那我的书名呢？"\n\n"你的书名，就是你的名字。"\n\n老太太关上了灯。\n\n图书馆里，一片安静。\n\n只有偶尔，会有翻书的声音。\n\n——【一本书】结局达成。`,
  ending:"一本书",rank:"F"},
"e_loop":{ch:"结局",ending:true,title:"结局 · 大二",
  text:`你活到了期末。\n\n考试、放假、回家。\n\n你坐在回家的火车上，看着窗外的风景，长长地舒了一口气。\n\n终于结束了。\n\n寒假过完，你回到学校。\n\n拖着行李箱，站在校门下。\n\n九月的风里有一股铁锈味。\n\n你抬头看牌匾。"临江大学"四个字，是暗红色的。\n\n你掏出手机。\n\n新生群还在跳消息：\n\n【新生A】有人知道为什么官网的校历只排到12月31日吗？\n【新生B】别问。\n【新生B】别问。\n【新生B】别问。\n【学姐-周】欢迎来到临江大学。请务必保管好你的《新生手册》。\n\n你愣住了。\n\n你低头看手机日期。\n\n<span class="r">九月八日。</span>\n\n你的行李里，有一本深红色的册子，烫金的数字是"403"。\n\n你翻开第一页。\n\n校长致辞：<span class="r">"希望各位同学在临江大学度过四年，或者更久，或者更短……"</span>\n\n你合上册子，往宿舍楼走去。\n\n梧桐叶绿得发黑。\n\n——【大二】结局达成。`,
  ending:"大二",rank:"D"},
"e_selfstudy":{ch:"结局",ending:true,title:"结局 · 永远的晚自习",
  text:`你被困在 13 楼的教室里。\n\n老师讲了一节课，又一节课。\n\n第一节讲"如何成为别人"。\n\n第二节讲"如何让别人成为你"。\n\n第三节讲"如何忘记自己的名字"。\n\n下课铃响了，又响了。\n\n你坐在座位上，看着窗外。\n\n窗外永远是黄昏。\n\n你身边的同学换了一批又一批。\n\n有时候你转过头，发现旁边坐着的人，你认识。\n\n有时候你发现，那是你自己。\n\n后来你不再转头了。\n\n你只是低头做题。\n\n题目是：\n\n<span class="r">"请写出你的名字。"</span>\n\n你拿着笔，迟迟没有写下去。\n\n因为你已经不记得了。\n\n——【永远的晚自习】结局达成。`,
  ending:"永远的晚自习",rank:"F"},
"e_rule":{ch:"结局",ending:true,title:"结局 · 成为规则",
  text:`你活过了 10 月 14 日。\n\n但代价是，你在 403 的门后，写下了一行字。\n\n那行字，是第七条。\n\n写完的一瞬间，你感觉自己的身体变得很薄，很轻，像一张纸。\n\n你飘起来，贴在了门后。\n\n门后那张泛黄的规则上，多了第七条：\n\n<span class="r">"七、不要在半夜，数寝室里有几张床。"</span>\n\n然后你看见门被推开。\n\n一个拖着行李箱的新生走了进来。\n\n她环顾四周，数了数。\n\n"一、二、三……"\n\n她愣住了。\n\n"怎么只有三张床？"\n\n你想开口提醒她。\n\n但你只是一行字。\n\n你什么也做不了。\n\n——【成为规则】结局达成。`,
  ending:"成为规则",rank:"S"},
"e_grad":{ch:"结局",ending:true,title:"结局 · 毕业",
  text:`你做到了。\n\n你在 10 月 14 日之前，找到了 1999 年版《临江校志》的第 403 页。\n\n你把自己的名字划掉了。\n\n然后，你在手册的最后一页，写下了另一行字：\n\n<span class="r">"名额：作废。"</span>\n\n那一晚，整栋宿舍楼都停电了。\n\n黑暗中，你听见无数人在走廊里走动。她们走了一整夜。\n\n天亮的时候，你打开门。\n\n走廊里空无一人。\n\n地上散落着很多张借书卡，每一张上面都写着名字。\n\n你把它们一张张捡起来，抱到图书馆，放在前台。\n\n老太太看了看那摞卡片，又看了看你。\n\n"你知道这意味着什么吗？"\n\n"什么？"\n\n"意味着，很多人的名字，终于可以还给你们了。"\n\n她站起来，对你鞠了一躬。\n\n那是你见过的，最老的一个鞠躬。\n\n四年后。\n\n你穿着学士服，站在校门口。\n\n牌匾上的字，颜色淡了很多。\n\n你把手里的《新生手册》扔进垃圾桶。\n\n这一次，它没有回来。\n\n你转身离开。\n\n身后，校门上的字，慢慢变回了普通的红漆。\n\n——【毕业】结局达成。\n\n<span class="g">（真结局 · 感谢游玩）</span>`,
  ending:"毕业",rank:"SS"},
"e_mad":{ch:"结局",ending:true,title:"结局 · 你成了流言",
  text:`你的理智归零了。\n\n你不再相信任何人，也不再相信自己的眼睛。\n\n你开始数楼梯。一遍，一遍，一遍。\n\n你开始看猫眼。一看就是几个小时。\n\n你开始在半夜，对着镜子说话。\n\n"我在这里。"\n\n"我在这里。"\n\n"我在这里。"\n\n后来，寝室里的人搬走了。\n\n再后来，没有人知道 403 住过谁。\n\n只有新生群里偶尔会有人说：\n\n"听说 403 有个学姐，半夜会在走廊里走。"\n\n"她会敲门。"\n\n"她会问：同学，我的钥匙掉了，能帮我开下门吗？"\n\n"千万别开。"\n\n"那不是学姐。"\n\n——【你成了流言】结局达成。`,
  ending:"你成了流言",rank:"F"},
"e_namelist":{ch:"结局",ending:true,title:"结局 · 名单上的人",
  text:`你在《临江校志》第 403 页上，看见了自己的名字。\n\n不是空白，不是凹痕。\n\n是真真切切印上去的名字。\n\n你盯着那三个字，盯了很久。\n\n然后你意识到——\n\n你已经不在书外面了。\n\n你在书里面。\n\n你在看着一个新生，翻开这本书，看到你的名字。\n\n就像你现在这样。\n\n你想告诉她：快跑。\n\n可是书页上，只能留下文字。\n\n于是你在名字旁边，用尽全力，写下了一行小字。\n\n那行字是：\n\n<span class="r">"别签。"</span>\n\n——【名单上的人】结局达成。`,
  ending:"名单上的人",rank:"C"},
"e_guard":{ch:"结局",ending:true,title:"结局 · 守夜人",
  text:`你找到保安，把事情全部告诉了她。\n\n她听完，沉默了很久。\n\n"你想好了？"\n\n"想好了。"\n\n"守夜人，一做就是二十年。"她说，"不能离开这栋楼。"\n\n"楼里所有的人，你都要记住她们的名字。"\n\n"少记住一个，就会多一个名额。"\n\n"你确定？"\n\n"我确定。"\n\n她点点头，从抽屉里拿出一顶帽子，递给你。\n\n"戴上吧。"\n\n你戴上帽子，站在教学楼一楼的大厅里。\n\n灯很亮。\n\n钟表走着，一格，一格。\n\n窗外，天黑了，又亮了。\n\n很多年过去了。\n\n你记住了一届又一届学生的名字。\n\n偶尔有新生跑来问你：\n\n"师傅，这栋楼有 13 层吗？"\n\n你会说：\n\n"没有。"\n\n"你记错了。"\n\n——【守夜人】结局达成。`,
  ending:"守夜人",rank:"A"},
"e_balcony":{ch:"结局",ending:true,title:"结局 · 阳台",
  text:`你走到阳台上，想透透气。\n\n夜里的风很凉。\n\n你扶着栏杆，看着校园里的灯。\n\n"你也睡不着？"\n\n一个声音从旁边传来。\n\n你转头。\n\n阳台的另一头，站着一个人。\n\n是李薇。\n\n"你什么时候来的？"\n\n"一直在这儿。"李薇说，"我在等一个人。"\n\n"等谁？"\n\n"等一个愿意听我说话的人。"\n\n她转过身，看着你。\n\n"你知道吗？我们寝室，其实有四个人。"\n\n"我知道。"\n\n"不，你不知道。"李薇说，"我说的不是苏也、陈默和你。"\n\n"我说的是——那个一直站在阳台上的。"\n\n你顺着她的目光，往阳台角落看去。\n\n那里什么都没有。\n\n但栏杆上，有一双手印。\n\n很新。\n\n——【阳台】结局达成。`,
  ending:"阳台",rank:"C"},
"e_chen":{ch:"结局",ending:true,title:"结局 · 陈默的结局",

const ONCE_ONLY_ITEMS = ['hasCharm','hasTea','hasUmbrella','hasNote','hasCoin','hasBell'];
function applyFlags(setObj){
  if(!setObj) return;
  const filtered = {};
  Object.keys(setObj).forEach(k=>{
    if(ONCE_ONLY_ITEMS.includes(k)){
      if(S.flags[k + 'Obtained']) return;
      filtered[k] = setObj[k];
      filtered[k + 'Obtained'] = true;
    } else {
      filtered[k] = setObj[k];
    }
  });
  Object.assign(S.flags, filtered);
}

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('on'), 1900);
}
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

function triggerHorrorEffect(intensity){
  document.body.classList.remove('scare-flash', 'scare-shake');
  void document.body.offsetWidth;
  if(intensity === 'heavy'){ document.body.classList.add('scare-flash', 'scare-shake'); }
  else { document.body.classList.add('scare-shake'); }
  setTimeout(()=>{ document.body.classList.remove('scare-flash', 'scare-shake'); }, 500);
}

function updateHUD(){
  if(!S) return;
  const pct = clamp(S.sanity, 0, 100);
  $('sanbar').style.width = pct + '%';
  $('sanbar').style.background = pct > 60
    ? 'linear-gradient(90deg,#5d4a2a,#b39a5f)'
    : pct > 30 ? 'linear-gradient(90deg,#6b4a1e,#c08b3a)' : 'linear-gradient(90deg,#5a1c1c,#c04a4a)';
  $('santxt').textContent = pct;

  const overlay = $('horror-overlay');
  overlay.className = '';
  if(pct <= 30){ overlay.className = 'san-low'; }
  else if(pct <= 55){ overlay.className = 'san-mid'; }

  const owned = ITEM_DEFS.filter(it => S.flags[it.flag]);
  $('itemtxt').textContent = owned.length ? '· ' + owned.map(it=>it.name).join(' · ') : '';
  $('itemtxt').title = owned.length ? owned.map(it=>it.name).join(' / ') + '（点击打开背包）' : '背包是空的';
}

function openViewer(title, html, kind, useFlag){
  $('viewerTitle').textContent = title;
  const body = $('viewerBody');
  body.className = 'viewer-body' + (kind ? ' kind-' + kind : '');
  let extra = '';
  if(useFlag){
    const def = ITEM_DEFS.find(it=>it.flag===useFlag);
    if(def && def.usable && S.flags[useFlag]){
      extra = '<button class="viewer-use" onclick="useItem(\'' + useFlag + '\')">使 用</button>';
    }
  }
  body.innerHTML = html + extra;
  $('viewer').classList.add('on');
}
function closeViewer(){ $('viewer').classList.remove('on'); }

function inspectItem(flag){
  if(!S || !S.flags[flag]) return;
  const def = ITEM_DEFS.find(it => it.flag === flag);
  if(!def || !def.view) { toast('这件东西没什么好看的'); return; }
  const v = def.view();
  openViewer(v.title, v.html, '', def.usable ? flag : '');
}

function openBag(){
  if(!S) S = newState();
  if(S.flags.hasPhone === undefined) S.flags.hasPhone = true;

  const p = $('panel');
  const owned = ITEM_DEFS.filter(it => S.flags[it.flag]);
  let html = '<h2>背 包</h2>';

  if(!owned.length){
    html += '<div class="slot item"><div class="info"><b>空空如也</b><small class="wrap">你身上什么也没有。也许该去找找陈默。</small></div></div>';
  } else {
    owned.forEach(it=>{
      const clickable = !!it.view || it.usable;
      html += '<div class="slot item' + (it.usable ? ' usable' : '') + (clickable ? ' clickable' : '') + '"' +
              (clickable ? ' onclick="inspectItem(\'' + it.flag + '\')"' : '') + '>';
      html += '<div class="info"><b>' + it.name + '</b><small class="wrap">' + (it.desc || '') + '</small></div>';
      html += '<div class="acts">';
      if(it.usable){
        html += '<button class="mini" onclick="event.stopPropagation();useItem(\'' + it.flag + '\')">使用</button>';
      } else if(clickable){
        html += '<span class="mini" style="border-color:#2a2d33;color:#5d5a55">查看</span>';
      }
      html += '</div></div>';
    });
  }
  html += '<button class="close" onclick="closeMask()">关 闭</button>';
  p.innerHTML = html;
  $('mask').classList.add('on');
}

function useItem(flag){
  if(!S || !S.flags[flag]){ toast('你没有这件物品'); return; }
  if(flag === 'hasCoin'){
    if(S.sanity >= 100){ toast('你现在神志清醒，还用不上它'); return; }
    S.flags.hasCoin = false;
    S.flags.coinUsed = true;
    S.sanity = clamp(S.sanity + 80, 0, 100);
    document.body.classList.remove('heal-flash');
    void document.body.offsetWidth;
    document.body.classList.add('heal-flash');
    setTimeout(()=>document.body.classList.remove('heal-flash'), 850);
    closeViewer(); updateHUD();
    toast('铜钱在掌心碎成灰。理智 +80');
    if($('mask').classList.contains('on')) openBag();
    autoSave();
    return;
  }
  toast('这件东西没法用');
}
