/* ══════════ 躲避系统 ══════════ */
let dodgeState = null;
function startDodge(count, nextNode){
  dodgeState = { total:count, done:0, hits:0, nextNode };
  runDodgeRound();
}
function runDodgeRound(){
  const d = dodgeState;
  const times = [1500, 1200, 900, 600];
  const duration = times[Math.min(d.done, times.length-1)];
  const dd = $('dodge');
  $('dodgeCount').textContent = `· 第 ${d.done+1} / ${d.total} 次 ·`;
  $('dodgeHint').textContent = '立刻点击按钮 · 时间不多了';
  dd.classList.add('on','shake');
  const bar = $('dodgeTimerBar');
  bar.style.transition = 'none'; bar.style.width = '100%';
  void bar.offsetWidth;
  bar.style.transition = `width ${duration}ms linear`;
  bar.style.width = '0%';
  let clicked = false;
  const btn = $('dodgeBtn');
  const timer = setTimeout(()=>{
    if(!clicked){ finishRound(false); }
  }, duration);
  const onClick = ()=>{
    if(clicked) return;
    clicked = true; clearTimeout(timer);
    finishRound(true);
  };
  btn.onclick = (e)=>{ e.stopPropagation(); onClick(); };
  dd.onclick = onClick;
  function finishRound(success){
    dd.classList.remove('on','shake');
    dd.onclick = null; btn.onclick = null;
    if(success){ d.hits++; triggerHorrorEffect('light'); }
    else { S.sanity = clamp(S.sanity - 12, 0, 100); updateHUD(); triggerHorrorEffect('heavy'); }
    d.done++;
    if(d.done >= d.total){ endDodge(); }
    else { setTimeout(runDodgeRound, 120); }
  }
}
function endDodge(){
  const d = dodgeState; dodgeState = null;
  const hits = d.hits, total = d.total;
  const r = $('dodgeResult');
  let title, body, nextNode;
  if(hits === total){
    title = '完 美 躲 避';
    body = `你在 ${total} 次袭击中全部躲开了。\n\n袭击者扑了个空。`;
    S.sanity = clamp(S.sanity + 5, 0, 100);
    nextNode = (d.nextNode === 's_after_dodge') ? 's_safe' : d.nextNode;
  } else if(hits >= total - 1){
    title = '险 些 躲 过';
    body = `你躲开了大部分袭击。\n\n但还是受了一点伤。`;
    S.sanity = clamp(S.sanity - 15, 0, 100);
    nextNode = (d.nextNode === 's_after_dodge') ? 's_escape' : (d.nextNode === 'j_attack_safe' ? 'j_run_from_jinmo' : d.nextNode);
  } else if(hits >= 1){
    title = '受 伤';
    body = `你躲开了部分袭击。\n\n肩膀被划了一道。`;
    S.sanity = clamp(S.sanity - 40, 0, 100);
    nextNode = (d.nextNode === 's_after_dodge') ? 's_su_hurt' : (d.nextNode === 'j_attack_safe' ? 'j_run_from_jinmo' : d.nextNode);
  } else {
    title = '被 击 中';
    body = `你一次也没躲开。\n\n眼前一黑。`;
    S.sanity = clamp(S.sanity - 60, 0, 100);
    nextNode = (d.nextNode === 's_after_dodge') ? 's_hit' : (d.nextNode === 'j_attack_safe' ? 'j_run_from_jinmo' : d.nextNode);
  }
  updateHUD();
  if(S.sanity <= 0){ closeDodgeResult(); goto('e_mad'); return; }
  $('dodgeResultTitle').textContent = title;
  $('dodgeResultBody').textContent = body;
  r.classList.add('on');
  $('dodgeResultBtn').onclick = ()=>{ closeDodgeResult(); goto(nextNode); };
}
function closeDodgeResult(){ $('dodgeResult').classList.remove('on'); }

function renderInteractOptions(list){
  const box = $('itActions');
  box.innerHTML = '';
  (list||[]).forEach(o=>{
    const b = document.createElement('button');
    b.className = 'ch';
    b.innerHTML = o.t;
    b.onclick = ()=>{
      if(o.san) S.sanity = clamp(S.sanity + o.san, 0, 100);
      if(o.set) applyFlags(o.set);
      checkAutoCharm();
      if(o.danger || (o.san && o.san <= -10)) triggerHorrorEffect('heavy');
      closeInteract(); updateHUD();
      if(o.to) goto(o.to); else render(true);
    };
    box.appendChild(b);
  });
}

function openInteract(key){
  const it = INTERACTS[key];
  if(!it) return;
  window._elevLock = false;
  $('itTitle').textContent = it.title || '';
  $('itScreen').innerHTML = (it.screen || '') + (it.story ? `<div class="it-story">${it.story}</div>` : '');
  renderInteractOptions(it.options);
  $('interact').classList.add('on');
  $('interact').querySelector('.it-screen').scrollTop = 0;
  if(it.init) it.init();
}
function closeInteract(){ $('interact').classList.remove('on'); }

let camPendingNode = null;
let camShot = false;
function openCamera(nextNode){
  camPendingNode = nextNode || null; camShot = false;
  const th = $('camThumb'); th.className = 'cam-thumb'; th.style.opacity = '0'; th.innerHTML = '';
  $('camShutter').disabled = false; $('camTip').textContent = '点 击 快 门 拍 照';
  $('camDone').classList.add('hide'); $('camera').classList.add('on');
}
function takePhoto(){
  if(camShot) return;
  camShot = true; S.flags.tookPhoto = true;
  $('camShutter').disabled = true;
  const fl = $('camFlash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
  setTimeout(()=>{
    const th = $('camThumb'); th.innerHTML = ''; th.style.opacity = '';
    th.classList.remove('pop'); void th.offsetWidth; th.classList.add('pop');
    $('camTip').textContent = '照片在右下角 · 点开看看';
    $('camDone').classList.remove('hide'); autoSave();
  }, 340);
}
function viewPhoto(){ if(!camShot) return; openViewer('相 册 · 校门', PHOTO_HTML, 'photo'); }
function finishCamera(){
  $('camera').classList.remove('on');
  const n = camPendingNode; camPendingNode = null; if(n) goto(n);
}
const PHOTO_HTML = `
  <div class="photo-frame">
    <div class="photo-img">
      <div class="pi-gate"><div class="pi-sign">临江大学</div></div>
      <div class="pi-people"><span></span><span></span><span></span><span></span></div>
      <div class="pi-blue"></div><div class="pi-ground"></div>
    </div>
    <div class="photo-meta"><span>IMG_0914.JPG</span><span>2025-09-08 15:42</span></div>
  </div>
  <p class="photo-cap">照片里，校门下站着很多人——拖着行李的新生、举牌的志愿者、撑伞的家长。</p>
  <p class="photo-cap">你数了数。你数不清。</p>
  <p class="photo-cap r">照片右下角，有个穿深蓝色外套的女生正对着镜头笑。</p>
  <p class="photo-cap r">她没有影子。</p>
  <p class="photo-cap d">（放大看，她的脸是模糊的。她举着一块牌子，上面写着：欢迎新同学 · 第 4 届。）</p>
`;

function goto(id){
  if(!STORY[id]){ console.error('缺失节点：', id); return; }

  // 终局高压倒计时：进入 t_final 后每秒 -1 理智
  if(id === 't_final'){
    if(finalTensionTimer) clearInterval(finalTensionTimer);
    finalTensionTimer = setInterval(()=>{
      if(!S || S.node !== 't_final'){ clearInterval(finalTensionTimer); finalTensionTimer = null; return; }
      S.sanity = clamp(S.sanity - 1, 0, 100);
      updateHUD();
      checkAutoCharm();
      S.sanity = clamp(S.sanity, 0, 100);
      if(S.sanity <= 0){
        clearInterval(finalTensionTimer); finalTensionTimer = null;
        goto('e_mad');
      }
    }, 1000);
  } else {
    if(finalTensionTimer){ clearInterval(finalTensionTimer); finalTensionTimer = null; }
  }

  S.node = id; S.steps++;

  const n = STORY[id];
  let sanLoss = 0;
  if(!S.entered[id]){
    S.entered[id] = true;
    if(n.san){ sanLoss = n.san; S.sanity += n.san; }
    if(n.set) applyFlags(n.set);
  }
  S.sanity = clamp(S.sanity, 0, 100);

  checkAutoCharm();
  S.sanity = clamp(S.sanity, 0, 100);

  if(sanLoss <= -12 || n.danger || id.startsWith('e_') || id.includes('knock_open') || id.includes('13f') || id.includes('stare')){
    triggerHorrorEffect(sanLoss <= -15 || id.startsWith('e_') ? 'heavy' : 'light');
  }
  if(S.sanity <= 0 && !n.ending){ S.node = 'e_mad'; triggerHorrorEffect('heavy'); }
  autoSave(); render();
}

function render(noAnim){
  const n = STORY[S.node];
  $('chapter').textContent = '— ' + (n.ch || '') + ' —';

  const pct = clamp(S.sanity, 0, 100);
  updateHUD();

  const story = $('story');
  story.innerHTML = '<h1 class="title">' + (n.title||'') + '</h1><div id="text"></div>';
  if(!noAnim){
    story.style.animation='none'; void story.offsetWidth; story.style.animation='fade .55s ease';
  }
  let renderedText = n.text || '';
  if(pct <= 35){ renderedText = renderedText.replace(/class="r"/g, 'class="r glitch-txt"'); }
  typeText($('text'), renderedText);

  const box = $('choices'); box.innerHTML = '';

  if(n.ending){
    const b = document.createElement('div');
    b.className = 'ending-box';
    b.innerHTML = '<div class="ending-tag">E N D I N G</div>' +
      '<div class="ending-name">' + (n.ending) + '</div>' +
      '<div class="ending-sub">评级 ' + (n.rank||'-') + '　·　步数 ' + S.steps + '　·　剩余理智 ' + S.sanity + '<br><br>你无法重来这一周目。<br>除非读取存档。</div>';
    box.appendChild(b);
    const btn = document.createElement('button');
    btn.className = 'ch'; btn.style.textAlign = 'center'; btn.innerHTML = '读 取 存 档';
    btn.onclick = openMenu; box.appendChild(btn);
    return;
  }

  (n.choices||[]).forEach((c, i)=>{
    if(c.show && !c.show(S)) return;
    const key = S.node + ':' + i;
    if(c.once && S.used[key]) return;

    const locked = !!(c.need && !c.need(S));
    const btn = document.createElement('button');
    btn.className = 'ch' + (locked ? ' locked' : '') + (!locked && c.need ? ' cleared' : '');
    let inner = c.t;
    if(c.hint) inner += '<span class="hint">' + c.hint + '</span>';
    if(locked) inner += '<span class="hint"><b>🔒 ' + (c.lockHint || '条件未满足') + '</b></span>';
    btn.innerHTML = inner;

    btn.onclick = ()=>{
      if(locked){ toast('条件未满足：' + (c.lockHint || '')); return; }
      if(c.act === 'camera' || c.act === 'interact' || c.act === 'dodge'){
        if(c.san) S.sanity = clamp(S.sanity + c.san, 0, 100);
        if(c.set) applyFlags(c.set);
        checkAutoCharm();
        updateHUD();
        if(c.act === 'camera') openCamera(c.to);
        else if(c.act === 'interact') openInteract(c.it);
        else if(c.act === 'dodge') startDodge(c.dodgeCount||3, c.dodgeNext||c.to);
        return;
      }
      S.used[key] = true;
      if(c.san) S.sanity += c.san;
      if(c.set) applyFlags(c.set);
      S.sanity = clamp(S.sanity,0,100);
      checkAutoCharm();
      S.sanity = clamp(S.sanity,0,100);
      if(c.danger || (c.san && c.san <= -10)) triggerHorrorEffect('heavy');
      goto(c.to);
    };
    box.appendChild(btn);
  });
  window.scrollTo({top:0, behavior:'smooth'});
}

function typeText(el, txt){
  clearInterval(typingTimer);
  el.innerHTML = txt; el.style.opacity = 0;
  let o = 0;
  typingTimer = setInterval(()=>{
    o += 0.08; el.style.opacity = o;
    if(o >= 1) clearInterval(typingTimer);
  }, 16);
}

function openMenu(){
  closeViewer(); closeInteract();
  const p = $('panel');
  let html = '<h2>存 档 管 理</h2>';
  const slotNames = {auto:'自动存档', s1:'存档位 1', s2:'存档位 2', s3:'存档位 3', s4:'存档位 4', s5:'存档位 5', s6:'存档位 6'};
  ['auto','s1','s2','s3','s4','s5','s6'].forEach(k=>{
    const d = SLOTS[k];
    let info = '<b>' + slotNames[k] + '</b><small>（空）</small>';
    if(d){
      const t = new Date(d.time);
      const tm = (t.getMonth()+1) + '/' + t.getDate() + ' ' +
                 String(t.getHours()).padStart(2,'0') + ':' +
                 String(t.getMinutes()).padStart(2,'0');
      const nd = STORY[d.node] || {};
      info = '<b>' + slotNames[k] + '</b><small>' + tm + '　' + (nd.ch||'') + ' · ' + (nd.title||'') + '　理智 ' + d.state.sanity + '</small>';
    }
    html += '<div class="slot"><div class="info">' + info + '</div><div class="acts">';
    if(k !== 'auto') html += '<button class="mini" onclick="doSave(\'' + k + '\')">存档</button>';
    if(d) html += '<button class="mini" onclick="doLoad(\'' + k + '\')">读档</button>';
    html += '</div></div>';
  });
  html += '<div style="margin-top:16px;padding-top:14px;border-top:1px solid #22242a">';
  html += '<button class="mini danger" style="width:100%;padding:11px" onclick="doRestart()">重新开始新的一周目</button>';
  html += '</div>';
  html += '<button class="close" onclick="closeMask()">关 闭</button>';
  p.innerHTML = html; $('mask').classList.add('on');
}
function closeMask(){ $('mask').classList.remove('on'); }
function doSave(k){
  if(S.node === 'e_mad' || (STORY[S.node] && STORY[S.node].ending)){ toast('结局无法存档'); return; }
  saveTo(k); toast('已存档'); openMenu();
}
function doLoad(k){
  if(!SLOTS[k]){ toast('该存档位为空'); return; }
  loadFrom(k); toast('已读档');
}
function doRestart(){
  if(!confirm('确定要重新开始吗？\n\n当前进度将被覆盖，且无法恢复。')) return;
  if(finalTensionTimer){ clearInterval(finalTensionTimer); finalTensionTimer = null; }
  S = newState(); SLOTS.auto = null; persist();
  closeMask(); closeViewer(); closeInteract(); render(true);
}

function initTitle(){
  loadSaves();
  if(SLOTS.auto){
    const d = SLOTS.auto;
    const nd = STORY[d.node] || {};
    $('btn-continue').style.display = 'block';
    $('btn-continue').textContent = '继 续（' + (nd.title||'').slice(0,8) + '）';
  }
  $('btn-continue').onclick = ()=>{
    if(SLOTS.auto){
      S = clone(SLOTS.auto.state); S.node = SLOTS.auto.node;
      if(S.flags.hasPhone === undefined) S.flags.hasPhone = true;
      hideTitle(); render(true);
    }
  };
  $('btn-new').onclick = ()=>{
    if(SLOTS.auto && !confirm('已有进行中的存档。\n\n开始新的一周目会覆盖自动存档，且无法恢复。\n\n确定吗？')) return;
    S = newState(); hideTitle(); goto('start');
  };
  $('btn-load').onclick = ()=>{ S = S || newState(); openMenu(); };
}
function hideTitle(){ $('title-screen').style.display = 'none'; }

/* ═══════ BGM ═══════
   建议把 mp3 下载到本地，文件名改成 'bgm1.mp3' / 'bgm2.mp3'，
   这是最可靠的方案。远程源仅作备份，挂掉会自动切下一个。 */
const BGM_LIST = [
  { name:'Waltz in 17edo',
    src:'https://cdn.jsdelivr.net/gh/appleandding/ypyp@main/waltz%20in17edo(%E7%BA%AF%E4%BA%AB%E9%9F%B3%E4%B9%90%E7%89%88)%20-%20NyxLunx%26%E8%8B%8F%E5%AD%90%E5%A2%A8%26Sixteen.mp3' },
  { name:'Waltz in 21edo',
    src:'https://cdn.jsdelivr.net/gh/appleandding/ypyp@main/Waltz%20in%2021edo%20-%20Deister%20Orchestra.mp3' }
];

const bgmAudio = new Audio();
bgmAudio.preload = 'auto';
bgmAudio.volume = 0.4;

let bgmIndex   = 0;
let bgmUnlocked = false;
const bgmBroken = new Set();

function bgmTryPlay(){
  if(bgmBroken.size >= BGM_LIST.length){
    console.warn('[BGM] 所有音源均不可用，已静音');
    return;
  }
  while(bgmBroken.has(bgmIndex)){
    bgmIndex = (bgmIndex + 1) % BGM_LIST.length;
  }
  const cur = BGM_LIST[bgmIndex];
  bgmAudio.src = cur.src;
  const p = bgmAudio.play();
  if(p && p.catch){
    p.catch(err=>{
      if(err && err.name !== 'NotAllowedError'){
        console.warn('[BGM] 加载失败：', cur.name, err);
        bgmBroken.add(bgmIndex);
        bgmIndex = (bgmIndex + 1) % BGM_LIST.length;
        setTimeout(bgmTryPlay, 250);
      }
    });
  }
}

bgmAudio.addEventListener('ended', ()=>{
  bgmIndex = (bgmIndex + 1) % BGM_LIST.length;
  bgmTryPlay();
});
bgmAudio.addEventListener('error', ()=>{
  console.warn('[BGM] 资源错误：', BGM_LIST[bgmIndex].name);
  bgmBroken.add(bgmIndex);
  bgmIndex = (bgmIndex + 1) % BGM_LIST.length;
  if(bgmBroken.size < BGM_LIST.length) setTimeout(bgmTryPlay, 250);
});

function initBGM(){
  bgmTryPlay();
  const unlock = ()=>{
    if(bgmAudio.paused){
      bgmAudio.play()
        .then(()=>{ bgmUnlocked = true; })
        .catch(()=>{});
    }
    if(bgmUnlocked){
      window.removeEventListener('pointerdown', unlock);
      window.removeEventListener('touchstart',  unlock);
      window.removeEventListener('keydown',     unlock);
    }
  };
  window.addEventListener('pointerdown', unlock, { passive:true });
  window.addEventListener('touchstart',  unlock, { passive:true });
  window.addEventListener('keydown',     unlock);
}

window.addEventListener('load', ()=>{
  S = newState(); initTitle(); initBGM();
  $('mask').addEventListener('click', e=>{ if(e.target === $('mask')) closeMask(); });
  $('viewer').addEventListener('click', e=>{ if(e.target === $('viewer')) closeViewer(); });
  $('interact').addEventListener('click', e=>{ if(e.target === $('interact')) closeInteract(); });
  console.log('《临江大学·新生手册》剧情节点数：' + Object.keys(STORY).length);
});
</script>
